    <script>
        // Раскладка интерфейса: phone / tablet / desktop (см. CSS "АДАПТИВНЫЕ РАСКЛАДКИ").
        // Выставляется до отрисовки страницы, чтобы на телефоне не "мигала" десктопная версия.
        function computeLayout() {
            var w = window.innerWidth;
            var h = window.innerHeight;
            var touchFirst = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);
            if (Math.min(w, h) < 600 || w < 700) return 'phone';
            return touchFirst ? 'tablet' : 'desktop';
        }
        document.documentElement.dataset.layout = computeLayout();
        document.documentElement.dataset.orientation = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';
    </script>

    <style>
        @font-face {
            font-family: 'SysfontC';
            src: url('fonts/SysfontC.woff2') format('woff2'),
                 url('fonts/SysfontC.woff') format('woff');
            font-weight: normal;
            font-style: normal;
            font-display: swap;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'SysfontC', monospace;
            overflow: hidden;
            background: #ffffff;
            color: #000000;
        }

        #container {
            position: relative;
            width: 100vw;
            height: 100vh;
        }

        #videoElement {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0;
            transform: scaleX(-1);
            transition: opacity 0.3s;
            z-index: 1;
        }

        #canvas {
            touch-action: none; /* Браузер не прокручивает/масштабирует страницу пальцем или пером */
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 2;
        }

        #controls {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #ffffff;
            padding: 12px 16px 16px;
            border: 2px solid #000000;
            border-radius: 0;
            box-shadow: 4px 4px 0 rgba(0,0,0,1);
            z-index: 10;
            max-width: 320px;
            transition: transform 0.3s ease, opacity 0.3s ease;
            font-family: 'SysfontC', monospace;
        }

        #controls.minimized {
            transform: translateX(calc(100% + 20px));
            opacity: 0;
            pointer-events: none;
        }

        h2 {
            font-size: 16px;
            margin-bottom: 10px;
            color: #000000;
            font-weight: bold;
            font-family: 'SysfontC', monospace;
            text-transform: uppercase;
        }

        .control-group {
            margin-bottom: 10px;
        }

        label {
            display: block;
            font-size: 14px;
            margin-bottom: 4px;
            color: #000000;
            font-family: 'SysfontC', monospace;
        }

        /* Macintosh System 1.0 стиль для слайдеров */
        input[type="range"] {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: transparent;
            cursor: pointer;
            margin: 10px 0;
            border-radius: 0;
            border: black 2px solid;
        }

        /* Трек слайдера (дорожка) - Chrome/Safari */
        input[type="range"]::-webkit-slider-track {
            width: 100%;
            height: 6px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            box-sizing: border-box;
        }

        /* Трек слайдера (дорожка) - Firefox */
        input[type="range"]::-moz-range-track {
            width: 100%;
            height: 6px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            box-sizing: border-box;
        }

        /* Ползунок слайдера - Chrome/Safari */
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 12px;
            height: 20px;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
            margin-top: 0;
            border-radius: 0;
            box-shadow: none;
            box-sizing: border-box;
        }

        /* Ползунок слайдера - Firefox */
        input[type="range"]::-moz-range-thumb {
            width: 12px;
            height: 20px;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
            border-radius: 0;
            box-shadow: none;
            box-sizing: border-box;
        }

        /* Активный ползунок */
        input[type="range"]:active::-webkit-slider-thumb {
            background: #000000;
        }

        input[type="range"]:active::-moz-range-thumb {
            background: #000000;
        }

        /* Macintosh System 1.0 стиль для чекбоксов */
        input[type="checkbox"] {
            -webkit-appearance: none;
            -moz-appearance: none;
            appearance: none;
            width: 14px;
            height: 14px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            cursor: pointer;
            position: relative;
            vertical-align: middle;
            margin-right: 6px;
        }

        /* Галочка для отмеченного чекбокса */
        input[type="checkbox"]:checked::before {
            content: '×';
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 16px;
            font-weight: bold;
            color: #000000;
            line-height: 1;
        }

        /* Фокус на чекбоксе */
        input[type="checkbox"]:focus {
            outline: 1px dotted #000000;
            outline-offset: 2px;
        }

        select {
            width: 100%;
            padding: 6px;
            margin-top: 4px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            font-family: 'SysfontC', monospace;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000000;
            accent-color: #000000;
        }

        select:hover {
            background: #dddddd;
        }

        select:focus {
            outline: 2px solid #000000;
            outline-offset: 2px;
        }

        select option {
            background: #ffffff;
            color: #000000;
        }

        select option:checked,
        select option:hover,
        select option:focus,
        select option:active {
            background: #000000 !important;
            color: #ffffff !important;
            background-color: #000000 !important;
        }

        /* Custom select styles */
        .custom-select {
            position: relative;
            width: 100%;
            margin-top: 4px;
        }

        .custom-select-trigger {
            width: 100%;
            padding: 6px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            font-family: 'SysfontC', monospace;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            box-shadow: 2px 2px 0 #000000;
            text-transform: uppercase;
            box-sizing: border-box;
        }

        .custom-select-trigger:hover {
            background: #dddddd;
        }

        .custom-select-options {
            display: none;
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #ffffff;
            border: 2px solid #000000;
            border-top: none;
            box-shadow: 2px 2px 0 #000000;
            z-index: 1000;
            max-height: 200px;
            overflow-y: auto;
        }

        .custom-select.open .custom-select-options {
            display: block;
        }

        .custom-option {
            padding: 6px;
            font-family: 'SysfontC', monospace;
            font-size: 14px;
            color: #000000;
            cursor: pointer;
            text-transform: uppercase;
            background: #ffffff;
        }

        .custom-option:hover {
            background: #000000;
            color: #ffffff;
        }

        .custom-option.selected {
            background: #000000;
            color: #ffffff;
        }

        input[type="color"] {
            border: 2px solid #000000;
            border-radius: 0;
            cursor: pointer;
            background: #ffffff;
        }

        input[type="color"]:hover {
            border-color: #000000;
        }

        .value-display {
            display: inline-block;
            margin-left: 10px;
            color: #000000;
            font-weight: bold;
            font-family: 'SysfontC', monospace;
        }

        button {
            width: 100%;
            padding: 6px 12px;
            margin-top: 6px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            color: #000000;
            font-weight: bold;
            cursor: pointer;
            font-family: 'SysfontC', monospace;
            font-size: 14px;
            box-shadow: 2px 2px 0 #000000;
            text-transform: uppercase;
        }

        button:hover {
            background: #dddddd;
        }

        button:active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            margin-bottom: 10px;
        }

        .checkbox-group input {
            margin-right: 10px;
            width: 20px;
            height: 20px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            color: #000000;
        }

        #status {
            position: absolute;
            bottom: 20px;
            left: 20px;
            background: #ffffff;
            padding: 8px 14px;
            font-size: 14px;
            color: #000000;
            box-shadow: 2px 2px 0 #000000;
            border: 2px solid #000000;
            border-radius: 0;
            z-index: 10;
            font-family: 'SysfontC', monospace;
        }

        .gesture-hint {
            position: absolute;
            top: 20px;
            left: 20px;
            background: #ffffff;
            padding: 15px 20px;
            padding-top: 30px;
            font-size: 14px;
            color: #000000;
            box-shadow: 4px 4px 0 #000000;
            border: 2px solid #000000;
            border-radius: 0;
            max-width: 300px;
            z-index: 10;
            transition: transform 0.3s ease, opacity 0.3s ease;
            font-family: 'SysfontC', monospace;
        }

        .gesture-hint.minimized {
            transform: translateX(calc(-100% - 20px));
            opacity: 0;
            pointer-events: none;
        }

        .gesture-hint strong {
            display: block;
            margin-bottom: 8px;
            color: #000000;
            font-size: 16px;
            text-transform: uppercase;
        }

        .audio-indicator {
            position: absolute;
            bottom: 20px;
            right: 20px;
            width: 150px;
            height: 40px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            box-shadow: 2px 2px 0 #000000;
            overflow: hidden;
            z-index: 10;
        }

        .audio-bars {
            display: flex;
            align-items: flex-end;
            height: 100%;
            padding: 5px;
            gap: 2px;
        }

        .audio-bar {
            flex: 1;
            background: #000000;
            border-radius: 0;
            transition: height 0.1s;
        }

        /* Кнопки сворачивания панелей */
        .toggle-btn {
            position: absolute;
            width: 36px;
            height: 36px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            z-index: 11;
            font-size: 18px;
            box-shadow: 2px 2px 0 #000000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            font-family: 'SysfontC', monospace;
        }

        .toggle-btn:hover {
            background: #dddddd;
        }

        .toggle-btn:active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        #toggleHints {
            top: 20px;
            left: 20px;
            opacity: 1;
            pointer-events: auto;
        }

        #toggleControls {
            top: 20px;
            right: 20px;
        }

        .toggle-btn.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Кнопка закрытия панели */
        .close-panel {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 20px;
            height: 20px;
            min-width: 20px;
            min-height: 20px;
            background: #ffffff;
            border: 2px solid #000000;
            border-radius: 0;
            cursor: pointer;
            padding: 0;
            margin: 0;
            font-size: 14px;
            line-height: 18px;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            font-family: 'SysfontC', monospace;
            font-weight: bold;
            box-shadow: 2px 2px 0 #000000;
        }

        .close-panel:hover {
            background: #dddddd;
        }

        .close-panel:active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        /* === ШАПКА ПАНЕЛЕЙ, ГРУППЫ НАСТРОЕК, ПЕРЕКЛЮЧАТЕЛЬ РЕЖИМА === */

        /* Заголовок и кнопка закрытия в одной строке. Раньше крестик был абсолютно спозиционирован:
           в палитре его перекрывала полоса "Drag to move", на планшете он наезжал на заголовок. */
        .panel-header {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            background: #ffffff;
            user-select: none;
        }

        .panel-title {
            flex: 1;
            margin: 0;
            font-size: 16px;
            font-weight: bold;
            text-transform: uppercase;
            font-family: 'SysfontC', monospace;
        }

        .panel-header .close-panel {
            position: static;
            margin: 0;
        }

        .panel-drag-hint {
            font-size: 12px;
            color: #555555;
            text-transform: uppercase;
        }

        #paletteHandle {
            cursor: move;
        }

        .panel-group-title {
            margin: 14px 0 6px;
            padding-top: 8px;
            border-top: 2px solid #000000;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .panel-header + .panel-group-title {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        /* Несколько кнопок в строку (Lock / Unlock / Clear, экспорт) */
        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row button {
            flex: 1;
            margin-top: 0;
            padding-left: 6px;
            padding-right: 6px;
        }

        /* Переключатель режима "Gestures | Editor" вверху по центру */
        #modeSwitch {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            z-index: 16;
        }

        .mode-option {
            width: auto;
            margin: 0;
            padding: 6px 14px;
            display: flex;
            align-items: center;
            gap: 6px;
            border: none;
            box-shadow: none;
            font-size: 14px;
            white-space: nowrap;
        }

        .mode-option + .mode-option {
            border-left: 2px solid #000000;
        }

        .mode-option svg {
            width: 20px;
            height: 20px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .mode-option.active,
        .mode-option.active:hover {
            background: #000000;
            color: #ffffff;
        }

        /* === PAINT РЕЖИМ РЕДАКТОРА === */

        /* Палитра цветов внизу (как в Paint) */
        #colorPalette {
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            padding: 10px 12px 12px;
            display: none;
            z-index: 15;
            pointer-events: none; /* Панель прозрачна для событий мыши - можно рисовать сквозь неё */
        }

        #colorPalette.active {
            display: block;
        }

        #colorPalette .color-section {
            margin-bottom: 8px;
        }

        /* Только конкретные интерактивные элементы внутри палитры ловят события */
        #colorPalette button,
        #colorPalette input,
        #colorPalette .color-swatch,
        #colorPalette .panel-header,
        #colorPalette label {
            pointer-events: auto;
        }

        #bgClearBtn {
            margin-top: 0px;
        }

        #colorPalette .label-paint {
            font-size: 14px;
            color: #000000;
            font-family: 'SysfontC', monospace;
            margin-bottom: 4px;
            text-transform: uppercase;
        }

        #colorGrid {
            display: grid;
            grid-template-columns: repeat(14, 20px);
            gap: 2px;
        }

        .color-swatch {
            width: 20px;
            height: 20px;
            border: 2px solid #000000;
            cursor: pointer;
            box-shadow: none;
        }

        .color-swatch:hover {
            border: 3px solid #000000;
            box-shadow: none;
        }

        .color-swatch.selected {
            border: 4px solid #000000;
        }

        /* Текущий цвет = поле выбора произвольного цвета (раньше это были две отдельные секции) */
        .current-color {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            cursor: pointer;
            font-size: 13px;
        }

        .current-color input[type="color"] {
            width: 56px;
            height: 32px;
            padding: 0;
            border: 2px solid #000000;
            cursor: pointer;
            flex-shrink: 0;
        }

        /* Кнопки режима заливки */
        .fill-mode-btn {
            flex: 1;
            padding: 4px 8px;
            font-size: 14px;
            background: #ffffff;
            border: 2px solid #000000;
            cursor: pointer;
            font-family: 'SysfontC', monospace;
            color: #000000;
            box-shadow: 2px 2px 0 #000000;
            text-transform: uppercase;
        }

        .fill-mode-btn:hover {
            background: #dddddd;
        }

        .fill-mode-btn:active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        .fill-mode-btn.active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        /* === ПАНЕЛЬ ИНСТРУМЕНТОВ === */
        #toolbox {
            position: absolute;
            top: 50%;
            left: 20px;
            transform: translateY(-50%);
            background: #ffffff;
            padding: 10px;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            z-index: 15;
            font-family: 'SysfontC', monospace;
            transition: transform 0.3s ease, opacity 0.3s ease;
        }

        #toolbox.minimized {
            transform: translate(calc(-100% - 20px), -50%);
            opacity: 0;
            pointer-events: none;
        }

        /* Группы кнопок разделены линией (заголовки секций убраны: под каждой кнопкой теперь подпись) */
        .toolbox-section + .toolbox-section {
            margin-top: 8px;
            padding-top: 8px;
            border-top: 2px solid #000000;
        }

        .tool-grid,
        .action-grid {
            display: grid;
            grid-template-columns: repeat(2, 64px);
            gap: 6px;
        }

        .tool-btn,
        .action-btn {
            width: 64px;
            height: 66px;
            padding: 4px 2px 3px;
            margin: 0;
            background: #ffffff;
            color: #000000;
            border: 2px solid #000000;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            transition: none;
            box-shadow: 2px 2px 0 #000000;
        }

        .tool-btn:hover,
        .action-btn:hover {
            background: #dddddd;
        }

        .tool-btn:active, .tool-btn.active,
        .action-btn:active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        /* Неактивная кнопка (нечего отменять, не выбрана молекула) - заметно бледнее */
        .action-btn:disabled,
        .action-btn:disabled:hover {
            background: #ffffff;
            color: #000000;
            cursor: not-allowed;
            opacity: 0.35;
            box-shadow: 2px 2px 0 #000000;
        }

        /* Подпись под иконкой: иконки нарисованы от руки и без подписи не всегда понятны */
        .tool-label {
            display: block;
            font-size: 10px;
            line-height: 1;
            text-transform: uppercase;
            pointer-events: none;
        }

        .tool-icon {
            width: 38px;
            height: 38px;
            object-fit: contain;
            pointer-events: none; /* Чтобы клики проходили на кнопку */
        }

        .action-btn img {
            width: 30px;
            height: 30px;
            object-fit: contain;
            pointer-events: none;
        }

        /* =====================================================================
           АДАПТИВНЫЕ РАСКЛАДКИ
           <html data-layout="phone|tablet|desktop" data-orientation="portrait|landscape">
           выставляет computeLayout() (скрипт в <head>) и updateLayout() при ресайзе:
           - phone:   короткая сторона экрана < 600px или окно уже 700px;
           - tablet:  сенсорный экран (палец - основной указатель) от 600px;
           - desktop: всё остальное.
           Раньше мобильные стили включались по ширине 768px, а логика панелей - по типу
           устройства, и на планшетах/коротких окнах они расходились.
           ===================================================================== */

        [hidden] {
            display: none !important;
        }

        /* Иконки новых кнопок панели (SVG в стиле остальных иконок) */
        .action-btn svg {
            width: 30px;
            height: 30px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2.2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        .action-btn.active {
            background: #000000;
            color: #ffffff;
            box-shadow: none;
        }

        /* Десктоп: панели прокручиваются, если не помещаются по высоте
           (на ноутбуках с низким окном нижние кнопки и раздел Export уходили за экран) */
        #toolbox {
            max-height: calc(100vh - 150px);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        #controls {
            max-height: calc(100vh - 40px);
            overflow-y: auto;
            scrollbar-width: thin;
        }

        /* Десктоп: палитра - широкая и низкая, секции в колонках. Узкая высокая колонка
           на ноутбуках с невысоким окном закрывала середину холста. */
        [data-layout="desktop"] #colorPalette.active {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
            column-gap: 16px;
            align-items: start;
            width: max(480px, min(920px, calc(100vw - 680px))); /* Не заходит под панель настроек справа */
            max-height: calc(100vh - 140px);
            overflow-y: auto;
        }

        [data-layout="desktop"] #colorGrid {
            grid-template-columns: repeat(auto-fill, 20px);
        }

        /* Над нижней строкой (статус и индикатор звука), иначе палитра закрывала подсказки статуса */
        [data-layout="desktop"] #colorPalette {
            bottom: 60px;
        }

        [data-layout="desktop"] #colorPalette .panel-header {
            grid-column: 1 / -1;
            margin: 0 0 8px;
            padding-bottom: 6px;
            border-bottom: 2px solid #000000;
        }

        /* === Карточка загрузки жестов, подсказки, кнопка смены камеры === */
        #engineCard {
            position: absolute;
            top: 72px;
            left: 50%;
            transform: translateX(-50%);
            width: min(340px, calc(100vw - 24px));
            padding: 12px 44px 12px 14px;
            background: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0 #000000;
            z-index: 25;
            font-family: 'SysfontC', monospace;
        }

        #engineCard .close-panel {
            top: 8px;
            right: 8px;
        }

        .engine-title {
            font-size: 14px;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 6px;
        }

        .engine-message {
            font-size: 14px;
            line-height: 1.4;
        }

        .engine-note {
            font-size: 12px;
            line-height: 1.4;
            margin-top: 6px;
        }

        .engine-note:empty {
            display: none;
        }

        .engine-progress {
            height: 12px;
            margin-top: 8px;
            border: 2px solid #000000;
            background: #ffffff;
            overflow: hidden;
        }

        .engine-progress-bar {
            height: 100%;
            width: 0;
            background: #000000;
            transition: width 0.2s;
        }

        /* Неизвестная длительность (запуск движка) - бегущая полоска */
        .engine-progress.indeterminate .engine-progress-bar {
            width: 30%;
            animation: engine-indeterminate 1.2s linear infinite;
        }

        @keyframes engine-indeterminate {
            from { transform: translateX(-100%); }
            to { transform: translateX(340%); }
        }

        #engineRetry {
            width: auto;
            margin-top: 10px;
            padding: 6px 16px;
        }

        #hintToast {
            position: absolute;
            left: 50%;
            bottom: 64px;
            transform: translateX(-50%);
            width: min(440px, calc(100vw - 24px));
            display: flex;
            gap: 12px;
            align-items: flex-start;
            padding: 12px 14px;
            background: #000000;
            color: #ffffff;
            border: 2px solid #000000;
            box-shadow: 4px 4px 0 rgba(0, 0, 0, 0.25);
            font-family: 'SysfontC', monospace;
            font-size: 14px;
            line-height: 1.45;
            z-index: 26;
        }

        #hintText {
            flex: 1;
        }

        #hintClose {
            width: auto;
            flex-shrink: 0;
            margin: 0;
            padding: 4px 10px;
            background: #ffffff;
            color: #000000;
            box-shadow: none;
        }

        #toggleCamera {
            top: 20px;
            left: 64px;
            padding: 0;
            margin: 0;
        }

        #toggleCamera svg {
            width: 22px;
            height: 22px;
            fill: none;
            stroke: currentColor;
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            pointer-events: none;
        }

        #toggleCamera:disabled {
            opacity: 0.5;
            cursor: progress;
        }

        [data-layout="phone"] #engineCard {
            top: calc(64px + env(safe-area-inset-top));
        }

        [data-layout="phone"] #hintToast {
            bottom: calc(var(--toolbar-h) + 44px);
        }

        [data-layout="tablet"] #hintToast {
            bottom: calc(70px + env(safe-area-inset-bottom));
        }

        [data-layout="phone"] #toggleCamera {
            top: calc(10px + env(safe-area-inset-top));
            left: calc(62px + env(safe-area-inset-left));
        }

        [data-layout="tablet"] #toggleCamera {
            top: calc(16px + env(safe-area-inset-top));
            left: calc(72px + env(safe-area-inset-left));
        }

        /* ---------- Общее для телефона и планшета ---------- */

        [data-layout="phone"] #container,
        [data-layout="tablet"] #container {
            height: 100vh;
            height: 100dvh; /* Без учёта выезжающей адресной строки мобильных браузеров */
        }

        /* Перетаскивание палитры - только на десктопе */
        [data-layout="phone"] .panel-drag-hint,
        [data-layout="tablet"] .panel-drag-hint {
            display: none;
        }

        [data-layout="phone"] #paletteHandle,
        [data-layout="tablet"] #paletteHandle {
            cursor: default;
        }

        /* Шапка выезжающей панели прилипает к верху при прокрутке: крестик всегда под рукой */
        [data-layout="phone"] .panel-header,
        [data-layout="tablet"] .panel-header {
            position: sticky;
            top: 0;
            z-index: 2;
            margin: 0 0 8px;
            padding: 10px 0 8px;
            border-bottom: 2px solid #000000;
        }

        [data-layout="phone"] .panel-header + .panel-group-title,
        [data-layout="tablet"] .panel-header + .panel-group-title {
            margin-top: 10px;
        }

        /* Панели настроек и палитры - выезжающие листы, управляемые классами
           .minimized (настройки) и .active (палитра). Видна только одна панель за раз. */
        [data-layout="phone"] #controls,
        [data-layout="phone"] #colorPalette,
        [data-layout="tablet"] #controls,
        [data-layout="tablet"] #colorPalette {
            position: fixed;
            display: block;
            max-width: none;
            overflow-y: auto;
            overscroll-behavior: contain;
            -webkit-overflow-scrolling: touch;
            pointer-events: auto;
            z-index: 30;
            transition: transform 0.25s ease, opacity 0.25s ease;
        }

        [data-layout="phone"] #colorPalette:not(.active),
        [data-layout="tablet"] #colorPalette:not(.active),
        [data-layout="phone"] #controls.minimized,
        [data-layout="tablet"] #controls.minimized {
            opacity: 0;
            pointer-events: none;
        }

        /* Крупные элементы управления под палец (не меньше 44px) */
        [data-layout="phone"] #controls button:not(.close-panel),
        [data-layout="tablet"] #controls button:not(.close-panel) {
            min-height: 44px;
            font-size: 16px;
        }

        [data-layout="phone"] .close-panel,
        [data-layout="tablet"] .close-panel {
            width: 40px;
            height: 40px;
            min-width: 40px;
            min-height: 40px;
            font-size: 26px;
            line-height: 36px;
        }

        [data-layout="phone"] input[type="range"],
        [data-layout="tablet"] input[type="range"] {
            height: 14px;
            margin: 14px 0;
        }

        [data-layout="phone"] input[type="range"]::-webkit-slider-thumb,
        [data-layout="tablet"] input[type="range"]::-webkit-slider-thumb {
            width: 22px;
            height: 32px;
        }

        [data-layout="phone"] input[type="range"]::-moz-range-thumb,
        [data-layout="tablet"] input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 32px;
        }

        [data-layout="phone"] input[type="checkbox"],
        [data-layout="tablet"] input[type="checkbox"] {
            width: 24px;
            height: 24px;
        }

        [data-layout="phone"] .checkbox-group label,
        [data-layout="tablet"] .checkbox-group label {
            padding: 8px 0;
            font-size: 16px;
        }

        [data-layout="phone"] label,
        [data-layout="tablet"] label {
            font-size: 16px;
        }

        [data-layout="phone"] .custom-select-trigger,
        [data-layout="phone"] .custom-option,
        [data-layout="tablet"] .custom-select-trigger,
        [data-layout="tablet"] .custom-option {
            padding: 12px;
            font-size: 16px;
        }

        [data-layout="phone"] #colorGrid,
        [data-layout="tablet"] #colorGrid {
            grid-template-columns: repeat(auto-fill, 34px);
            gap: 4px;
        }

        [data-layout="phone"] .color-swatch,
        [data-layout="tablet"] .color-swatch {
            width: 34px;
            height: 34px;
        }

        [data-layout="phone"] .fill-mode-btn,
        [data-layout="tablet"] .fill-mode-btn {
            min-height: 40px;
            font-size: 15px;
        }

        [data-layout="phone"] #colorPalette input[type="color"],
        [data-layout="tablet"] #colorPalette input[type="color"] {
            min-height: 40px;
        }

        [data-layout="phone"] #colorPalette .color-section,
        [data-layout="tablet"] #colorPalette .color-section {
            margin-bottom: 14px;
        }

        /* ---------- Телефон ---------- */

        [data-layout="phone"] {
            /* Полная высота нижней панели (с safe-area). Точное значение выставляет JS
               (ResizeObserver), т.к. в портретной ориентации панель может занять две строки */
            --toolbar-h: calc(62px + env(safe-area-inset-bottom));
        }

        /* Верхние кнопки с учётом выреза экрана */
        [data-layout="phone"] .toggle-btn {
            width: 44px;
            height: 44px;
            font-size: 22px;
        }

        [data-layout="phone"] #toggleHints {
            top: calc(10px + env(safe-area-inset-top));
            left: calc(10px + env(safe-area-inset-left));
        }

        [data-layout="phone"] #toggleControls {
            top: calc(10px + env(safe-area-inset-top));
            right: calc(10px + env(safe-area-inset-right));
            opacity: 1;
            pointer-events: auto;
        }

        /* Переключатель режима - компактно сверху по центру */
        [data-layout="phone"] #modeSwitch {
            top: calc(10px + env(safe-area-inset-top));
            box-shadow: 2px 2px 0 #000000;
        }

        [data-layout="phone"] .mode-option {
            height: 40px;
            padding: 0 9px;
            font-size: 12px;
            gap: 4px;
        }

        [data-layout="phone"] .mode-option svg {
            width: 18px;
            height: 18px;
        }

        /* На узком телефоне подписи режимов не помещаются рядом с кнопками "?" и камеры */
        @media (max-width: 380px) {
            [data-layout="phone"] .mode-option span {
                display: none;
            }
        }

        /* Индикатор звука на телефоне скрыт: место сверху по центру занимает переключатель режима */
        [data-layout="phone"] .audio-indicator {
            display: none;
        }

        /* Строка статуса - над нижней панелью */
        [data-layout="phone"] #status {
            left: 50%;
            right: auto;
            transform: translateX(-50%);
            bottom: calc(var(--toolbar-h) + 8px);
            width: max-content;
            max-width: calc(100vw - 24px);
            padding: 4px 10px;
            font-size: 12px;
            line-height: 1.35;
            text-align: center;
            box-shadow: 2px 2px 0 #000000;
        }

        /* Нижняя панель инструментов в одну строку (прокручивается, если не помещается) */
        [data-layout="phone"] #toolbox {
            top: auto;
            left: 0;
            right: 0;
            bottom: 0;
            transform: none;
            display: flex;
            flex-direction: row;
            align-items: center;
            gap: 6px;
            max-height: none;
            padding: 6px calc(8px + env(safe-area-inset-right)) calc(6px + env(safe-area-inset-bottom)) calc(8px + env(safe-area-inset-left));
            border-width: 2px 0 0 0;
            box-shadow: none;
            overflow-x: auto;
            overflow-y: hidden;
            scrollbar-width: none;
            z-index: 20;
        }

        [data-layout="phone"] #toolbox::-webkit-scrollbar {
            display: none;
        }

        /* Вертикально все кнопки в одну строку не помещаются: убираем группировку по секциям
           и переносим кнопки сплошным потоком (в режиме жестов - 1 строка, в редакторе - 2),
           чтобы ни одна не пряталась за краем экрана. Инструменты рисования - первыми. */
        [data-layout="phone"][data-orientation="portrait"] #toolbox {
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            overflow-x: hidden;
            padding-left: calc(4px + env(safe-area-inset-left));
            padding-right: calc(4px + env(safe-area-inset-right));
        }

        [data-layout="phone"][data-orientation="portrait"] .toolbox-section:not([hidden]),
        [data-layout="phone"][data-orientation="portrait"] .tool-grid,
        [data-layout="phone"][data-orientation="portrait"] .action-grid {
            display: contents;
        }

        /* 42px: в режиме жестов все 8 кнопок помещаются в одну строку даже на экране 360px */
        [data-layout="phone"][data-orientation="portrait"] .tool-btn,
        [data-layout="phone"][data-orientation="portrait"] .action-btn {
            width: 42px;
            height: 42px;
            order: 2;
        }

        [data-layout="phone"][data-orientation="portrait"] .paint-tool-btn { order: 1; }
        [data-layout="phone"][data-orientation="portrait"] #action-lock,
        [data-layout="phone"][data-orientation="portrait"] #action-unlock { order: 3; }
        [data-layout="phone"][data-orientation="portrait"] #action-undo,
        [data-layout="phone"][data-orientation="portrait"] #action-redo { order: 4; }
        [data-layout="phone"][data-orientation="portrait"] #action-palette { order: 1; }

        [data-layout="phone"][data-orientation="portrait"] .tool-icon {
            width: 36px;
            height: 36px;
        }

        [data-layout="phone"][data-orientation="portrait"] .action-btn img,
        [data-layout="phone"][data-orientation="portrait"] .action-btn svg {
            width: 26px;
            height: 26px;
        }

        /* Верхние кнопки (?, ≡) - поверх выезжающих панелей, чтобы ≡ работала и при открытой палитре */
        [data-layout="phone"] .toggle-btn,
        [data-layout="tablet"] .toggle-btn {
            z-index: 35;
        }

        /* Боковая панель справа (планшет, телефон горизонтально) занимает угол кнопки ≡:
           прячем ≡, пока панель открыта - иначе она ложилась поверх крестика панели */
        [data-layout="tablet"].side-panel-open #toggleControls,
        [data-layout="phone"][data-orientation="landscape"].side-panel-open #toggleControls {
            opacity: 0;
            pointer-events: none;
        }


        [data-layout="phone"] .toolbox-section {
            display: flex;
            flex-shrink: 0;
            margin: 0;
            padding-right: 6px;
            border-right: 2px solid #000000;
        }

        [data-layout="phone"] .toolbox-section:last-child {
            border-right: none;
            padding-right: 0;
        }

        [data-layout="phone"] .toolbox-section + .toolbox-section {
            margin-top: 0;
            padding-top: 0;
            border-top: none;
        }

        /* На телефоне подписи не помещаются: что делает инструмент, пишет строка статуса */
        [data-layout="phone"] .tool-label {
            display: none;
        }

        [data-layout="phone"] .tool-btn,
        [data-layout="phone"] .action-btn {
            gap: 0;
        }

        [data-layout="phone"] .tool-grid,
        [data-layout="phone"] .action-grid {
            display: flex;
            gap: 6px;
        }

        [data-layout="phone"] .tool-btn,
        [data-layout="phone"] .action-btn {
            width: 48px;
            height: 48px;
            padding: 2px;
            flex-shrink: 0;
        }

        [data-layout="phone"] .tool-icon {
            width: 40px;
            height: 40px;
        }

        [data-layout="phone"] .action-btn img,
        [data-layout="phone"] .action-btn svg {
            width: 30px;
            height: 30px;
        }

        /* Листы настроек и палитры выезжают снизу, над панелью инструментов:
           инструменты остаются доступны при открытой палитре */
        [data-layout="phone"] #controls,
        [data-layout="phone"] #colorPalette {
            top: auto;
            left: 0;
            right: 0;
            bottom: var(--toolbar-h);
            width: auto;
            max-height: 58vh;
            max-height: 58dvh;
            padding: 0 calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left));
            border-width: 2px 0 0 0;
            box-shadow: 0 -4px 0 rgba(0, 0, 0, 0.15);
            transform: none;
        }

        [data-layout="phone"] #colorPalette:not(.active),
        [data-layout="phone"] #controls.minimized {
            transform: translateY(calc(100% + var(--toolbar-h)));
        }

        /* Телефон горизонтально: листы - справа во всю высоту над панелью */
        [data-layout="phone"][data-orientation="landscape"] #controls,
        [data-layout="phone"][data-orientation="landscape"] #colorPalette {
            top: 0;
            left: auto;
            width: min(380px, 55vw);
            max-height: none;
            padding-top: env(safe-area-inset-top);
            border-width: 0 0 0 2px;
            box-shadow: -4px 0 0 rgba(0, 0, 0, 0.15);
        }

        [data-layout="phone"][data-orientation="landscape"] #colorPalette:not(.active),
        [data-layout="phone"][data-orientation="landscape"] #controls.minimized {
            transform: translateX(calc(100% + 20px));
        }

        [data-layout="phone"] .panel-title {
            font-size: 18px;
        }

        /* ---------- Планшет ---------- */

        [data-layout="tablet"] .toggle-btn {
            width: 48px;
            height: 48px;
            font-size: 24px;
        }

        [data-layout="tablet"] #toggleHints {
            top: calc(16px + env(safe-area-inset-top));
            left: calc(16px + env(safe-area-inset-left));
        }

        [data-layout="tablet"] #toggleControls {
            top: calc(16px + env(safe-area-inset-top));
            right: calc(16px + env(safe-area-inset-right));
        }

        [data-layout="tablet"] #modeSwitch {
            top: calc(16px + env(safe-area-inset-top));
        }

        [data-layout="tablet"] .mode-option {
            height: 44px;
            padding: 0 16px;
            font-size: 15px;
        }

        [data-layout="tablet"] #status {
            left: calc(16px + env(safe-area-inset-left));
            bottom: calc(16px + env(safe-area-inset-bottom));
            font-size: 14px;
        }

        [data-layout="tablet"] .audio-indicator {
            right: calc(16px + env(safe-area-inset-right));
            bottom: calc(16px + env(safe-area-inset-bottom));
        }

        /* Боковая панель инструментов с крупными кнопками */
        [data-layout="tablet"] #toolbox {
            left: calc(16px + env(safe-area-inset-left));
            max-height: calc(100vh - 150px);
            max-height: calc(100dvh - 150px);
            padding: 8px;
        }

        [data-layout="tablet"] .tool-grid,
        [data-layout="tablet"] .action-grid {
            grid-template-columns: repeat(2, 76px);
            gap: 8px;
        }

        [data-layout="tablet"] .tool-btn,
        [data-layout="tablet"] .action-btn {
            width: 76px;
            height: 78px;
            padding: 4px;
        }

        [data-layout="tablet"] .tool-icon {
            width: 46px;
            height: 46px;
        }

        [data-layout="tablet"] .action-btn img,
        [data-layout="tablet"] .action-btn svg {
            width: 34px;
            height: 34px;
        }

        [data-layout="tablet"] .tool-label {
            font-size: 11px;
        }

        /* Настройки и палитра - боковые панели справа во всю высоту */
        [data-layout="tablet"] #controls,
        [data-layout="tablet"] #colorPalette {
            top: 0;
            right: 0;
            bottom: 0;
            left: auto;
            width: 360px;
            max-width: 45vw;
            max-height: none;
            padding: env(safe-area-inset-top) calc(20px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) 20px;
            border-width: 0 0 0 2px;
            box-shadow: -4px 0 0 rgba(0, 0, 0, 0.15);
            transform: none;
        }

        [data-layout="tablet"] #colorPalette:not(.active),
        [data-layout="tablet"] #controls.minimized {
            transform: translateX(calc(100% + 20px));
        }
    </style>
</head>
<body>
    <div id="container">
        <video id="videoElement" autoplay playsinline></video>
        <canvas id="canvas"></canvas>

    <script>
        // === ОПРЕДЕЛЕНИЕ МОБИЛЬНОГО УСТРОЙСТВА ===
        // Ноутбуки с сенсорным экраном НЕ считаются мобильными: основной указатель у них — мышь/тачпад.
        // iPadOS представляется как Mac, поэтому дополнительно проверяем грубый (пальцевый) указатель.
        const isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent) ||
                        (window.matchMedia && window.matchMedia('(pointer: coarse)').matches);

        const isTouchDevice = 'ontouchstart' in window || navigator.maxTouchPoints > 0;

        console.log('Мобильное устройство:', isMobile);
        console.log('Поддержка touch:', isTouchDevice);

        // === ПЕРЕМЕННЫЕ ДЛЯ TOUCH УПРАВЛЕНИЯ ===
        let initialPinchDistance = 0; // Для pinch-to-zoom
        let lastPinchAngle = 0; // Для поворота двумя пальцами
        let touchedMolecule = null; // Молекула которую трогают

        // Основные переменные
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const video = document.getElementById('videoElement');
        const statusEl = document.getElementById('status'); // не 'status': так называется window.status

        let width, height;
        let molecules = [];
        let hands = [];
        let audioLevel = 0;
        let isMouthOpen = false; // Текущее состояние рта
        let wasMouthOpen = false; // Предыдущее состояние рта для детекции открытия
        let mouthOpenFrames = 0; // Счётчик кадров с открытым ртом для стабилизации
        let editingMolecule = null; // Молекула в режиме редактирования
        let hoveredMolecule = null; // Молекула на которую наведена рука СЕЙЧАС
        let lastHoveredMolecule = null; // Последняя молекула на которую наводились

        // === РЕЖИМ РЕДАКТОРА ===
        let editorMode = false; // false = жесты, true = редактор
        let hoveredMoleculeEditor = null; // Молекула под курсором в редакторе

        // Инструмент рисования (fill, pencil, eraser). Пустая строка = активен инструмент молекул из панели.
        // По умолчанию выбран инструмент молекул "select", поэтому рисование изначально выключено.
        let currentTool = '';
        let lastPaintTool = 'fill'; // Инструмент рисования, который включается при входе в редактор
        let primaryColor = '#000000'; // Основной цвет
        let fillMode = 'both'; // Режим заливки: 'interior' (внутренность), 'edge' (контур), 'both' (оба)

        // === ИКОНКИ ЖЕСТОВ ===
        // Каждая иконка рисуется только когда она реально загрузилась (см. isImageReady),
        // поэтому ошибка загрузки одной иконки не ломает остальные.
        const gestureIcons = {
            open: new Image(),
            lock: new Image(),
            unlock: new Image(),
            delete: new Image()
        };
        gestureIcons.open.src = 'icons/open_hand.png';
        gestureIcons.lock.src = 'icons/lock_hand.png';
        gestureIcons.unlock.src = 'icons/unlock_hand.png';
        gestureIcons.delete.src = 'icons/delete_hand.png';

        function isImageReady(img) {
            return img && img.complete && img.naturalWidth > 0;
        }

        // === ФОРМЫ МОЛЕКУЛ ===
        let selectedShape = 'circle'; // Выбранная форма для создания молекул

        // === UI ИНСТРУМЕНТЫ ДЛЯ МОЛЕКУЛ ===
        let moleculeTool = 'select'; // select, create, delete
        let selectedMoleculeUI = null; // Молекула выбранная через UI
        let isDraggingMolecule = false; // Флаг перетаскивания/редактирования молекулы
        let dragOffsetX = 0; // Смещение курсора относительно центра молекулы
        let dragOffsetY = 0;
        let editStartX = 0; // Начальная позиция для редактирования
        let editStartY = 0;
        let editStartRadius = 0; // Начальный размер молекулы
        let editStartStretchX = 1; // Начальное растяжение по X
        let editStartStretchY = 1; // Начальное растяжение по Y
        let editStartAngle = 0; // Начальный угол поворота
        let copiedMolecule = null; // Буфер обмена для молекул
        let lastMouseX = 0; // Последняя позиция мыши для вставки
        let lastMouseY = 0;

        // Настройки карандаша
        let pencilWidth = 3; // Толщина карандаша в пикселях
        let smartEraserMode = false; // Режим умного ластика (удаляет целиком по клику)
        let drawnStrokes = []; // Массив нарисованных штрихов { points: [{x, y}], color: string, width: number }
        let currentStroke = null; // Текущий рисуемый штрих
        let isDrawing = false; // Флаг рисования
        let filledRegions = []; // Массив залитых областей { imageData: ImageData, x: number, y: number, width: number, height: number }
        let backgroundFills = []; // Массив фоновых заливок (рисуются под молекулами)

        // История для отмены действий (Ctrl+Z) и повтора (Ctrl+Shift+Z / Ctrl+Y)
        let undoHistory = []; // Стек состояний
        let redoStack = []; // Отменённые состояния для повтора
        const MAX_HISTORY_SIZE = 50; // Максимальное количество сохраненных состояний

        // Фон
        let backgroundColor = '#ffffff'; // Цвет фона
        let backgroundImage = null; // Изображение фона (Image или video элемент)
        let backgroundType = 'color'; // 'color', 'image', 'video'

        // Кеширование фона для производительности
        let backgroundCache = null; // OffscreenCanvas для кеширования фона
        let backgroundCacheCtx = null;
        let backgroundCacheValid = false; // Флаг валидности кеша

        // Палитра Paint (28 классических цветов)
        const paintColors = [
            '#000000', '#808080', '#800000', '#808000', '#008000', '#008080', '#000080', '#800080',
            '#808040', '#FFFFFF', '#C0C0C0', '#FF0000', '#FFFF00', '#00FF00', '#00FFFF', '#0000FF',
            '#FF00FF', '#FFFF80', '#80FFFF', '#FF8080', '#8080FF', '#FF80FF', '#804040', '#408080',
            '#804080', '#408040', '#FF8040', '#80FF40'
        ];

        // Сглаживание жестов - храним историю последних 10 кадров (УЛУЧШЕНО: было 5)
        // Больше истории = более стабильная детекция, меньше ложных срабатываний
        const GESTURE_HISTORY_SIZE = 10;
        let gestureHistory = []; // Массив из последних N состояний рук

        // УЛУЧШЕНО v6: Сбалансированные требования - золотая середина
        // Это предотвращает "слетание" жестов и ложные срабатывания.
        // История ведётся ОТДЕЛЬНО для каждой руки (слота), иначе кадры двух рук перемешиваются
        // и щипок одной руки "стабилизирует" щипок другой.
        const MAX_HAND_SLOTS = 2;
        const GESTURE_STABILITY = {
            pinch: { required: 4 },      // Щипок - требует 4 из 10 кадров (40%) - СМЯГЧЕНО для стабильности
            pinky: { required: 5 },      // Мизинец - требует 5 из 10 (50%) - УСИЛЕНО для меньше ложных срабатываний
            crossed: { required: 6 },    // Скрещенные - требует 6 из 10 (60%)
            fist: { required: 4 },       // Все пальцы вместе - требует 4 из 10 (40%) - СМЯГЧЕНО для стабильности
            open: { required: 3 }        // Открытая ладонь - требует 3 из 10 (30%)
        };
        // gestureStabilityHistory[slot][gestureName] = [bool, bool, ...]
        let gestureStabilityHistory = Array.from({ length: MAX_HAND_SLOTS }, () => ({}));

        function resetGestureStability(slot) {
            gestureStabilityHistory[slot] = {};
        }

        // НОВОЕ: Умная стабилизация движений рук в режиме редактирования
        const HAND_SMOOTHING_WINDOW = 5; // Количество кадров для сглаживания
        let handPositionHistory = []; // История позиций рук для сглаживания

        // Функция сглаживания позиций рук (moving average)
        function smoothHandPositions(currentHands) {
            // Добавляем текущие позиции в историю
            handPositionHistory.push(currentHands.map(h => ({
                x: h.x,
                y: h.y,
                handWidth: h.handWidth
            })));

            // Ограничиваем размер истории
            if (handPositionHistory.length > HAND_SMOOTHING_WINDOW) {
                handPositionHistory.shift();
            }

            // Если истории недостаточно - возвращаем текущие позиции
            if (handPositionHistory.length < 2) {
                return currentHands;
            }

            // Вычисляем сглаженные позиции
            const smoothedHands = currentHands.map((hand, handIndex) => {
                let sumX = 0, sumY = 0, sumWidth = 0;
                let count = 0;

                // Берём позиции из истории для этой руки
                handPositionHistory.forEach(frame => {
                    if (frame[handIndex]) {
                        sumX += frame[handIndex].x;
                        sumY += frame[handIndex].y;
                        sumWidth += frame[handIndex].handWidth;
                        count++;
                    }
                });

                // Применяем веса - более свежие позиции важнее
                // Экспоненциальное сглаживание
                const alpha = 0.3; // Коэффициент сглаживания (0 = только история, 1 = только текущее)
                const avgX = sumX / count;
                const avgY = sumY / count;
                const avgWidth = sumWidth / count;

                return {
                    ...hand,
                    x: hand.x * alpha + avgX * (1 - alpha),
                    y: hand.y * alpha + avgY * (1 - alpha),
                    handWidth: hand.handWidth * alpha + avgWidth * (1 - alpha)
                };
            });

            return smoothedHands;
        }

        // Таймеры для фиксации и удаления

        let fistHoldStart = null; // Время начала удержания жеста "пальцы вместе" на молекуле
        let twoFistsHoldStart = null; // Время начала удержания жеста двумя руками
        let fistHoldMolecule = null; // Молекула, над которой удерживается жест
        let crossedHoldStart = null; // Время начала удержания скрещенных пальцев
        let crossedHoldMolecule = null; // Молекула, которую хотят удалить
        let crossedHoldLostTime = null; // Время когда жест был потерян
        let pinchHoldStarts = [null, null]; // Время начала удержания pinch для каждой руки
        let pinchCreatedFlags = [false, false]; // Флаги: была ли уже создана молекула для каждой руки
        let pinchReleaseTime = [null, null]; // Время когда pinch был отпущен (для предотвращения двойного создания)

        let config = {

            audioSensitivity: 20,
            audioEnabled: true,
            showVideo: false
        };

        // Адаптивные размеры молекул (обновляются в resize())
        let minMoleculeSize = 30;  // Минимальный размер молекулы
        let maxMoleculeSize = 300; // Максимальный размер молекулы

        // Аудио контекст
        let audioContext = null;
        let analyser = null;
        let microphone = null;
        let dataArray = null;

        // Параметры метаболлов
        // Мобильные устройства получают пониженное качество по умолчанию для лучшей производительности
        let gridResolution = isMobile ? 15 : 10; // Разрешение сетки для marching squares (уменьшено для лучшей детализации)
        const baseGridResolution = isMobile ? 15 : 10; // Базовое разрешение для хорошей детализации сердца
        const lowQualityGridResolution = isMobile ? 25 : 20; // Низкое качество при высокой нагрузке
        let currentFillResolution = isMobile ? 6 : 4; // Текущее разрешение заливки (адаптивное)

        // Ограничение количества молекул на мобильных для производительности
        const maxMolecules = isMobile ? 30 : 100;

        // Система мониторинга производительности
        let frameTimeHistory = [];
        const frameTimeHistorySize = 10; // Усреднение по последним 10 кадрам
        let isLowPerformanceMode = isMobile; // На мобильных начинаем с режима низкой производительности

        // Пространственное разбиение для оптимизации (Spatial Hashing)
        const spatialCellSize = 150; // Размер ячейки пространственной сетки (должен быть >= максимального радиуса влияния молекулы)
        let spatialHash = new Map(); // Хеш-таблица: ключ = числовой код ячейки (см. spatialKey), значение = массив молекул
        const EMPTY_LIST = [];

        // Числовой ключ ячейки вместо строки "x,y": getNearbyMolecules вызывается
        // сотни тысяч раз за кадр, и создание строк давало лишнюю нагрузку на GC.
        // Смещение 32768 позволяет хранить отрицательные индексы (молекулы у края экрана).
        function spatialKey(cellX, cellY) {
            return (cellX + 32768) * 65536 + (cellY + 32768);
        }

        // Функция построения пространственного хеша
        function buildSpatialHash(moleculesToHash = molecules) {
            spatialHash.clear();

            for (const mol of moleculesToHash) {
                // Вычисляем радиус влияния молекулы с учётом растяжения
                // Для вытянутых молекул радиус влияния больше
                const maxStretch = Math.max(mol.stretchX || 1, mol.stretchY || 1);
                const influenceRadius = mol.size * maxStretch * 2.5; // Запас для вытянутых молекул

                // Находим все ячейки, которые могут быть затронуты этой молекулой
                const minCellX = Math.floor((mol.x - influenceRadius) / spatialCellSize);
                const maxCellX = Math.floor((mol.x + influenceRadius) / spatialCellSize);
                const minCellY = Math.floor((mol.y - influenceRadius) / spatialCellSize);
                const maxCellY = Math.floor((mol.y + influenceRadius) / spatialCellSize);

                // Добавляем молекулу во все затронутые ячейки
                for (let cy = minCellY; cy <= maxCellY; cy++) {
                    for (let cx = minCellX; cx <= maxCellX; cx++) {
                        const key = spatialKey(cx, cy);
                        let cell = spatialHash.get(key);
                        if (!cell) {
                            cell = [];
                            spatialHash.set(key, cell);
                        }
                        cell.push(mol);
                    }
                }
            }
        }

        // Функция получения молекул, которые могут влиять на точку (x, y)
        function getNearbyMolecules(x, y) {
            const cellX = Math.floor(x / spatialCellSize);
            const cellY = Math.floor(y / spatialCellSize);
            return spatialHash.get(spatialKey(cellX, cellY)) || EMPTY_LIST;

        // Функция адаптации качества рендеринга на основе производительности.

        // повышается → снова медленно → снова понижается и т.д.
        const QUALITY_UPGRADE_COOLDOWN = 3000; // мс
        let lastQualityChangeTime = 0;
        let lowPerformanceAuto = false; // true = режим включён автоматически из-за медленных кадров

        function setRenderQuality(level) {
            if (level === 'low') {
                gridResolution = lowQualityGridResolution;
                currentFillResolution = 8;
            } else if (level === 'medium') {
                gridResolution = Math.floor((baseGridResolution + lowQualityGridResolution) / 2);
                currentFillResolution = 6;
            } else {
                gridResolution = baseGridResolution;
                currentFillResolution = isMobile ? 6 : 4;
            }
            lastQualityChangeTime = performance.now();
            // Старые замеры относятся к прежним настройкам — начинаем копить заново
            frameTimeHistory = [];
        }

        function adaptRenderingQuality(frameTime) {
            // Добавляем время кадра в историю
            frameTimeHistory.push(frameTime);
            if (frameTimeHistory.length > frameTimeHistorySize) {
                frameTimeHistory.shift();
            }
            if (frameTimeHistory.length < frameTimeHistorySize) return;

            // Вычисляем среднее время кадра
            const avgFrameTime = frameTimeHistory.reduce((a, b) => a + b, 0) / frameTimeHistory.length;

            // Целевое время кадра - на мобильных целимся в 30 FPS для экономии батареи
            const targetFrameTime = isMobile ? 33.33 : 16.67; // 30 FPS для мобильных, 60 FPS для десктопа
            const criticalFrameTime = isMobile ? 66.67 : 50; // 15 FPS для мобильных, 20 FPS для десктопа
            const canUpgrade = performance.now() - lastQualityChangeTime > QUALITY_UPGRADE_COOLDOWN;

            if (!isLowPerformanceMode) {
                if (avgFrameTime > criticalFrameTime) {
                    // Переключаемся в режим низкой производительности
                    isLowPerformanceMode = true;
                    lowPerformanceAuto = true;
                    setRenderQuality('low');
                    console.log('⚠️ Режим низкой производительности активирован');
                } else if (avgFrameTime > targetFrameTime && gridResolution === baseGridResolution) {
                    // Средняя производительность - немного снижаем качество
                    setRenderQuality('medium');
                } else if (avgFrameTime < targetFrameTime * 0.7 && gridResolution !== baseGridResolution && canUpgrade) {
                    // Запас по времени появился - возвращаем полное качество
                    setRenderQuality('base');
                }
            } else if (!isMobile && canUpgrade && avgFrameTime < targetFrameTime * 0.7) {
                // Возвращаемся к нормальному качеству (только на десктопе, мобильные остаются в режиме экономии)
                isLowPerformanceMode = false;
                lowPerformanceAuto = false;
                setRenderQuality('medium');
                console.log('✅ Возврат к нормальному качеству');
            }
        }

        // === SDF (Signed Distance Field) функции для форм ===
        // Эти функции возвращают расстояние от точки до границы формы

        // SDF для треугольника (равносторонний)
        function sdfTriangle(px, py, cx, cy, size) {
            // Смещаем к центру
            let x = px - cx;
            let y = py - cy;

            // Масштабируем к единичному треугольнику
            const radius = size / 2;
            x /= radius;
            y /= radius;

            const k = Math.sqrt(3.0);

            // Отражаем по x для симметрии
            x = Math.abs(x) - 1.0;
            y = y + 1.0 / k;

            // Обрезаем до треугольника
            if (x + k * y > 0.0) {
                const newX = (x - k * y) / 2.0;
                y = (-k * x - y) / 2.0;
                x = newX;
            }

            x -= Math.max(-2.0, Math.min(x, 0.0));

            return -Math.sqrt(x * x + y * y) * Math.sign(y) * radius;
        }

        // SDF для сердца
        function sdfHeart(px, py, cx, cy, size) {
            // Нормализуем координаты
            let x = (px - cx) / size;
            let y = (py - cy) / size;

            // Переворачиваем Y для правильной ориентации (сердце смотрит вниз)
            y = -y;

            // Масштабируем и центрируем
            x *= 1.7;  // Немного уменьшен для более широкого сердца
            y *= 1.7;
            y += 0.2;  // Смещение вниз

            // УЛУЧШЕННАЯ ФОРМУЛА СЕРДЦА с глубоким углублением
            // Основана на уравнении: (x² + y² - 1)³ - x²y³ = 0

            const x2 = x * x;
            const y2 = y * y;

            // Основная формула сердца
            const a = x2 + y2 - 1.0;

            // Увеличен коэффициент для БОЛЕЕ ГЛУБОКОГО углубления между долями
            // Чем больше коэффициент, тем глубже углубление
            const heartEq = a * a * a - x2 * y * y * y * 1.15;

            // Вычисляем приблизительное расстояние
            // Используем корень 6-й степени для сглаживания
            const dist = Math.sign(heartEq) * Math.pow(Math.abs(heartEq), 1.0 / 6.0);

            return dist * size * 0.5;
        }

        // SDF для звезды (5-конечная), по формуле sdStar5 (Inigo Quilez).
        // Прежняя версия считала область внутри внутреннего радиуса "снаружи" (dist3 = innerR - r)
        // и неверно задавала наклон граней лучей: звезда выходила несимметричной "вертушкой"
        // с пустым центром и лишними точками внутри.
        const STAR_K1X = 0.809016994375;   // cos(36°)
        const STAR_K1Y = -0.587785252292;  // -sin(36°)
        const STAR_INNER_RATIO = 0.4;      // Внутренний радиус / внешний. Меньше значение = более острые лучи

        function sdfStar(px, py, cx, cy, size) {
            // Нормализуем: внешний радиус = 1, ось Y направлена вверх (верхний луч смотрит вверх)
            const radius = size / 2;
            let x = Math.abs((px - cx) / radius);
            let y = -(py - cy) / radius;

            // Сворачиваем плоскость в один луч отражениями относительно осей симметрии звезды
            let d = 2 * Math.max(STAR_K1X * x + STAR_K1Y * y, 0);
            x -= d * STAR_K1X;
            y -= d * STAR_K1Y;
            d = 2 * Math.max(-STAR_K1X * x + STAR_K1Y * y, 0);
            x += d * STAR_K1X;
            y -= d * STAR_K1Y;
            x = Math.abs(x);
            y -= 1;

            // Расстояние до грани луча (от вершины луча к внутренней вершине)
            const bax = STAR_INNER_RATIO * -STAR_K1Y;
            const bay = STAR_INNER_RATIO * STAR_K1X - 1;
            const h = Math.max(0, Math.min(1, (x * bax + y * bay) / (bax * bax + bay * bay)));
            const dist = Math.hypot(x - bax * h, y - bay * h) * Math.sign(y * bax - x * bay);

            return dist * radius;
        }

        // SDF для круга (для единообразия)
        function sdfCircle(px, py, cx, cy, size) {
            const dx = px - cx;
            const dy = py - cy;
            return Math.sqrt(dx * dx + dy * dy) - size / 2;
        }

        // Класс молекулы (метабол)

                this.stretchY = 1;

                this._cachedSin = 0; // sin(0)

                this.editingHands = null; // { hand1: {x, y}, hand2: {x, y} }

                this.fillColor = null; // Цвет заливки внутренности

                this.emboss = false; // Эффект тиснения (bevel & emboss)
                this.microStripes = false; // Эффект микро-градиентных полосок
                this.stripeColor1 = '#ff0000'; // Цвет 1 для градиента полосок
                this.stripeColor2 = '#0000ff'; // Цвет 2 для градиента полосок
                this.stripeWidth = 2; // Ширина полосок
                this.stripeSpacing = 3; // Расстояние между полосками

                // weight показывает долю этой формы (сумма всех weight должна быть 1)
                this.shapes = [{type: 'circle', weight: 1}]; // По умолчанию круг
            }

            update() {

                if (!this.isLocked) {

                    this.y += (this.targetY - this.y) * 0.1;

                    this.size += (this.targetSize - this.size) * 0.1;

                // УПРОЩЕНО: прямое изменение без targetStretch для быстрого отклика
                if (!this.isShapeLocked) {
                    // Деформация применяется напрямую в режиме редактирования
                }

                // Обновляем фазу для звука
                this.audioPhase += 0.05;

                // Если молекула заблокирована - не реагируем на жесты
                if (this.isLocked) {
                    this.isGrabbed = false;
                    return;
                }

                // Фильтруем руки
                let openHands = hands.filter(h => h.isOpen && !h.isPinching && !h.isFist);

                if (this.isEditing) {
                    // РЕЖИМ РЕДАКТИРОВАНИЯ - управление двумя руками
                    if (openHands.length === 2) {
                        // Увеличиваем счетчик стабильности
                        this.twoHandsFrameCount++;

                        // ВАЖНО: Используем сырые данные рук для угла и растяжения (без сглаживания)
                        // Сглаживание только для позиции центра молекулы
                        const rawHand1 = openHands[0];
                        const rawHand2 = openHands[1];

                        this.isGrabbed = true;

                        // Сохраняем позиции рук для визуализации
                        this.editingHands = {
                            hand1: { x: rawHand1.x, y: rawHand1.y },
                            hand2: { x: rawHand2.x, y: rawHand2.y }
                        };

                        // === ДЕФОРМАЦИЯ: меняем форму только если руки стабильны ===
                        // Это предотвращает случайное изменение формы при редактировании размера
                        if (this.twoHandsFrameCount >= this.STABLE_HANDS_THRESHOLD) {
                            // Вектор между руками
                            const handsVecX = rawHand2.x - rawHand1.x;
                            const handsVecY = rawHand2.y - rawHand1.y;
                            const handsDist = Math.sqrt(handsVecX * handsVecX + handsVecY * handsVecY);

                            // УГОЛ: прямо от положения рук, мгновенный отклик
                            this.deformAngle = Math.atan2(handsVecY, handsVecX);

                            // РАСТЯЖЕНИЕ ВДОЛЬ ОСИ РУК (X в повёрнутой системе координат)
                            // Прямая пропорция: handsDist / baseSize
                            const baseStretch = handsDist / this.size;
                            this.stretchX = Math.max(0.2, Math.min(5.0, baseStretch));

                            // СЖАТИЕ ПОПЕРЁК (Y в повёрнутой системе координат)
                            // Когда растягиваем вдоль - сжимаем поперёк (как резинка)
                            if (this.stretchX > 1.2) {

                                this.stretchY = Math.max(0.3, 1.0 / Math.sqrt(this.stretchX));

                        // === ПОЗИЦИЯ И РАЗМЕР: можем сгладить для плавности ===

                        // Применяем лёгкое сглаживание только к позициям (не к углу!)
                        const smoothedHands = smoothHandPositions(openHands);
                        const hand1 = smoothedHands[0];
                        const hand2 = smoothedHands[1];

                        // Центр между двумя руками (сглаженный для плавного движения)
                        const centerX = (hand1.x + hand2.x) / 2;
                        const centerY = (hand1.y + hand2.y) / 2;

                        this.targetX = centerX;
                        this.targetY = centerY;

                        // УПРАВЛЕНИЕ РАЗМЕРОМ - средняя ширина ладоней
                        const avgHandWidth = (hand1.handWidth + hand2.handWidth) / 2;
                        // Адаптивный множитель в зависимости от размера экрана
                        const sizeMultiplier = maxMoleculeSize * 2.5; // ~750 для десктопа, ~300 для смартфонов
                        const newSize = Math.max(minMoleculeSize, Math.min(maxMoleculeSize * 2, avgHandWidth * sizeMultiplier));
                        this.targetSize = newSize;
                    } else if (openHands.length === 1) {
                        // Сбрасываем счетчик если видим одну руку
                        this.twoHandsFrameCount = 0;
                        // Одна рука - только перемещение и размер
                        const hand = openHands[0];
                        const dist = Math.sqrt((this.x - hand.x) ** 2 + (this.y - hand.y) ** 2);

                        if (dist < 150) {
                            this.isGrabbed = true;
                            this.targetX = hand.x;
                            this.targetY = hand.y;

                            // Ширина раскрытия ладони определяет размер (адаптивно под экран)
                            const sizeMultiplier = maxMoleculeSize * 2.5; // ~750 для десктопа, ~300 для смартфонов
                            const newSize = Math.max(minMoleculeSize, Math.min(maxMoleculeSize * 2, hand.handWidth * sizeMultiplier));
                            this.targetSize = newSize;

                            // Форма не меняется одной рукой
                            this.editingHands = null;
                        } else {
                            this.isGrabbed = false;
                            this.editingHands = null;
                        }
                    } else {
                        // Сбрасываем счетчик если рук нет или не видим нужное количество
                        this.twoHandsFrameCount = 0;
                        this.isGrabbed = false;
                        this.editingHands = null;
                    }
                } else if (!this.isEditing && openHands.length === 1) {
                    // ОБЫЧНЫЙ РЕЖИМ - только перемещение ладонью (форма сохраняется!)
                    const hand = openHands[0];
                    const dist = Math.sqrt((this.x - hand.x) ** 2 + (this.y - hand.y) ** 2);

                    if (dist < 120) {
                        this.isGrabbed = true;
                        this.targetX = hand.x;
                        this.targetY = hand.y;
                        // ИСПРАВЛЕНО: Форма НЕ сбрасывается, сохраняется как есть
                    } else {
                        this.isGrabbed = false;
                    }
                } else {
                    // Нет подходящих рук - отпускаем
                    this.isGrabbed = false;
                }

                // Границы экрана
                // УЛУЧШЕНО: Минимальный margin = размер молекулы, чтобы можно было подходить вплотную к краям
                // Это позволяет создавать молекулы у самого края экрана без "отмагничивания"
                const margin = this.size;  // Было: Math.min(this.size * 1.5, 200)
                this.targetX = Math.max(margin, Math.min(width - margin, this.targetX));
                this.targetY = Math.max(margin, Math.min(height - margin, this.targetY));
            }

            // Заблокировать молекулу (для UI)
            lock() {
                this.isLocked = true;
                this.isShapeLocked = true;
            }

            // Разблокировать молекулу (для UI)
            unlock() {
                this.isLocked = false;
                this.isShapeLocked = false;
            }

            // Снимок всех сохраняемых свойств. Единый список полей для истории (Ctrl+Z)
            // и копирования (Ctrl+C), чтобы новые свойства не "терялись" в одном из мест.
            toSnapshot() {
                return {
                    x: this.x,
                    y: this.y,
                    baseSize: this.baseSize,
                    size: this.size,
                    stretchX: this.stretchX,
                    stretchY: this.stretchY,
                    deformAngle: this.deformAngle,
                    shapes: (this.shapes && this.shapes.length > 0)
                        ? this.shapes.map(s => ({ type: s.type, weight: s.weight }))
                        : [{ type: 'circle', weight: 1 }],
                    fillColor: this.fillColor,
                    edgeColor: this.edgeColor,
                    emboss: this.emboss,
                    microStripes: this.microStripes,
                    stripeColor1: this.stripeColor1,
                    stripeColor2: this.stripeColor2,
                    stripeWidth: this.stripeWidth,
                    stripeSpacing: this.stripeSpacing,
                    isLocked: this.isLocked,
                    isShapeLocked: this.isShapeLocked
                };
            }

            static fromSnapshot(snap) {
                const mol = new Molecule(snap.x, snap.y, snap.size);
                mol.baseSize = snap.baseSize;
                mol.stretchX = snap.stretchX;
                mol.stretchY = snap.stretchY;
                mol.deformAngle = snap.deformAngle;
                mol.shapes = snap.shapes.map(s => ({ type: s.type, weight: s.weight }));
                mol.fillColor = snap.fillColor;
                mol.edgeColor = snap.edgeColor;
                mol.emboss = snap.emboss;
                mol.microStripes = snap.microStripes;
                mol.stripeColor1 = snap.stripeColor1;
                mol.stripeColor2 = snap.stripeColor2;
                mol.stripeWidth = snap.stripeWidth;
                mol.stripeSpacing = snap.stripeSpacing;
                mol.isLocked = !!snap.isLocked;
                mol.isShapeLocked = !!snap.isShapeLocked;
                return mol;
            }

            // Функция влияния для метаболлов с поддержкой форм, поворота и растяжения
            getInfluence(px, py) {
                // Добавляем звуковую модуляцию (только в режиме жестов)
                let audioMod = 1;
                if (config.audioEnabled && !editorMode) {
                    const dx = px - this.x;
                    const dy = py - this.y;
                    const angle = Math.atan2(dy, dx);
                    audioMod = 1 + Math.sin(angle * 3 + this.audioPhase) * audioLevel * config.audioSensitivity * 0.02;
                }

                const effectiveSize = this.size * audioMod;

                // ИСПРАВЛЕНО: Применяем деформацию ДО вычисления SDF
