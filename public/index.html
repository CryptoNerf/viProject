                console.log('🎉 onResults вызван первый раз! MediaPipe работает!');
                console.log('✅ WASM успешно инициализирован');
                console.log('Загруженные файлы:', wasmFilesLoaded);
            }
            if (frameCount % 60 === 0) {
                console.log('MediaPipe Hands работает. Обнаружено рук:', results.multiHandLandmarks ? results.multiHandLandmarks.length : 0);
            }

            if (results.multiHandLandmarks) {
                const slots = assignHandSlots(results);

                results.multiHandLandmarks.forEach((landmarks, idx) => {
                    // УЛУЧШЕНО: Фильтрация по качеству ландмарков (если visibility доступен)
                    // Проверяем среднюю visibility всех ключевых ландмарков для надежности
                    const keyLandmarks = [0, 4, 8, 12, 16, 20]; // Запястье + кончики пальцев
                    let totalVisibility = 0;
                    let validCount = 0;

                    for (const landmarkIndex of keyLandmarks) {
                        const point = landmarks[landmarkIndex];
                        if (point && point.visibility !== undefined) {
                            totalVisibility += point.visibility;
                            validCount++;
                        }
                    }

                    // ИСПРАВЛЕНО: Фильтруем только если visibility предоставляется И действительно низкий
                    // Если visibility не доступен (validCount === 0) - работаем как раньше, без фильтрации
                    // Отбрасываем руку только если visibility очень низкий (< 0.3)
                    // Было 0.5, но это слишком строго - многие камеры дают visibility около 0.4-0.5
                    if (validCount > 0 && totalVisibility / validCount < 0.3) {
                        return;
                    }

                    const slot = slots[idx];
                    handLastSeen[slot] = now;

                    const palm = landmarks[9];

                    // УЛУЧШЕНО: Расширенный маппинг координат для лучшего охвата краев экрана
                    // MediaPipe обычно дает координаты в диапазоне ~0.05-0.95 даже на краях видео
                    // Ремаппим этот диапазон на полный 0-1 чтобы можно было создавать молекулы на самом краю
                    const edgeMargin = 0.08; // Запас на краях (8%)
                    const remapX = Math.max(0, Math.min(1, (palm.x - edgeMargin) / (1 - 2 * edgeMargin)));
                    const remapY = Math.max(0, Math.min(1, (palm.y - edgeMargin) / (1 - 2 * edgeMargin)));

                    // Фронтальная камера отзеркалена (как зеркало), основная - нет
                    const rawX = (mirrorCamera ? 1 - remapX : remapX) * width;
                    const rawY = remapY * height;

                    // Отфильтрованная точка (без дрожания) - для логики жестов в этом кадре
                    const filtered = addHandSample(slot, rawX, rawY, performance.now());
                    const handX = filtered.x;
                    const handY = filtered.y;

                    // УЛУЧШЕНО: Используем приоритетную систему жестов (стабилизация - по слоту руки)
                    const gestureResult = getPrimaryGesture(landmarks, slot);

                    const isPinching = gestureResult.isPinching;
                    const isOpen = gestureResult.isOpen;
                    const isFist = gestureResult.isFist;
                    const isCrossed = gestureResult.isCrossed;
                    const isPinky = gestureResult.isPinky;

                    // УЛУЧШЕНО: Используем точную детекцию загнутых пальцев
                    const fingersState = detectFoldedFingers(landmarks);

                    // Ширина раскрытия ладони (расстояние от большого пальца до мизинца)
                    const handWidth = Math.sqrt(
                        (landmarks[4].x - landmarks[20].x) ** 2 +
                        (landmarks[4].y - landmarks[20].y) ** 2
                    );

                    // x/y - плавное положение для экрана, его обновляет каждый кадр updateHandDisplayPositions()
                    const motion = handMotion[slot];
                    const handData = {
                        slot,
                        x: motion.displayX,
                        y: motion.displayY,
                        isPinching,
                        isOpen,
                        isFist,
                        isCrossed,
                        isPinky,
                        fingersState,
                        handWidth,
                        pinchDist: getPinchDistance(landmarks) // Сохраняем для изменения размера
                    };

                    newHands.push(handData);

                    // Создание молекулы при щипке с ЗАДЕРЖКОЙ 1 секунда
                    // УЛУЧШЕНО: добавлена проверка на скрещенные пальцы и мизинец
                    if (isPinching && !isFist && !isCrossed && !isPinky) {
                        // Сбрасываем время отпускания если pinch снова активен
                        pinchReleaseTime[slot] = null;

                        // Начинаем или продолжаем отсчет времени удержания pinch
                        if (pinchHoldStarts[slot] === null) {
                            pinchHoldStarts[slot] = now;
                            // НЕ сбрасываем pinchCreatedFlags здесь - он сбросится только после полного отпускания
                        } else if (!pinchCreatedFlags[slot] && now - pinchHoldStarts[slot] >= HOLD_DURATION) {
                            // Определяем форму по жесту (какой палец ближе к большому)
                            const shapeFromGesture = getShapeFromPinch(landmarks);
                            if (createMoleculeAt(handX, handY, shapeFromGesture)) {
                                console.log('Создание молекулы через жест (удержание 1 сек), форма:', shapeFromGesture);
                                pinchCreatedFlags[slot] = true; // Помечаем что молекула создана
                            }
                        }
                    } else {
                        // Pinch отпущен
                        pinchHoldStarts[slot] = null;

                        // Если молекула была создана - запоминаем время отпускания для задержки сброса
                        if (pinchCreatedFlags[slot]) {
                            if (pinchReleaseTime[slot] === null) {
                                pinchReleaseTime[slot] = now;
                            }

                            // Сбрасываем флаг только после 500 мс без pinch (чтобы избежать двойного создания)
                            if (now - pinchReleaseTime[slot] >= 500) {
                                pinchCreatedFlags[slot] = false;
                                pinchReleaseTime[slot] = null;
                            }
                        } else {
                            // Если молекула не была создана - можно сбросить сразу
                            pinchCreatedFlags[slot] = false;
                            pinchReleaseTime[slot] = null;
                        }
                    }
                });
            }

            // Руки, которые давно не видны: сбрасываем таймеры и историю жестов. Иначе рука,
            // ушедшая из кадра со щипком, при возвращении мгновенно создавала молекулу
            // (таймер удержания продолжал "тикать" с момента ухода).
            for (let slot = 0; slot < MAX_HAND_SLOTS; slot++) {
                if (now - handLastSeen[slot] > HAND_LOST_RESET_MS) {
                    pinchHoldStarts[slot] = null;
                    pinchCreatedFlags[slot] = false;
                    pinchReleaseTime[slot] = null;
                    resetGestureStability(slot);
                }
            }

            // Стабильный порядок рук (по слоту) - важно для сглаживания позиций в режиме редактирования
            newHands.sort((a, b) => a.slot - b.slot);
            hands = newHands;

            // Добавляем текущий кадр в историю
            gestureHistory.push(newHands);
            if (gestureHistory.length > GESTURE_HISTORY_SIZE) {
                gestureHistory.shift(); // Удаляем старые кадры
            }
        }

        // === ЗАГРУЗКА РАСПОЗНАВАНИЯ ЖЕСТОВ (MediaPipe) ===
        // Все файлы MediaPipe (JS-обёртки, WASM, модели) лежат на нашем сервере - без CDN.
        // Большие файлы скачиваются заранее через fetch с подсчётом байтов: пользователь видит
        // реальный прогресс, а MediaPipe потом получает их из памяти (blob URL) без повторной загрузки.
        // Модель лица (режим редактирования ртом) грузится только после рук, чтобы не делить канал.
        //
        // Почему не MediaPipe Tasks Vision: замеры (октябрь 2026) показали, что старый движок уже
        // считает на видеокарте и не медленнее (8.9 мс против 9.5 мс на кадр у Tasks GPU, Tasks CPU -
        // 31.6 мс), а объём загрузки после brotli почти одинаковый (~9.4 vs ~9.2 МБ). См. ROADMAP.md.
        const MEDIAPIPE_BASE = './mediapipe';
        const HANDS_ASSETS = {
            dir: 'hands',
            script: 'hands.js',
            files: [ // [имя, размер в байтах - для прогресса, если сервер не прислал Content-Length]
                ['hands_solution_simd_wasm_bin.wasm', 6026259],
                ['hands_solution_packed_assets.data', 4326731],
                ['hand_landmark_full.tflite', 5478688]
            ]
        };
        const FACE_ASSETS = {
            dir: 'face_mesh',
            script: 'face_mesh.js',
            files: [
                ['face_mesh_solution_simd_wasm_bin.wasm', 6161697],
                ['face_mesh_solution_packed_assets.data', 3986256]
            ]
        };
        const ENGINE_SLOW_MS = 12000;   // Столько без новых данных - предупреждаем о медленном соединении
        const ENGINE_READY_HIDE_MS = 4000;

        // Отслеживание файлов (для диагностики в консоли)
        let wasmFilesLoaded = [];

        let handsDetector = null;
        let faceMesh = null;
        let faceMeshReady = false;

        // Состояние для карточки #engineCard
        let cameraState = 'waiting';  // waiting | ok | denied | none | unsupported | error
        let engineState = 'idle';     // idle | loading | starting | ready | error
        let engineProgress = { loaded: 0, total: 1 };
        let engineError = '';
        let engineSlow = false;
        let engineLastProgressTime = 0;
        let engineAbort = null;
        let engineCardDismissed = false;
        let engineCardHideTimer = null;

        const engineCard = document.getElementById('engineCard');
        const engineTitleEl = document.getElementById('engineTitle');
        const engineMessageEl = document.getElementById('engineMessage');
        const engineNoteEl = document.getElementById('engineNote');
        const engineProgressEl = document.getElementById('engineProgress');
        const engineProgressBar = document.getElementById('engineProgressBar');
        const engineRetryBtn = document.getElementById('engineRetry');

        function formatMB(bytes) {
            return (bytes / 1048576).toFixed(1);
        }

        // Скрипт-обёртка MediaPipe (один раз на страницу)
        const loadedScripts = new Map();
        function loadScriptOnce(src) {
            if (!loadedScripts.has(src)) {
                loadedScripts.set(src, new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = src;
                    script.onload = resolve;
                    script.onerror = () => {
                        loadedScripts.delete(src); // Чтобы "Retry" попробовал снова
                        reject(new Error(`Failed to load ${src}`));
                    };
                    document.head.appendChild(script);
                }));
            }
            return loadedScripts.get(src);
        }

        // Скачивает большие файлы с подсчётом прогресса и возвращает blob URL для locateFile
        async function prefetchAssets(assets, signal, onProgress) {
            const expectedTotal = assets.files.reduce((sum, [, size]) => sum + size, 0);
            const loadedByFile = {};
            const report = () => {
                const loaded = Object.values(loadedByFile).reduce((a, b) => a + b, 0);
                onProgress(loaded, Math.max(expectedTotal, loaded));
            };

            const entries = await Promise.all(assets.files.map(async ([file]) => {
                const response = await fetch(`${MEDIAPIPE_BASE}/${assets.dir}/${file}`, { signal });
                if (!response.ok) {
                    throw new Error(`${file}: HTTP ${response.status}`);
                }
                const type = file.endsWith('.wasm') ? 'application/wasm' : 'application/octet-stream';
                loadedByFile[file] = 0;

                if (!response.body || !response.body.getReader) {
                    const buffer = await response.arrayBuffer();
                    loadedByFile[file] = buffer.byteLength;
                    report();
                    return [file, URL.createObjectURL(new Blob([buffer], { type }))];
                }

                const reader = response.body.getReader();
                const chunks = [];
                for (;;) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    chunks.push(value);
                    loadedByFile[file] += value.length;
                    report();
                }
                return [file, URL.createObjectURL(new Blob(chunks, { type }))];
            }));

            return Object.fromEntries(entries);
        }

        function revokeAssetUrls(urls) {
            for (const file of Object.keys(urls)) {
                URL.revokeObjectURL(urls[file]);
                delete urls[file]; // Повторный запрос файла пойдёт обычным путём, а не по отозванному URL
            }
        }

        function setEngineState(state, error = '') {
            engineState = state;
            engineError = error;
            if (state === 'error') engineCardDismissed = false; // Ошибку показываем, даже если карточку скрыли
            renderEngineCard();
        }

        function setCameraState(state) {
            cameraState = state;
            if (state !== 'ok' && state !== 'waiting') engineCardDismissed = false;
            renderEngineCard();
        }

        // Карточка состояния: камера + загрузка распознавания. Приоритет - у проблем с камерой.
        function renderEngineCard() {
            clearTimeout(engineCardHideTimer);
            let title = 'Gestures';
            let message = '';
            let note = '';
            let progress = null;    // 0..1, 'indeterminate' или null (без полосы)
            let retry = false;
            let autoHide = false;

            if (cameraState === 'denied') {
                title = 'Camera is blocked';
                message = 'Gestures need the camera. Allow camera access for this site (camera icon in the address bar or browser settings), then press Retry.';
                note = 'Mouse and touch tools work without the camera.';
                retry = true;
            } else if (cameraState === 'none') {
                title = 'No camera found';
                message = 'Connect a camera and press Retry to use gestures.';
                note = 'Mouse and touch tools work without the camera.';
                retry = true;
            } else if (cameraState === 'unsupported') {
                title = 'Camera unavailable';
                message = window.isSecureContext
                    ? 'This browser does not support camera access.'
                    : 'Camera works only over HTTPS or on localhost.';
                note = 'Mouse and touch tools still work.';
            } else if (cameraState === 'error') {
                title = 'Camera error';
                message = 'The camera could not be started (it may be used by another app).';
                note = 'Close other apps using the camera and press Retry.';
                retry = true;
            } else if (engineState === 'error') {
                title = 'Hand tracking failed to load';
                message = engineError || 'Check your connection and press Retry.';
                note = 'Mouse and touch tools work in the meantime.';
                retry = true;
            } else if (engineState === 'loading' || engineState === 'idle') {
                const { loaded, total } = engineProgress;
                title = 'Loading hand tracking';
                message = `Downloading model: ${Math.round((loaded / total) * 100)}% (${formatMB(loaded)} / ${formatMB(total)} MB)`;
                progress = loaded / total;
                note = engineSlow
                    ? 'Slow connection - still loading. Mouse and touch tools already work.'
                    : (cameraState === 'waiting' ? 'Allow camera access when the browser asks.' : 'Mouse and touch tools already work.');
                retry = engineSlow;
            } else if (engineState === 'starting') {
                title = 'Starting hand tracking';
                message = 'Almost ready...';
                progress = 'indeterminate';
            } else if (engineState === 'ready' && cameraState === 'waiting') {
                title = 'Gestures';
                message = 'Allow camera access when the browser asks.';
            } else if (engineState === 'ready') {
                title = 'Gestures ready';
                message = 'Pinch thumb and index finger for 1 second to create a molecule. Open palm moves it.';
                note = 'All gestures: "?" button (manual).';
                autoHide = true;
            }

            engineTitleEl.textContent = title;
            engineMessageEl.textContent = message;
            engineNoteEl.textContent = note;
            engineRetryBtn.hidden = !retry;

            engineProgressEl.hidden = progress === null;
            engineProgressEl.classList.toggle('indeterminate', progress === 'indeterminate');
            if (typeof progress === 'number') {
                engineProgressBar.style.width = `${Math.min(100, progress * 100).toFixed(1)}%`;
            } else {
                engineProgressBar.style.width = '';
            }

            engineCard.hidden = engineCardDismissed || (!message && !title);
            if (autoHide) {
                engineCardHideTimer = setTimeout(() => { engineCard.hidden = true; }, ENGINE_READY_HIDE_MS);
            }
        }

        document.getElementById('engineCardClose').addEventListener('click', () => {
            engineCardDismissed = true;
            engineCard.hidden = true;
        });

        engineRetryBtn.addEventListener('click', () => retryGestureSetup());

        // Предупреждение о медленном соединении: прогресс не двигается ENGINE_SLOW_MS
        setInterval(() => {
            if (engineState !== 'loading') return;
            const slow = performance.now() - engineLastProgressTime > ENGINE_SLOW_MS;
            if (slow !== engineSlow) {
                engineSlow = slow;
                renderEngineCard();
            }
        }, 1000);

        async function startHandsEngine() {
            if (engineAbort) engineAbort.abort();
            const abort = new AbortController();
            engineAbort = abort;

            engineProgress = { loaded: 0, total: HANDS_ASSETS.files.reduce((s, [, size]) => s + size, 0) };
            engineSlow = false;
            engineLastProgressTime = performance.now();
            setEngineState('loading');

            let urls = {};
            try {
                await loadScriptOnce(`${MEDIAPIPE_BASE}/hands/${HANDS_ASSETS.script}`);
                urls = await prefetchAssets(HANDS_ASSETS, abort.signal, (loaded, total) => {
                    engineProgress = { loaded, total };
                    engineLastProgressTime = performance.now();
                    if (engineSlow) engineSlow = false;
                    renderEngineCard();
                });

                setEngineState('starting');
                if (handsDetector) {
                    handsDetector.close();
                    handsDetector = null;
                }
                const detector = new Hands({
                    locateFile: (file) => {
                        wasmFilesLoaded.push(file);
                        return urls[file] || `${MEDIAPIPE_BASE}/hands/${file}`;
                    }
                });
                detector.setOptions({
                    maxNumHands: 2,
                    modelComplexity: 1,  // Используем средний уровень сложности для баланса скорости/точности
                    minDetectionConfidence: 0.8,  // УЛУЧШЕНО: было 0.7 - более строгая детекция на расстоянии
                    minTrackingConfidence: 0.75   // УЛУЧШЕНО: было 0.7 - более надежное отслеживание
                });
                detector.onResults(onResults);
                await detector.initialize();
                if (abort.signal.aborted) {
                    detector.close();
                    return;
                }

                handsDetector = detector;
                setEngineState('ready');
                console.log('✅ MediaPipe Hands готов');

                // Лицо - после рук и без блокировки: без него не работает только режим редактирования ртом
                startFaceEngine(abort.signal);
            } catch (error) {
                if (abort.signal.aborted) return;
                console.error('❌ Не удалось загрузить MediaPipe Hands:', error);
                setEngineState('error', navigator.onLine === false
                    ? 'You are offline. Connect to the internet and press Retry.'
                    : 'Could not download the hand tracking model. Check your connection and press Retry.');
            } finally {
                revokeAssetUrls(urls);
            }
        }

        async function startFaceEngine(signal) {
            let urls = {};
            try {
                await loadScriptOnce(`${MEDIAPIPE_BASE}/face_mesh/${FACE_ASSETS.script}`);
                urls = await prefetchAssets(FACE_ASSETS, signal, () => {});
                const mesh = new FaceMesh({
                    locateFile: (file) => urls[file] || `${MEDIAPIPE_BASE}/face_mesh/${file}`
                });
                mesh.setOptions({
                    maxNumFaces: 1,
                    // Уточнение радужки глаз не нужно для определения открытого рта, а стоит
                    // вдвое больше времени на кадр (6.3 -> 2.9 мс в замерах)
                    refineLandmarks: false,
                    minDetectionConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                mesh.onResults(onFaceResults);
                await mesh.initialize();
                if (signal.aborted) {
                    mesh.close();
                    return;
                }
                faceMesh = mesh;
                faceMeshReady = true;
                console.log('✅ FaceMesh готов');
            } catch (error) {
                if (!signal.aborted) {
                    console.warn('FaceMesh не загружен - режим редактирования ртом недоступен:', error);
                }
            } finally {
                revokeAssetUrls(urls);
            }
        }

        // Камера не нужна - не тратим трафик на модели
        function stopGestureEngineDownload() {
            if (engineAbort && engineState !== 'ready') {
                engineAbort.abort();
                engineState = 'idle';
            }
        }

        async function retryGestureSetup() {
            engineRetryBtn.hidden = true;
            if (cameraState !== 'ok') {
                setCameraState('waiting');
                const camera = await setupCamera();
                if (!camera) return;
                startDetectionLoop();
            }
            if (engineState !== 'ready') {
                startHandsEngine();
            }
        }

        // Обработка результатов FaceMesh
        function onFaceResults(results) {
            try {
                if (results.multiFaceLandmarks && results.multiFaceLandmarks.length > 0) {
                    const landmarks = results.multiFaceLandmarks[0];

                    // FaceMesh использует индексы:
                    // 13 - верхняя внутренняя губа
                    // 14 - нижняя внутренняя губа
                    // Для более точного определения используем:
                    // 13 и 14 для внутренних точек губ
                    if (landmarks[13] && landmarks[14]) {
                        const upperLip = landmarks[13];
                        const lowerLip = landmarks[14];

                        // Расстояние между верхней и нижней губой
                        const mouthOpenDistance = Math.abs(lowerLip.y - upperLip.y);

                        // Если расстояние больше порога - рот открыт
                        // СТРОЖЕ: увеличен порог для предотвращения ложных срабатываний
                        const rawMouthOpen = mouthOpenDistance > 0.035; // Было 0.02, теперь строже

                        // СТАБИЛИЗАЦИЯ: рот должен быть открыт несколько кадров подряд
                        if (rawMouthOpen) {
                            mouthOpenFrames++;
                        } else {
                            mouthOpenFrames = 0;
                        }

                        // Рот считается открытым, если был открыт 2 кадра лица подряд (~0.3 с:
                        // лицо распознаётся ~7 раз в секунду, см. FACE_DETECT_INTERVAL_MS)
                        isMouthOpen = mouthOpenFrames >= 2;

                        // TOGGLE режима редактирования при открытии рта
                        if (isMouthOpen && !wasMouthOpen) {
                            // Момент открытия рта - переключаем режим
                            if (editingMolecule) {
                                // Выключаем режим редактирования и фиксируем результат в истории (Ctrl+Z)
                                editingMolecule.isEditing = false;
                                editingMolecule.editingHands = null;
                                editingMolecule = null;
                                saveState();
                            } else {
                                // Включаем режим для молекулы на которую наведена рука
                                // Приоритет: текущая hovered молекула > последняя hovered молекула
                                let moleculeToEdit = hoveredMolecule || lastHoveredMolecule;

                                if (moleculeToEdit && molecules.includes(moleculeToEdit)) {
                                    // Выключаем режим у всех молекул
                                    molecules.forEach(m => m.isEditing = false);
                                    // Включаем режим для выбранной
                                    moleculeToEdit.isEditing = true;
                                    editingMolecule = moleculeToEdit;
                                }
                            }
                        }

                        wasMouthOpen = isMouthOpen;
                    } else {
                        isMouthOpen = false;
                        wasMouthOpen = false;
                        mouthOpenFrames = 0;
                    }
                } else {
                    isMouthOpen = false;
                    wasMouthOpen = false;
                    mouthOpenFrames = 0;
                }
            } catch (error) {
                console.warn('Ошибка в onFaceResults:', error);
                isMouthOpen = false;
                wasMouthOpen = false;
                mouthOpenFrames = 0;
            }
        }

        // Инициализация камеры.
        // На телефонах и планшетах - 640×480: нейросеть всё равно уменьшает кадр до ~224 px, а передача
        // кадра 1280×720 в видеокарту телефона заметно дороже и снижает частоту распознавания.
        const BASE_VIDEO_CONSTRAINTS = isMobile
            ? { width: { ideal: 640 }, height: { ideal: 480 } }
            : { width: { ideal: 1280 }, height: { ideal: 720 } };
        let currentStream = null;
        let cameraFacing = 'user';     // 'user' - фронтальная, 'environment' - основная (задняя)
        let mirrorCamera = true;       // Фронтальная камера показывается зеркально, основная - как есть
        let videoInputs = [];          // Список камер (после разрешения доступа)
        let cameraSwitching = false;
        const toggleCameraBtn = document.getElementById('toggleCamera');

        function attachCameraStream(stream) {
            video.srcObject = stream;
            return new Promise((resolve) => {
                if (video.readyState >= video.HAVE_METADATA) {
                    resolve(video);
                    return;
                }
                video.onloadedmetadata = () => {
                    console.log('Метаданные видео загружены');
                    resolve(video);
                };
            });
        }

        function stopCurrentStream() {
            if (currentStream) {
                currentStream.getTracks().forEach(track => track.stop());
                currentStream = null;
            }
        }

        // Зеркалим только фронтальную камеру. Веб-камеры ноутбуков не сообщают facingMode -
        // для них тоже включаем зеркало (человек смотрит в камеру, как в зеркало).
        function applyCameraOrientation(stream) {
            const track = stream.getVideoTracks()[0];
            const settings = track && track.getSettings ? track.getSettings() : {};
            let facing = settings.facingMode;
            // Не все камеры сообщают facingMode (часть Android, USB-камеры) - определяем по названию:
            // iOS - "Back Camera", Android - "camera2 0, facing back"
            if (facing !== 'environment' && facing !== 'user' && track) {
                facing = /back|rear|environment/i.test(track.label) ? 'environment' : 'user';
            }
            cameraFacing = facing;
            mirrorCamera = facing !== 'environment';
            video.style.transform = mirrorCamera ? 'scaleX(-1)' : 'none';
        }

        function currentDeviceId() {
            const track = currentStream && currentStream.getVideoTracks()[0];
            return track && track.getSettings ? track.getSettings().deviceId : null;
        }

        async function openNextCameraInList(fromDeviceId) {
            const index = videoInputs.findIndex(d => d.deviceId === fromDeviceId);
            const next = videoInputs[(index + 1) % videoInputs.length];
            await openCamera({ ...BASE_VIDEO_CONSTRAINTS, deviceId: { exact: next.deviceId } });
        }

        async function openCamera(videoConstraints) {
            // Сначала освобождаем текущую камеру: многие телефоны не открывают вторую параллельно
            stopCurrentStream();
            const stream = await navigator.mediaDevices.getUserMedia({ video: videoConstraints });
            currentStream = stream;
            applyCameraOrientation(stream);
            return attachCameraStream(stream);
        }

        async function setupCamera() {
            console.log('Начинаем инициализацию камеры...');

            // Проверяем поддержку API (getUserMedia доступен только по HTTPS или на localhost)
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                console.error('getUserMedia не поддерживается в этом браузере');
                statusEl.textContent = 'Camera unavailable - mouse/touch only';
                setCameraState('unsupported');
                stopGestureEngineDownload();
                return null;
            }

            try {
                // Значения без exact - пожелания, браузер подберёт ближайшие
                const camera = await openCamera({ ...BASE_VIDEO_CONSTRAINTS, facingMode: cameraFacing });
                console.log('Доступ к камере получен!');
                setCameraState('ok');
                updateCameraSwitchButton();
                return camera;
            } catch (error) {
                console.error('Ошибка доступа к камере:', error.name, error.message);

                // Отказ в доступе повторять бессмысленно - второй запрос тоже будет отклонён
                if (error.name === 'NotAllowedError' || error.name === 'SecurityError') {
                    statusEl.textContent = 'Camera access denied - mouse/touch only';
                    setCameraState('denied');
                    stopGestureEngineDownload();
                    return null;
                }
                if (error.name === 'NotFoundError') {
                    statusEl.textContent = 'No camera found - mouse/touch only';
                    setCameraState('none');
                    stopGestureEngineDownload();
                    return null;
                }

                // Пробуем с более простыми параметрами (например, камера не поддерживает facingMode)
                try {
                    console.log('Пробуем запросить камеру с базовыми параметрами...');
                    const camera = await openCamera(true);
                    setCameraState('ok');
                    updateCameraSwitchButton();
                    return camera;
                } catch (fallbackError) {
                    console.error('Не удалось получить доступ к камере:', fallbackError);
                    statusEl.textContent = `Camera error: ${fallbackError.name}`;
                    setCameraState('error');
                    return null;
                }
            }
        }

        // Кнопка смены камеры видна, если камер больше одной (телефоны, планшеты, внешняя веб-камера)
        async function updateCameraSwitchButton() {
            try {
                const devices = await navigator.mediaDevices.enumerateDevices();
                videoInputs = devices.filter(d => d.kind === 'videoinput');
            } catch {
                videoInputs = [];
            }
            toggleCameraBtn.hidden = !(cameraState === 'ok' && videoInputs.length > 1);
        }

        if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
            navigator.mediaDevices.addEventListener('devicechange', updateCameraSwitchButton);
        }

        // Распознавание продолжает работать на новой камере, но старая история жестов к ней не относится
        function resetHandTracking() {
            hands = [];
            gestureHistory = [];
            for (let slot = 0; slot < MAX_HAND_SLOTS; slot++) {
                resetGestureStability(slot);
                pinchHoldStarts[slot] = null;
                pinchCreatedFlags[slot] = false;
                pinchReleaseTime[slot] = null;
            }
            if (handsDetector && handsDetector.reset) handsDetector.reset();
            if (faceMesh && faceMesh.reset) faceMesh.reset();
        }

        async function switchCamera() {
            if (cameraSwitching) return;
            cameraSwitching = true;
            toggleCameraBtn.disabled = true;

            const previousDeviceId = currentDeviceId();
            const previousFacing = cameraFacing;

            try {
                if (isMobile) {
                    // Телефон/планшет: фронтальная <-> основная. Если exact не поддерживается - мягкий запрос.
                    const nextFacing = cameraFacing === 'user' ? 'environment' : 'user';
                    try {
                        await openCamera({ ...BASE_VIDEO_CONSTRAINTS, facingMode: { exact: nextFacing } });
                    } catch {
                        await openCamera({ ...BASE_VIDEO_CONSTRAINTS, facingMode: nextFacing });
                    }
                    // Браузер открыл ту же камеру (facingMode не поддерживается) - берём следующую по списку
                    if (currentDeviceId() === previousDeviceId && videoInputs.length > 1) {
                        await openNextCameraInList(previousDeviceId);
                    }
                } else {
                    // Компьютер: следующая камера по списку
                    await openNextCameraInList(previousDeviceId);
                }
                resetHandTracking();
                const label = mirrorCamera ? 'front camera' : 'back camera';
                const track = currentStream.getVideoTracks()[0];
                statusEl.textContent = `Camera: ${isMobile ? label : (track && track.label) || label}`;
            } catch (error) {
                console.error('Не удалось переключить камеру:', error);
                statusEl.textContent = 'Could not switch camera';
                // Возвращаем прежнюю камеру
                try {
                    await openCamera(previousDeviceId
                        ? { ...BASE_VIDEO_CONSTRAINTS, deviceId: { exact: previousDeviceId } }
                        : { ...BASE_VIDEO_CONSTRAINTS, facingMode: previousFacing });
                } catch (restoreError) {
                    console.error('Не удалось вернуть камеру:', restoreError);
                    setCameraState('error');
                }
            } finally {
                cameraSwitching = false;
                toggleCameraBtn.disabled = false;
            }
        }

        toggleCameraBtn.addEventListener('click', switchCamera);

        // === ФУНКЦИИ ДЛЯ ОТМЕНЫ ДЕЙСТВИЙ (Ctrl+Z) ===
        // В истории хранятся снимки состояния ПОСЛЕ каждого действия; undoHistory[0] - исходное состояние,
        // дальше которого отмена не идёт (раньше последняя отмена стирала всё, даже то, что было
        // до самого старого сохранённого шага).
        //
        // Пиксели заливок (ImageData) не копируются при каждом сохранении: снимки ссылаются на те же
        // объекты, а ластик перед изменением пикселей делает копию (copy-on-write, см.
        // makeRegionWritable). Раньше каждое действие копировало все заливки целиком: одна фоновая
        // заливка 1920×1080 = 8 МБ на шаг, т.е. до ~400 МБ памяти на 50 шагов истории.

        function snapshotRegion(region) {
            return {
                imageData: region.imageData,
                x: region.x,
                y: region.y,
                width: region.width,
                height: region.height
            };
        }

        function restoreRegion(snap) {
            // _shared: пиксели принадлежат снимку истории - перед изменением их нужно скопировать
            return { ...snapshotRegion(snap), _shared: true };
        }

        function copyStroke(stroke) {
            return {
                points: stroke.points.map(p => ({ x: p.x, y: p.y, erased: p.erased, w: p.w })),
                color: stroke.color,
                width: stroke.width,
                pressure: stroke.pressure // Штрих стилуса с переменной толщиной
            };
        }

        // Сохранение текущего состояния в историю
        function saveState() {
            const state = {
                molecules: molecules.map(mol => mol.toSnapshot()),
                drawnStrokes: drawnStrokes.map(copyStroke),
                filledRegions: filledRegions.map(snapshotRegion),
                backgroundFills: backgroundFills.map(snapshotRegion)
            };

            // С этого момента пиксели живых областей разделяются со снимком
            for (const region of filledRegions) region._shared = true;
            for (const region of backgroundFills) region._shared = true;

            undoHistory.push(state);
            redoStack = []; // Новое действие делает повтор отменённых невозможным

            // Ограничиваем размер истории
            if (undoHistory.length > MAX_HISTORY_SIZE) {
                undoHistory.shift(); // Удаляем самое старое состояние
            }
            updateHistoryButtons();
        }

        // Ластик вызывает это перед изменением пикселей области
        function makeRegionWritable(region) {
            if (region._shared) {
                region.imageData = new ImageData(
                    new Uint8ClampedArray(region.imageData.data),
                    region.imageData.width,
                    region.imageData.height
                );
                region._shared = false;
            }
            region._dirty = true; // Кешированный холст области нужно перерисовать
        }

        function restoreState(state) {
            molecules = state.molecules.map(snap => Molecule.fromSnapshot(snap));
            drawnStrokes = state.drawnStrokes.map(copyStroke);
            filledRegions = state.filledRegions.map(restoreRegion);
            backgroundFills = state.backgroundFills.map(restoreRegion);

            currentStroke = null;
            isDrawing = false;
            // Старые объекты молекул больше не существуют - сбрасываем все ссылки на них
            resetMoleculeReferences();
        }

        // Отмена последнего действия (Ctrl+Z)
        function undo() {
            if (undoHistory.length <= 1) {
                statusEl.textContent = 'Nothing to undo';
                return;
            }

            // Удаляем текущее состояние и восстанавливаем предыдущее
            redoStack.push(undoHistory.pop());
            restoreState(undoHistory[undoHistory.length - 1]);

            statusEl.textContent = `Undone | Remaining: ${undoHistory.length - 1}`;
            updateHistoryButtons();
        }

        // Повтор отменённого действия (Ctrl+Shift+Z / Ctrl+Y)
        function redo() {
            if (redoStack.length === 0) {
                statusEl.textContent = 'Nothing to redo';
                return;
            }

            const state = redoStack.pop();
            undoHistory.push(state);
            restoreState(state);

            statusEl.textContent = `Redone | Can redo: ${redoStack.length}`;
            updateHistoryButtons();
        }

        // Инициализация размеров
        let userMoleculeSize = null; // Размер, выбранный слайдером (null = автоматический по размеру экрана)

        function syncMoleculeSizeControl() {
            document.getElementById('molSizeSlider').value = config.moleculeSize;
            document.getElementById('molSize').textContent = config.moleculeSize;
        }

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            backgroundCacheValid = false; // Инвалидируем кеш фона при изменении размера

            // Адаптивный размер молекул в зависимости от ширины экрана
            // Базовый размер 150px для экрана 1500px+
            // Для маленьких экранов (смартфоны ~400px) размер будет ~45px
            const screenScale = Math.max(0.3, Math.min(1, width / 1500));

            // Адаптируем минимальный и максимальный размеры молекул
            minMoleculeSize = Math.round(30 * screenScale);   // 30px -> ~9px на смартфоне
            maxMoleculeSize = Math.round(300 * screenScale);  // 300px -> ~90px на смартфоне

            // Размер по умолчанию зависит от экрана, но выбор пользователя слайдером не перетираем
            // (раньше любой resize/поворот телефона сбрасывал размер, а слайдер показывал 100 при реальных 150)
            if (userMoleculeSize === null) {
                config.moleculeSize = Math.round(150 * screenScale);
                syncMoleculeSizeControl();
            }
        }

        // Видео с камеры как фон (режим "Show video")
        function drawCameraBackground() {
            if (config.showVideo && video.videoWidth > 0) {
                if (mirrorCamera) {
                    ctx.save();
                    // Отзеркаливаем видео фронтальной камеры
                    ctx.scale(-1, 1);
                    ctx.drawImage(video, -width, 0, width, height);
                    ctx.restore();
                } else {
                    ctx.drawImage(video, 0, 0, width, height);
                }
            }
        }

        // Подсказка по центру пустого холста (рисуется поверх сцены, в экспорт и запись не попадает)
        function drawEmptyStateHint() {
            const touch = isTouchDevice && currentLayout !== 'desktop';
            const action = touch ? 'tap' : 'click';
            let lines;
            if (editorMode) {
                lines = ['Draw with the Pencil', `or choose Create and ${action} to add molecules to paint`];
            } else if (cameraState === 'ok' && handsDetector) {
                lines = ['Pinch thumb and index finger in front of the camera', `or choose Create and ${action} the canvas`];
            } else {
                lines = [`Choose Create and ${action} the canvas`, 'to add your first molecule'];
            }

            const big = currentLayout === 'phone' ? 16 : 20;
            const small = Math.round(big * 0.75);
            const maxWidth = Math.min(width - 40, 560);

            ctx.save();
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';

            // Перенос по словам, чтобы текст помещался на узком экране
            const wrap = (text, fontSize) => {
                ctx.font = `${fontSize}px SysfontC, monospace`;
                const result = [];
                let line = '';
                for (const word of text.split(' ')) {
                    const candidate = line ? `${line} ${word}` : word;
                    if (line && ctx.measureText(candidate).width > maxWidth) {
                        result.push(line);
                        line = word;
                    } else {
                        line = candidate;
                    }
                }
                result.push(line);
                return result.map(textLine => ({ text: textLine, fontSize }));
            };
            const rows = [...wrap(lines[0], big), ...wrap(lines[1], small)];

            const lineGap = 1.5;
            const totalHeight = rows.reduce((sum, row) => sum + row.fontSize * lineGap, 0);
            let y = height / 2 - (currentLayout === 'phone' ? 40 : 0) - totalHeight / 2;
            for (const row of rows) {
                ctx.font = `${row.fontSize}px SysfontC, monospace`;
                y += row.fontSize * lineGap / 2;
                ctx.fillText(row.text, width / 2, y);
                y += row.fontSize * lineGap / 2;
            }
            ctx.restore();
        }

        // Основной цикл анимации
        function animate() {
            // Полная очистка canvas в начале каждого кадра
            // Это предотвращает следы от движущихся объектов
            ctx.clearRect(0, 0, width, height);

            // Если включено "показать видео" - рисуем видео с камеры как фон
            drawCameraBackground();

            // Анализируем звук (только в режиме жестов)
            if (config.audioEnabled && !editorMode) {
                analyzeAudio();
            }

            // Плавное положение рук между кадрами распознавания (до всей логики жестов)
            updateHandDisplayPositions(performance.now());

            // Фиксация с таймером
            const fists = hands.filter(h => h.isFist);
            const twoFistsStable = checkStableTwoHands('isFist');

            // ФИКСАЦИЯ ВСЕХ МОЛЕКУЛ - жест "пальцы вместе" двумя руками удерживать 2 секунды
            if (fists.length === 2 && twoFistsStable) {
                if (twoFistsHoldStart === null) {
                    twoFistsHoldStart = Date.now();
                } else {
                    const holdDuration = Date.now() - twoFistsHoldStart;
                    if (holdDuration >= HOLD_DURATION) {
                        // Фиксируем ВСЕ молекулы
                        let lockedAny = false;
                        molecules.forEach(mol => {
                            if (!mol.isLocked) {
                                mol.isLocked = true;
                                mol.isShapeLocked = true;
                                mol.isGrabbed = false;
                                lockedAny = true;
                                // НЕ сбрасываем isEditing автоматически
                            }
                        });
                        if (lockedAny) saveState();
                    }
                }
            } else {
                twoFistsHoldStart = null;
            }

            // ФИКСАЦИЯ ОДНОЙ МОЛЕКУЛЫ - жест "пальцы вместе" над молекулой удерживать 2 секунды
            if (fists.length === 1 && hands.length === 1) {
                const fist = fists[0];
                let closestMol = null;
                let closestDist = Infinity;

                // Находим ближайшую незаблокированную молекулу
                molecules.forEach(mol => {
                    if (!mol.isLocked) {
                        const dist = Math.sqrt((mol.x - fist.x) ** 2 + (mol.y - fist.y) ** 2);
                        if (dist < 150 && dist < closestDist) {
                            closestDist = dist;
                            closestMol = mol;
                        }
                    }
                });

                if (closestMol) {
                    if (fistHoldMolecule === closestMol) {
                        // Продолжаем удерживать над той же молекулой
                        const holdDuration = Date.now() - fistHoldStart;
                        if (holdDuration >= HOLD_DURATION) {
                            // Фиксируем эту молекулу
                            closestMol.isLocked = true;
                            closestMol.isShapeLocked = true;
                            closestMol.isGrabbed = false;
                            // НЕ СБРАСЫВАЕМ isEditing - можно продолжать редактировать другие
                            fistHoldStart = null;
                            fistHoldMolecule = null;
                            saveState();
                        }
                    } else {
                        // Начинаем отсчет с новой молекулой
                        fistHoldStart = Date.now();
                        fistHoldMolecule = closestMol;
                    }
                } else {
                    fistHoldStart = null;
                    fistHoldMolecule = null;
                }
            } else {
                fistHoldStart = null;
                fistHoldMolecule = null;
            }

            // РАЗБЛОКИРОВКА МИЗИНЦЕМ - показать мизинец на заблокированной молекуле
            const pinkyHands = hands.filter(h => h.isPinky);
            if (pinkyHands.length === 1) {
                const pinky = pinkyHands[0];
                let unlockedAny = false;
                molecules.forEach(mol => {
                    if (mol.isLocked) {
                        const dist = Math.sqrt((mol.x - pinky.x) ** 2 + (mol.y - pinky.y) ** 2);
                        if (dist < 150) {
                            mol.isLocked = false;
                            mol.isShapeLocked = false;
                            unlockedAny = true;
                        }
                    }
                });
                if (unlockedAny) saveState();
            }

            // Обновление молекул (только в режиме жестов)
            if (!editorMode) {
                molecules.forEach(mol => mol.update());

                // ПРОВЕРКА И СЛИЯНИЕ МОЛЕКУЛ
                checkAndMergeMolecules();
            }

            // ОТСЛЕЖИВАНИЕ МОЛЕКУЛЫ ПОД ЛАДОНЬЮ (для выбора при редактировании)
            hoveredMolecule = null;
            const openHands = hands.filter(h => h.isOpen && !h.isPinching && !h.isFist && !h.isCrossed && !h.isPinky);
            if (openHands.length > 0) {
                // Ищем ближайшую молекулу под любой открытой ладонью
                let closestMol = null;
                let closestDist = Infinity;

                openHands.forEach(hand => {
                    molecules.forEach(mol => {
                        const dist = Math.sqrt((mol.x - hand.x) ** 2 + (mol.y - hand.y) ** 2);
                        if (dist < 150 && dist < closestDist) {
                            closestDist = dist;
                            closestMol = mol;
                        }
                    });
                });

                if (closestMol) {
                    hoveredMolecule = closestMol;
                    lastHoveredMolecule = closestMol;
                }
            }

            // УДАЛЕНИЕ МОЛЕКУЛЫ - скрещенные пальцы удерживать 2 секунды
            const crossedHands = hands.filter(h => h.isCrossed);
            if (crossedHands.length === 1) {
                const crossed = crossedHands[0];
                let closestMol = null;
                let closestDist = Infinity;

                // Находим ближайшую молекулу
                molecules.forEach(mol => {
                    const dist = Math.sqrt((mol.x - crossed.x) ** 2 + (mol.y - crossed.y) ** 2);
                    if (dist < 120 && dist < closestDist) {
                        closestDist = dist;
                        closestMol = mol;
                    }
                });

                if (closestMol) {
                    // УЛУЧШЕНО: Жест обнаружен - сбрасываем счётчик потери
                    crossedHoldLostTime = null;

                    if (crossedHoldMolecule === closestMol) {
                        // Продолжаем удерживать над той же молекулой
                        const holdDuration = Date.now() - crossedHoldStart;
                        if (holdDuration >= HOLD_DURATION) {
                            // Удаляем молекулу после удержания (removeMolecule сбрасывает все ссылки на неё:
                            // режим редактирования, выделение, hover, таймеры жестов)
                            removeMolecule(closestMol);
                            crossedHoldStart = null;
                            crossedHoldMolecule = null;
                            crossedHoldLostTime = null;
                            saveState();
                        }
                    } else {
                        // Начинаем отсчет с новой молекулой
                        crossedHoldStart = Date.now();
                        crossedHoldMolecule = closestMol;
                        crossedHoldLostTime = null;
                    }
                } else {
                    // УЛУЧШЕНО: Нет молекулы рядом - используем толерантность
                    if (crossedHoldStart && !crossedHoldLostTime) {
                        crossedHoldLostTime = Date.now();
                    } else if (crossedHoldLostTime && (Date.now() - crossedHoldLostTime > RESET_TOLERANCE)) {
                        crossedHoldStart = null;
                        crossedHoldMolecule = null;
                        crossedHoldLostTime = null;
                    }
                }
            } else {
                // УЛУЧШЕНО: Жест потерян - используем толерантность перед сбросом
                if (crossedHoldStart && !crossedHoldLostTime) {
                    crossedHoldLostTime = Date.now();
                } else if (crossedHoldLostTime && (Date.now() - crossedHoldLostTime > RESET_TOLERANCE)) {
                    crossedHoldStart = null;
                    crossedHoldMolecule = null;
                    crossedHoldLostTime = null;
                }
            }

            // Рисование метаболлов с мониторингом производительности
            const renderStartTime = performance.now();

            drawMetaballs();

            // Измеряем время рендеринга и адаптируем качество
            const renderTime = performance.now() - renderStartTime;
            adaptRenderingQuality(renderTime);

            // Запись видео: копируем кадр сцены ДО отрисовки элементов интерфейса
            // (курсоров рук, рамок выделения, таймеров), чтобы они не попадали в ролик
            captureRecordingFrame();

            // Визуализация прогресса таймеров

            // Прогресс фиксации одной молекулы
            if (fistHoldMolecule && fistHoldStart) {
                const progress = (Date.now() - fistHoldStart) / HOLD_DURATION;
                const angle = Math.PI * 2 * progress;

                ctx.strokeStyle = 'rgba(255, 200, 0, 0.9)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(fistHoldMolecule.x, fistHoldMolecule.y, 35, -Math.PI / 2, -Math.PI / 2 + angle);
                ctx.stroke();

                // Текст прогресса
                ctx.fillStyle = 'rgba(255, 200, 0, 0.9)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('LOCK', fistHoldMolecule.x, fistHoldMolecule.y);
            }

            // Прогресс удаления молекулы
            if (crossedHoldMolecule && crossedHoldStart) {
                const progress = (Date.now() - crossedHoldStart) / HOLD_DURATION;
                const angle = Math.PI * 2 * progress;

                ctx.strokeStyle = 'rgba(255, 50, 50, 0.9)';
                ctx.lineWidth = 4;
                ctx.beginPath();
                ctx.arc(crossedHoldMolecule.x, crossedHoldMolecule.y, 35, -Math.PI / 2, -Math.PI / 2 + angle);
                ctx.stroke();

                // Текст прогресса
                ctx.fillStyle = 'rgba(255, 50, 50, 0.9)';
                ctx.font = '16px Arial';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText('DEL', crossedHoldMolecule.x, crossedHoldMolecule.y);
            }

            // Визуализация захваченных/заблокированных молекул
            molecules.forEach(mol => {
                if (mol.isLocked) {
                    if (mol.isShapeLocked) {
                        // Двойной крестик для зафиксированной формы
                        ctx.strokeStyle = 'rgba(255, 100, 0, 0.8)';
                        ctx.lineWidth = 3;
                        const size = 15;

                        // Внешний крестик
                        ctx.beginPath();
                        ctx.moveTo(mol.x - size, mol.y - size);
                        ctx.lineTo(mol.x + size, mol.y + size);
                        ctx.moveTo(mol.x + size, mol.y - size);
                        ctx.lineTo(mol.x - size, mol.y + size);
                        ctx.stroke();

                        // Внутренний крестик
                        ctx.strokeStyle = 'rgba(255, 150, 50, 0.6)';
                        ctx.lineWidth = 2;
                        const smallSize = 8;
                        ctx.beginPath();
                        ctx.moveTo(mol.x - smallSize, mol.y - smallSize);
                        ctx.lineTo(mol.x + smallSize, mol.y + smallSize);
                        ctx.moveTo(mol.x + smallSize, mol.y - smallSize);
                        ctx.lineTo(mol.x - smallSize, mol.y + smallSize);
                        ctx.stroke();
                    } else {
                        // Красный крестик для заблокированной позиции
                        ctx.strokeStyle = 'rgba(255, 50, 50, 0.7)';
                        ctx.lineWidth = 3;
                        const size = 15;
                        ctx.beginPath();
                        ctx.moveTo(mol.x - size, mol.y - size);
                        ctx.lineTo(mol.x + size, mol.y + size);
                        ctx.moveTo(mol.x + size, mol.y - size);
                        ctx.lineTo(mol.x - size, mol.y + size);
                        ctx.stroke();
                    }
                } else if (mol.isEditing) {
                    // ВИЗУАЛЬНЫЙ ПРЕВЬЮ ДЕФОРМАЦИИ

                    // 1. Яркий пульсирующий круг для режима редактирования
                    const pulse = 0.5 + Math.sin(Date.now() / 300) * 0.2;
                    ctx.strokeStyle = `rgba(50, 150, 255, ${pulse})`;
                    ctx.lineWidth = 5;
                    ctx.setLineDash([10, 5]);
                    ctx.beginPath();
                    ctx.arc(mol.x, mol.y, 35 + Math.sin(Date.now() / 400) * 3, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // 2. НОВОЕ: Визуализация рук и оси деформации
                    if (mol.editingHands) {
                        const h1 = mol.editingHands.hand1;
                        const h2 = mol.editingHands.hand2;

                        // Линия между руками (зелёная) - ось растяжения
                        ctx.strokeStyle = 'rgba(50, 255, 100, 0.8)';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([10, 5]);
                        ctx.beginPath();
                        ctx.moveTo(h1.x, h1.y);
                        ctx.lineTo(h2.x, h2.y);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Точки рук
                        ctx.fillStyle = 'rgba(255, 100, 100, 0.9)';
                        ctx.beginPath();
                        ctx.arc(h1.x, h1.y, 10, 0, Math.PI * 2);
                        ctx.fill();

                        ctx.fillStyle = 'rgba(255, 150, 50, 0.9)';
                        ctx.beginPath();
                        ctx.arc(h2.x, h2.y, 10, 0, Math.PI * 2);
                        ctx.fill();

                        // Ось деформации через молекулу
                        const axisLength = mol.size * mol.stretchX * 0.8;
                        const axisX1 = mol.x + Math.cos(mol.deformAngle) * axisLength;
                        const axisY1 = mol.y + Math.sin(mol.deformAngle) * axisLength;
                        const axisX2 = mol.x - Math.cos(mol.deformAngle) * axisLength;
                        const axisY2 = mol.y - Math.sin(mol.deformAngle) * axisLength;

                        ctx.strokeStyle = 'rgba(255, 100, 255, 0.7)';
                        ctx.lineWidth = 3;
                        ctx.setLineDash([8, 4]);
                        ctx.beginPath();
                        ctx.moveTo(axisX1, axisY1);
                        ctx.lineTo(axisX2, axisY2);
                        ctx.stroke();

                        // Перпендикулярная ось (сжатие)
                        const perpAngle = mol.deformAngle + Math.PI / 2;
                        const perpLength = mol.size * mol.stretchY * 0.8;
                        const perpX1 = mol.x + Math.cos(perpAngle) * perpLength;
                        const perpY1 = mol.y + Math.sin(perpAngle) * perpLength;
                        const perpX2 = mol.x - Math.cos(perpAngle) * perpLength;
                        const perpY2 = mol.y - Math.sin(perpAngle) * perpLength;

                        ctx.strokeStyle = 'rgba(100, 255, 255, 0.6)';
                        ctx.lineWidth = 2;
                        ctx.setLineDash([4, 4]);
                        ctx.beginPath();
                        ctx.moveTo(perpX1, perpY1);
                        ctx.lineTo(perpX2, perpY2);
                        ctx.stroke();
                        ctx.setLineDash([]);

                        // Индикаторы степени растяжения
                        ctx.font = 'bold 12px Arial';
                        ctx.textAlign = 'center';

                        // Растяжение вдоль (X)
                        ctx.fillStyle = 'rgba(255, 100, 255, 0.9)';
                        ctx.strokeStyle = 'rgba(0, 0, 0, 0.8)';
                        ctx.lineWidth = 3;
                        ctx.strokeText(`${mol.stretchX.toFixed(1)}x`, axisX1 + Math.cos(mol.deformAngle) * 20, axisY1 + Math.sin(mol.deformAngle) * 20);
                        ctx.fillText(`${mol.stretchX.toFixed(1)}x`, axisX1 + Math.cos(mol.deformAngle) * 20, axisY1 + Math.sin(mol.deformAngle) * 20);

                        // Сжатие поперёк (Y)
                        ctx.fillStyle = 'rgba(100, 255, 255, 0.9)';
                        ctx.strokeText(`${mol.stretchY.toFixed(1)}x`, perpX1 + Math.cos(perpAngle) * 20, perpY1 + Math.sin(perpAngle) * 20);
                        ctx.fillText(`${mol.stretchY.toFixed(1)}x`, perpX1 + Math.cos(perpAngle) * 20, perpY1 + Math.sin(perpAngle) * 20);
                    }

                    // 3. Иконка редактирования
                    ctx.font = '24px Arial';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillStyle = 'rgba(50, 150, 255, 0.9)';
                    ctx.strokeStyle = 'rgba(255, 255, 255, 0.8)';
                    ctx.lineWidth = 2;
                    ctx.strokeText('✎', mol.x, mol.y - 50);
                    ctx.fillText('✎', mol.x, mol.y - 50);

                    // 4. Подсказка о режиме
                    ctx.font = '13px Arial';
                    ctx.fillStyle = 'rgba(50, 150, 255, 0.8)';
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.lineWidth = 2;
                    const hint = 'Edit mode (open mouth to exit)';
                    ctx.strokeText(hint, mol.x, mol.y + 55);
                    ctx.fillText(hint, mol.x, mol.y + 55);
                } else if (mol.isGrabbed) {
                    // Зелёный круг для захваченных
                    ctx.strokeStyle = 'rgba(50, 255, 50, 0.8)';
                    ctx.lineWidth = 3;
                    ctx.beginPath();
                    ctx.arc(mol.x, mol.y, 25, 0, Math.PI * 2);
                    ctx.stroke();
                }

                // НОВОЕ: Подсветка молекулы под ладонью (готова к выбору для редактирования)
                if (mol === hoveredMolecule && !mol.isEditing && !mol.isLocked) {
                    // Жёлтый круг с пунктиром - показывает что эта молекула будет выбрана
                    ctx.strokeStyle = 'rgba(255, 200, 50, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([6, 3]);
                    ctx.beginPath();
                    ctx.arc(mol.x, mol.y, 28, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Подсказка
                    ctx.font = '11px Arial';
                    ctx.fillStyle = 'rgba(255, 200, 50, 0.9)';
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.6)';
                    ctx.lineWidth = 2;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'top';
                    const hintText = 'Open mouth to edit';
                    ctx.strokeText(hintText, mol.x, mol.y + 35);
                    ctx.fillText(hintText, mol.x, mol.y + 35);
                }

                // UI ИНСТРУМЕНТЫ: Подсветка молекулы выбранной через панель инструментов
                // (инструменты работают в обоих режимах, поэтому и подсветка нужна в обоих)
                if (mol === selectedMoleculeUI) {
                    // Пульсирующий контур с difference режимом (инвертированный цвет)
                    ctx.save();
                    ctx.globalCompositeOperation = 'difference';

                    const pulse = 0.7 + Math.sin(Date.now() / 250) * 0.3;

                    // Внешний круг
                    ctx.strokeStyle = `rgba(255, 255, 255, ${pulse})`;
                    ctx.lineWidth = 5;
                    ctx.setLineDash([10, 5]);
                    ctx.beginPath();
                    ctx.arc(mol.x, mol.y, mol.size * 1.2, 0, Math.PI * 2);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Дополнительный внутренний круг
                    ctx.strokeStyle = `rgba(255, 255, 255, ${0.5 + pulse * 0.3})`;
                    ctx.lineWidth = 2;
                    ctx.beginPath();
                    ctx.arc(mol.x, mol.y, mol.size * 0.9, 0, Math.PI * 2);
                    ctx.stroke();

                    ctx.restore();
                }
            });

            // Визуализация рук
            hands.forEach(hand => {
                let color, iconKey;
                // УЛУЧШЕНО: Приоритетный порядок отображения жестов
                if (hand.isPinching) {
                    color = 'rgba(255, 100, 100, 0.6)';
                    iconKey = null; // No icon for pinch yet
                } else if (hand.isPinky) {
                    color = 'rgba(255, 200, 0, 0.7)';
                    iconKey = 'unlock';
                } else if (hand.isCrossed) {
                    color = 'rgba(255, 50, 150, 0.7)';
                    iconKey = 'delete';
                } else if (hand.isFist) {
                    color = 'rgba(255, 150, 50, 0.6)';
                    iconKey = 'lock';
                } else if (hand.isOpen) {
                    color = 'rgba(100, 255, 100, 0.6)';
                    iconKey = 'open';
                } else {
                    color = 'rgba(150, 150, 150, 0.5)';
                    iconKey = null;
                }

                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(hand.x, hand.y, 15, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#1a1a1a';
                ctx.lineWidth = 2;
                ctx.stroke();

                // Icon для жеста
                if (iconKey && isImageReady(gestureIcons[iconKey])) {
                    const iconSize = 24;
                    ctx.drawImage(
                        gestureIcons[iconKey],
                        hand.x - iconSize / 2,
                        hand.y - 50,
                        iconSize,
                        iconSize
                    );
                }

                // Индикатор прогресса удержания pinch для создания молекулы
                if (hand.isPinching && !hand.isFist && !hand.isCrossed && !hand.isPinky) {
                    const slot = hand.slot;
                    if (pinchHoldStarts[slot] !== null && !pinchCreatedFlags[slot]) {
                        const holdTime = Date.now() - pinchHoldStarts[slot];
                        const progress = Math.min(holdTime / HOLD_DURATION, 1);

                        // Рисуем круговой индикатор прогресса
                        ctx.strokeStyle = 'rgba(50, 200, 50, 0.8)';
                        ctx.lineWidth = 4;
                        ctx.beginPath();
                        ctx.arc(hand.x, hand.y, 25, -Math.PI / 2, -Math.PI / 2 + progress * Math.PI * 2);
                        ctx.stroke();

                        // Текст с процентами
                        ctx.fillStyle = 'rgba(50, 200, 50, 0.9)';
                        ctx.font = 'bold 12px Arial';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';
                        ctx.fillText(`${Math.round(progress * 100)}%`, hand.x, hand.y + 45);
                    }
                }
            });

            // Линия между двумя руками
            const openHandsForLine = hands.filter(h => h.isOpen);
            if (openHandsForLine.length === 2) {
                // Если молекула в режиме редактирования - показываем специальную линию
                const inEditMode = editingMolecule && editingMolecule.isEditing;

                if (inEditMode) {
                    // Яркая анимированная линия для режима редактирования
                    const gradient = ctx.createLinearGradient(
                        openHandsForLine[0].x, openHandsForLine[0].y,
                        openHandsForLine[1].x, openHandsForLine[1].y
                    );
                    gradient.addColorStop(0, 'rgba(50, 150, 255, 0.7)');
                    gradient.addColorStop(0.5, 'rgba(100, 200, 255, 0.9)');
                    gradient.addColorStop(1, 'rgba(50, 150, 255, 0.7)');

                    ctx.strokeStyle = gradient;
                    ctx.lineWidth = 4;
                    ctx.setLineDash([10, 5]);
                    ctx.beginPath();
                    ctx.moveTo(openHandsForLine[0].x, openHandsForLine[0].y);
                    ctx.lineTo(openHandsForLine[1].x, openHandsForLine[1].y);
                    ctx.stroke();
                    ctx.setLineDash([]);

                    // Показываем расстояние
                    const distX = Math.abs(openHandsForLine[1].x - openHandsForLine[0].x);
                    const distY = Math.abs(openHandsForLine[1].y - openHandsForLine[0].y);
                    const midX = (openHandsForLine[0].x + openHandsForLine[1].x) / 2;
                    const midY = (openHandsForLine[0].y + openHandsForLine[1].y) / 2;

                    ctx.font = '12px Arial';
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
                    ctx.lineWidth = 3;
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';

                    // Вычисляем расстояние и угол
                    // (раньше читалось несуществующее поле targetDeformAngle -> на экране был "NaN°")
                    const totalDist = Math.round(Math.sqrt(distX * distX + distY * distY));
                    const angle = Math.round(editingMolecule.deformAngle * 180 / Math.PI);

                    // Показываем информацию о деформации
                    const text = `Distance: ${totalDist}px | Angle: ${angle}°`;
                    ctx.strokeText(text, midX, midY - 10);
                    ctx.fillText(text, midX, midY - 10);

                    // Дополнительная информация
                    const stretchInfo = `Stretch: ${editingMolecule.stretchX.toFixed(2)} × ${editingMolecule.stretchY.toFixed(2)}`;
                    ctx.font = '10px Arial';
                    ctx.strokeText(stretchInfo, midX, midY + 10);
                    ctx.fillText(stretchInfo, midX, midY + 10);
                } else {
                    // Обычная линия
                    ctx.strokeStyle = 'rgba(100, 255, 100, 0.4)';
                    ctx.lineWidth = 3;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath();
                    ctx.moveTo(openHandsForLine[0].x, openHandsForLine[0].y);
                    ctx.lineTo(openHandsForLine[1].x, openHandsForLine[1].y);
                    ctx.stroke();
                    ctx.setLineDash([]);
                }
            }

            // Состояние кнопок Lock/Unlock по текущему выделению
            updateSelectionButtons();

            // Подсказка на пустом холсте: новому пользователю иначе непонятно, с чего начать
            if (molecules.length === 0 && drawnStrokes.length === 0 && !currentStroke &&
                filledRegions.length === 0 && backgroundFills.length === 0) {
                drawEmptyStateHint();
            }

            // Индикатор режима производительности - только если качество снижено автоматически
            // из-за медленных кадров (на телефонах экономный режим включён сразу и плашка не нужна).
            // Рисуем по центру под индикатором режима: в левом верхнем углу её перекрывала кнопка "?".
            if (isLowPerformanceMode && lowPerformanceAuto && frameTimeHistory.length > 0) {
                const avgFrameTime = frameTimeHistory.reduce((a, b) => a + b, 0) / frameTimeHistory.length;

                ctx.save();
                ctx.font = 'bold 14px Arial';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'top';

                // Измеряется время отрисовки сцены, а не FPS всего кадра
                const text = `⚡ Optimized mode | render ${Math.round(avgFrameTime)} ms | low quality`;
                const padding = 8;
                const boxWidth = ctx.measureText(text).width + padding * 2;
                const boxHeight = 30;
                const boxX = (width - boxWidth) / 2;
                const boxY = 70;

                // Фон
                ctx.fillStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.fillRect(boxX, boxY, boxWidth, boxHeight);

                // Текст
                ctx.fillStyle = 'rgba(255, 200, 100, 1)';
                ctx.fillText(text, boxX + padding, boxY + padding);
                ctx.restore();
            }

            requestAnimationFrame(animate);
        }

        // Обработка видео для MediaPipe.
        // Распознаём только НОВЫЕ кадры камеры: камера даёт 15-30 кадров/с, а цикл requestAnimationFrame
        // крутится 60 раз/с - раньше до 2/3 работы нейросети уходило на повтор того же кадра.
        let detectLoopRunning = false;
        let detectErrorCount = 0;
        let lastVideoFrameKey = -1;

        // Номер текущего кадра видео. currentTime для этого не годится: он растёт непрерывно,
        // а не по кадрам. Если браузер не считает кадры (totalVideoFrames = 0) - откат на currentTime.
        function getVideoFrameKey() {
            const quality = video.getVideoPlaybackQuality ? video.getVideoPlaybackQuality() : null;
            return quality && quality.totalVideoFrames > 0 ? quality.totalVideoFrames : video.currentTime;
        }

        // Частота распознавания рук на телефонах и планшетах подстраивается под скорость устройства:
        // интервал = 1.5 × среднее время распознавания, но не чаще ~30 и не реже ~15 раз в секунду.
        // Быстрый iPad распознаёт каждый кадр камеры, слабый телефон не перегревается.
        // (Раньше был жёсткий предел 20 раз/с - вместе с распознаванием лица в том же цикле
        // это давало 10-15 неравномерных обновлений в секунду.)
        const MOBILE_MIN_DETECT_INTERVAL_MS = 33;
        const MOBILE_MAX_DETECT_INTERVAL_MS = 66;
        let handsDetectMsAvg = 20;
        let lastDetectTime = 0;

        // Лицо (детектор открытого рта) - по таймеру ~7 раз в секунду на всех устройствах
        const FACE_DETECT_INTERVAL_MS = 150;
        let lastFaceDetectTime = 0;

        function getDetectInterval() {
            if (!isMobile) return 0;
            return Math.max(MOBILE_MIN_DETECT_INTERVAL_MS, Math.min(MOBILE_MAX_DETECT_INTERVAL_MS, handsDetectMsAvg * 1.5));
        }

        function startDetectionLoop() {
            if (detectLoopRunning) return;
            detectLoopRunning = true;
            requestAnimationFrame(detectHands);
        }

        async function detectHands() {
            const now = performance.now();
            const frameKey = getVideoFrameKey();
            const hasNewFrame = video.readyState >= video.HAVE_CURRENT_DATA && frameKey !== lastVideoFrameKey;
            const throttled = now - lastDetectTime < getDetectInterval();

            if (handsDetector && hasNewFrame && !throttled && !cameraSwitching) {
                lastVideoFrameKey = frameKey;
                lastDetectTime = now;
                try {
                    const handsStart = performance.now();
                    await handsDetector.send({ image: video });
                    handsDetectMsAvg = handsDetectMsAvg * 0.9 + (performance.now() - handsStart) * 0.1;

                    // FaceMesh опционально - не блокирует работу рук
                    if (faceMeshReady && faceMesh && now - lastFaceDetectTime >= FACE_DETECT_INTERVAL_MS) {
                        lastFaceDetectTime = now;
                        try {
                            await faceMesh.send({ image: video });
                        } catch {
                            // Игнорируем ошибки FaceMesh
                        }
                    }
                } catch (error) {
                    // Не засоряем консоль одной и той же ошибкой много раз в секунду
                    detectErrorCount++;
                    if (detectErrorCount <= 5) {
                        console.error('❌ Ошибка детекции рук:', error);
                    }
                }
            }
            requestAnimationFrame(detectHands);
        }

        // UI контролы
        document.getElementById('molSizeSlider').addEventListener('input', (e) => {
            config.moleculeSize = parseInt(e.target.value, 10);
