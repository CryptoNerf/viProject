                        touchedMolecule = createMoleculeAt(x, y);
                        if (touchedMolecule) {
                            statusEl.textContent = `Molecule created | ${molecules.length}/${maxMolecules}`;
                        }
                    } else if (moleculeTool === 'select') {
                        // Инструмент Select касанием пустого места только снимает выделение
                        selectedMoleculeUI = null;
                        showCreateToolHint();
                    }
                } else if (touches.length === 2) {
                    // Два касания - режим pinch-to-zoom
                    cancelLongPress();
                    if (isDrawing) finishPointerAction(); // Второй палец завершает штрих

                    const p1 = getCanvasPoint(touches[0].clientX, touches[0].clientY);
                    const p2 = getCanvasPoint(touches[1].clientX, touches[1].clientY);

                    initialPinchDistance = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    lastPinchAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);

                    // Находим молекулу между двумя пальцами (если первый палец уже держит молекулу - её)
                    if (!touchedMolecule) {
                        touchedMolecule = findMoleculeAt((p1.x + p2.x) / 2, (p1.y + p2.y) / 2, 2);
                    }
                }
            }, { passive: false });

            canvas.addEventListener('touchmove', (e) => {
                e.preventDefault();
                if (isPenTouch(e)) return;

                const touches = e.touches;

                if (touches.length === 1) {
                    const { x, y } = getCanvasPoint(touches[0].clientX, touches[0].clientY);

                    // РЕЖИМ РЕДАКТОРА - рисование карандашом и стирание ластиком
                    if (isDrawing) {
                        paintPointerMove(x, y);
                        return;
                    }

                    // Перемещение молекулы одним пальцем
                    if (touchedMolecule) {
                        if (!touchStartPoint ||
                            Math.hypot(x - touchStartPoint.x, y - touchStartPoint.y) > LONG_PRESS_MOVE_TOLERANCE) {
                            cancelLongPress(); // Отменяем длинное нажатие при заметном движении
                            touchChanged = true;
                        }
                        moveMoleculeTo(touchedMolecule, x, y);
                    }
                } else if (touches.length === 2 && touchedMolecule && initialPinchDistance > 0) {
                    // Масштабирование молекулы двумя пальцами (pinch)
                    cancelLongPress();

                    const p1 = getCanvasPoint(touches[0].clientX, touches[0].clientY);
                    const p2 = getCanvasPoint(touches[1].clientX, touches[1].clientY);

                    const currentDistance = Math.hypot(p2.x - p1.x, p2.y - p1.y);
                    const scaleFactor = currentDistance / initialPinchDistance;
                    initialPinchDistance = currentDistance; // Обновляем для следующего события

                    // Поворот двумя пальцами (как Alt+мышь). Разницу углов приводим к [-π, π],
                    // чтобы при переходе через ±180° молекула не прокручивалась на полный оборот.
                    const currentAngle = Math.atan2(p2.y - p1.y, p2.x - p1.x);
                    let angleDelta = currentAngle - lastPinchAngle;
                    if (angleDelta > Math.PI) angleDelta -= Math.PI * 2;
                    if (angleDelta < -Math.PI) angleDelta += Math.PI * 2;
                    lastPinchAngle = currentAngle;
                    if (!touchedMolecule.isShapeLocked) {
                        touchedMolecule.deformAngle = (touchedMolecule.deformAngle + angleDelta) % (Math.PI * 2);
                    }

                    // Масштабируем от целевого размера (текущий size отстаёт из-за плавной анимации)
                    const newSize = clampMoleculeSize(touchedMolecule.targetSize * scaleFactor);
                    resizeMolecule(touchedMolecule, newSize);

                    // Также двигаем молекулу к центру между пальцами
                    moveMoleculeTo(touchedMolecule, (p1.x + p2.x) / 2, (p1.y + p2.y) / 2);
                    touchChanged = true;

                    statusEl.textContent = `Size: ${Math.round(newSize)}px, angle: ${Math.round(touchedMolecule.deformAngle * 180 / Math.PI)}° (two fingers)`;
                }
            }, { passive: false });

            const onTouchEnd = (e) => {
                e.preventDefault();
                if (isPenTouch(e) && !isDrawing && !touchedMolecule) return;

                // Завершение рисования
                if (isDrawing) {
                    if (e.touches.length === 0) finishPointerAction();
                    return;
                }

                cancelLongPress();

                if (e.touches.length === 0) {
                    if (touchedMolecule) {
                        touchedMolecule.isGrabbed = false;
                    }
                    if (touchChanged) {
                        saveState(); // Перемещение/масштаб пальцем теперь тоже можно отменить
                    }
                    touchChanged = false;
                    touchedMolecule = null;
                    touchStartPoint = null;
                    initialPinchDistance = 0;
                } else {
                    // Остался один палец после pinch - продолжаем перемещение без "долгого нажатия"
                    touchStartPoint = null;
                }
            };

            canvas.addEventListener('touchend', onTouchEnd, { passive: false });
            canvas.addEventListener('touchcancel', onTouchEnd, { passive: false });

            console.log('✅ Touch события для мобильных устройств добавлены');
        }

        // Инициализация
        async function init() {
            console.log('=== НАЧАЛО ИНИЦИАЛИЗАЦИИ ===');

            // Инициализируем палитру цветов Paint
            initColorPalette();
            canvas.style.cursor = getCursorForTool(moleculeTool);

            resize();
            updateLayout();
            window.addEventListener('resize', () => {
                resize();
                updateLayout();
            });

            // Сохраняем начальное пустое состояние для возможности отмены первого действия
            saveState();

            console.log('Запускаем анимацию...');
            animate();

            // Модель жестов, камера и микрофон загружаются параллельно и не блокируют приложение:
            // мышь, касания и редактор работают сразу, прогресс показывает карточка #engineCard
            startHandsEngine();
            const [camera, audio] = await Promise.all([
                setupCamera(),
                setupAudio()
            ]);

            console.log('Результаты инициализации - Камера:', !!camera, 'Аудио:', audio);

            if (camera) {
                startDetectionLoop();
                statusEl.textContent = audio ? 'Gesture mode | Ready' : 'Running without sound';
            } else if (statusEl.textContent === 'Loading...') {
                // Если камеры нет, setupCamera() уже вывел конкретную причину - не перетираем её
                statusEl.textContent = 'Running without camera';
            }

            console.log('=== КОНЕЦ ИНИЦИАЛИЗАЦИИ ===');
        }

        console.log('🚀 Запуск приложения...');
        init();
    </script>

    <!-- Регистрация Service Worker для PWA -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('/service-worker.js')
                    .then(registration => {
                        console.log('✅ Service Worker зарегистрирован:', registration.scope);
                    })
                    .catch(error => {
                        console.log('❌ Ошибка регистрации Service Worker:', error);
                    });
            });
        }
    </script>
</body>
