            userMoleculeSize = config.moleculeSize; // Больше не подстраиваем размер под экран автоматически
            document.getElementById('molSize').textContent = config.moleculeSize;
        });

        document.getElementById('shapeSelector').addEventListener('change', (e) => {
            selectedShape = e.target.value;

            // Если есть выбранная молекула через UI инструменты - меняем её форму
            if (selectedMoleculeUI && moleculeTool === 'select') {
                selectedMoleculeUI.shapes = [{type: selectedShape, weight: 1}];
                saveState();
                statusEl.textContent = `Molecule shape changed to: ${selectedShape}`;
            }
        });

        // Custom select initialization
        const customSelect = document.querySelector('.custom-select');
        const customSelectTrigger = document.querySelector('.custom-select-trigger');
        const customOptions = document.querySelectorAll('.custom-option');
        const realSelect = document.getElementById('shapeSelector');

        customSelectTrigger.addEventListener('click', function() {
            customSelect.classList.toggle('open');
        });

        customOptions.forEach(option => {
            option.addEventListener('click', function() {
                const value = this.getAttribute('data-value');
                const text = this.textContent;

                // Update trigger text
                customSelectTrigger.textContent = text;

                // Update real select
                realSelect.value = value;
                realSelect.dispatchEvent(new Event('change'));

                // Remove selected class from all options
                customOptions.forEach(opt => opt.classList.remove('selected'));

                // Add selected class to clicked option
                this.classList.add('selected');

                // Close dropdown
                customSelect.classList.remove('open');
            });
        });

        // Close dropdown when clicking outside
        document.addEventListener('click', function(e) {
            if (!customSelect.contains(e.target)) {
                customSelect.classList.remove('open');
            }
        });

        document.getElementById('mergeSlider').addEventListener('input', (e) => {
            config.mergeStrength = parseFloat(e.target.value);
            document.getElementById('mergeStrength').textContent = config.mergeStrength.toFixed(1);
        });

        document.getElementById('audioSensSlider').addEventListener('input', (e) => {
            config.audioSensitivity = parseInt(e.target.value, 10);
            document.getElementById('audioSens').textContent = config.audioSensitivity;
        });

        document.getElementById('audioEnabled').addEventListener('change', (e) => {
            config.audioEnabled = e.target.checked;
        });

        document.getElementById('showVideo').addEventListener('change', (e) => {
            config.showVideo = e.target.checked;
            video.style.opacity = config.showVideo ? '0.3' : '0';
        });

        document.getElementById('lockBtn').addEventListener('click', () => {
            if (molecules.length === 0) return;
            molecules.forEach(mol => mol.lock());
            saveState();
            statusEl.textContent = 'All molecules locked';
        });

        document.getElementById('unlockBtn').addEventListener('click', () => {
            if (molecules.length === 0) return;
            molecules.forEach(mol => mol.unlock());
            saveState();
            statusEl.textContent = 'All molecules unlocked';
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            if (molecules.length === 0) {
                statusEl.textContent = 'Nothing to clear';
                return;
            }
            molecules = [];
            // Раньше ссылки на удалённые молекулы (выделение, режим редактирования, таймеры жестов)
            // оставались, а очистку нельзя было отменить
            resetMoleculeReferences();
            saveState();
            statusEl.textContent = 'All molecules cleared (Ctrl+Z to undo)';
        });

        // === ЭКСПОРТ ===

        // Скачивание файла. URL освобождается не сразу: синхронный revokeObjectURL сразу после
        // click() в Firefox/Safari может прервать скачивание.
        function downloadBlob(blob, filename) {
            const url = URL.createObjectURL(blob);
            const link = document.createElement('a');
            link.href = url;
            link.download = filename;
            document.body.appendChild(link);
            link.click();
            link.remove();
            setTimeout(() => URL.revokeObjectURL(url), 10000);
        }

        // Рендер "чистого" кадра для экспорта: только сцена, без курсоров рук, рамок выделения,
        // таймеров и подсказок (раньше экспорт "с фоном" сохранял всё это в PNG).
        // Следующий кадр animate() вернёт интерфейс на экран.
        function renderCleanFrame(withBackground) {
            const savedBgType = backgroundType;
            const savedShowVideo = config.showVideo;
            isCleanRender = true;
            try {
                ctx.clearRect(0, 0, width, height);
                if (withBackground) {
                    drawCameraBackground();
                } else {
                    backgroundType = 'transparent';
                    config.showVideo = false;
                }
                drawMetaballs();
            } finally {
                backgroundType = savedBgType;
                config.showVideo = savedShowVideo;
                isCleanRender = false;
            }
        }

        // ЭКСПОРТ: PNG (с фоном или без в зависимости от галочки)
        document.getElementById('exportPngBtn').addEventListener('click', () => {
            const withBackground = document.getElementById('exportWithBackground').checked;
            try {
                renderCleanFrame(withBackground);
                // toBlob копирует содержимое холста синхронно, в момент вызова
                canvas.toBlob((blob) => {
                    if (!blob) {
                        statusEl.textContent = 'PNG export error';
                        return;
                    }
                    const suffix = withBackground ? '' : '_transparent';
                    downloadBlob(blob, `molecules${suffix}_${Date.now()}.png`);
                }, 'image/png');
                statusEl.textContent = withBackground ? 'PNG exported (with background)' : 'PNG exported (no background)';
            } catch (err) {
                console.error('Ошибка экспорта PNG:', err);
                statusEl.textContent = 'PNG export error';
            }
        });

        // ЭКСПОРТ: Запись видео.
        // Записывается отдельный холст, в который animate() копирует сцену ДО отрисовки элементов
        // интерфейса (см. captureRecordingFrame) - курсоры рук и рамки выделения не попадают в ролик.
        const RECORDING_DURATION_MS = 30000;
        const recordBtnText = document.getElementById('recordBtnText');
        let mediaRecorder = null;
        let recordingTimeoutId = null;
        let recordCanvas = null;
        let recordCtx = null;
        let savedBackgroundSettings = null;

        function captureRecordingFrame() {
            if (!recordCtx || !mediaRecorder || mediaRecorder.state !== 'recording') return;
            if (recordCanvas.width !== width || recordCanvas.height !== height) {
                recordCanvas.width = width;
                recordCanvas.height = height;
            }
            recordCtx.clearRect(0, 0, width, height);
            recordCtx.drawImage(canvas, 0, 0);
        }

        // Первый поддерживаемый формат: Chrome/Firefox пишут WebM, Safari - только MP4
        function pickRecordingMimeType() {
            const candidates = [
                'video/webm;codecs=vp9',
                'video/webm;codecs=vp8',
                'video/webm',
                'video/mp4;codecs=avc1',
                'video/mp4'
            ];
            return candidates.find(type => MediaRecorder.isTypeSupported(type)) || '';
        }

        function restoreRecordingBackground() {
            if (savedBackgroundSettings) {
                backgroundType = savedBackgroundSettings.bgType;
                config.showVideo = savedBackgroundSettings.showVideo;
                savedBackgroundSettings = null;
            }
        }

        function stopRecording() {
            clearTimeout(recordingTimeoutId);
            recordingTimeoutId = null;
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                mediaRecorder.stop(); // Дальше - в onstop
            }
        }

        document.getElementById('recordVideoBtn').addEventListener('click', () => {
            if (mediaRecorder && mediaRecorder.state === 'recording') {
                stopRecording();
                return;
            }

            if (typeof MediaRecorder === 'undefined' || !canvas.captureStream) {
                statusEl.textContent = 'Video recording is not supported in this browser';
                return;
            }

            try {
                const withBackground = document.getElementById('exportWithBackground').checked;

                // Если запись без фона - на время записи отключаем фон
                if (!withBackground) {
                    savedBackgroundSettings = {
                        bgType: backgroundType,
                        showVideo: config.showVideo
                    };
                    backgroundType = 'transparent';
                    config.showVideo = false;
                }

                if (!recordCanvas) {
                    recordCanvas = document.createElement('canvas');
                    recordCtx = recordCanvas.getContext('2d');
                }
                recordCanvas.width = width;
                recordCanvas.height = height;

                const stream = recordCanvas.captureStream(60); // 60 FPS
                const mimeType = pickRecordingMimeType();
                const recorder = new MediaRecorder(stream, mimeType ? { mimeType } : undefined);
                const chunks = [];

                recorder.ondataavailable = (e) => {
                    if (e.data && e.data.size > 0) {
                        chunks.push(e.data);
                    }
                };

                recorder.onstop = () => {
                    stream.getTracks().forEach(track => track.stop());
                    restoreRecordingBackground();

                    const type = recorder.mimeType || mimeType || 'video/webm';
                    const extension = type.startsWith('video/mp4') ? 'mp4' : 'webm';
                    if (chunks.length > 0) {
                        downloadBlob(new Blob(chunks, { type }), `molecules_animation_${Date.now()}.${extension}`);
                        statusEl.textContent = 'Video saved';
                    } else {
                        statusEl.textContent = 'Video is empty';
                    }
                    recordBtnText.textContent = 'Record video (30 sec)';
                };

                mediaRecorder = recorder;
                recorder.start(1000); // Данные порциями раз в секунду
                recordBtnText.textContent = 'Stop recording';
                statusEl.textContent = withBackground ? 'Recording video with background... (30 sec)' : 'Recording video without background... (30 sec)';

                // Автоматическая остановка через 30 секунд.
                // Таймер сохраняется и сбрасывается при ручной остановке - иначе старый таймер
                // обрывал следующую запись, начатую раньше чем через 30 секунд.
                recordingTimeoutId = setTimeout(stopRecording, RECORDING_DURATION_MS);
            } catch (err) {
                console.error('Ошибка записи видео:', err);
                statusEl.textContent = 'Video recording error';
                restoreRecordingBackground();
            }
        });

        // UI сворачивание/разворачивание панелей
        const controlsPanel = document.getElementById('controls');
        const toggleHintsBtn = document.getElementById('toggleHints');
        const toggleControlsBtn = document.getElementById('toggleControls');
        const closeControlsBtn = document.getElementById('closeControls');

        // Открыть книгу с мануалом
        toggleHintsBtn.addEventListener('click', () => {
            window.open('manual.html', '_blank');
        });

        // === РАСКЛАДКА (phone / tablet / desktop) ===
        // computeLayout() объявлена в <head>. На телефоне и планшете настройки и палитра -
        // выезжающие панели, и одновременно открыта только одна из них.
        let currentLayout = null;

        function isCompactLayout() {
            return currentLayout === 'phone' || currentLayout === 'tablet';
        }

        // Скрыть/показать панель настроек
        function setControlsPanelOpen(open) {
            controlsPanel.classList.toggle('minimized', !open);
            toggleControlsBtn.classList.toggle('visible', !open);
            if (open && isCompactLayout()) {
                setPaletteOpen(false);
            }
            updateSidePanelState();
        }

        // Класс на <html>, пока открыта панель настроек или палитра (см. CSS про кнопку ≡)
        function updateSidePanelState() {
            const paletteOpen = colorPalette.classList.contains('active');
            const controlsOpen = !controlsPanel.classList.contains('minimized');
            document.documentElement.classList.toggle('side-panel-open', paletteOpen || controlsOpen);
        }

        closeControlsBtn.addEventListener('click', () => setControlsPanelOpen(false));
        // Кнопка ≡ переключает панель (на телефоне она видна и при открытой панели)
        toggleControlsBtn.addEventListener('click', () => {
            setControlsPanelOpen(controlsPanel.classList.contains('minimized'));
        });

        function setActiveToolButton(activeBtn) {
            document.querySelectorAll('.tool-btn').forEach(b => b.classList.toggle('active', b === activeBtn));
        }

        // Выбор инструмента молекул (select / create / delete). ИСПРАВЛЕНО: работают в обоих режимах
        function selectMoleculeTool(tool) {
            moleculeTool = tool;
            currentTool = ''; // Сбрасываем инструмент рисования
            setActiveToolButton(document.getElementById(`tool-${tool}`));

            // Сбрасываем все состояния при смене инструмента
            selectedMoleculeUI = null;
            isDraggingMolecule = false;
            isDrawing = false;
            currentStroke = null;

            canvas.style.cursor = getCursorForTool(tool);
            statusEl.textContent = getToolName(tool);
            // Без инструмента рисования палитра показывает все секции - с нейтральными подписями
            document.getElementById('fillModeLabel').textContent = 'Fill mode:';
            document.getElementById('pencilToolLabel').textContent = 'Pencil:';
            updatePaletteSections();
        }

        document.querySelectorAll('.tool-btn:not(.paint-tool-btn)').forEach(btn => {
            btn.addEventListener('click', () => selectMoleculeTool(btn.id.replace('tool-', '')));
        });

        // Курсор для каждого инструмента
        function getCursorForTool(tool) {
            // Кастомные курсоры с иконками инструментов
            // Формат: url(путь) hotspot-x hotspot-y, fallback
            switch(tool) {
                case 'select': return 'url(icons/select.png) 12 12, default';
                case 'create': return 'url(icons/create.png) 12 12, crosshair';
                case 'delete': return 'url(icons/delete.png) 12 12, not-allowed';
                default: return 'default';
            }
        }

        // Название инструмента + что им делать (для строки статуса).
        // На сенсорных раскладках - про касания, на десктопе - про мышь и клавиши.
        function getToolName(tool) {
            const touch = isTouchDevice && currentLayout !== 'desktop';
            switch(tool) {
                case 'select': return touch
                    ? 'Select: tap a molecule, drag to move, two fingers to resize and rotate'
                    : 'Select: drag a molecule to move (Ctrl/Cmd = size, Shift = stretch, Alt = rotate, wheel = size)';
                case 'create': return touch ? 'Create: tap the canvas to add a molecule' : 'Create: click the canvas to add a molecule';
                case 'delete': return touch ? 'Delete: tap a molecule to remove it' : 'Delete: click a molecule to remove it';
                default: return 'Unknown tool';
            }
        }

        // Пользователь ткнул в пустое место инструментом Select - скорее всего, хотел создать молекулу
        function showCreateToolHint() {
            const touch = isTouchDevice && currentLayout !== 'desktop';
            showHint('create-tool', `${touch ? 'Tapping' : 'Clicking'} with Select only picks and moves molecules. To add a new one, choose the Create tool (second button on the toolbar) or pinch thumb and index finger in front of the camera.`, { once: false });
        }

        // Фиксация выбранной молекулы
        document.getElementById('action-lock').addEventListener('click', () => {
            if (selectedMoleculeUI) {
                selectedMoleculeUI.lock();
                saveState();
                statusEl.textContent = 'Molecule locked';
            } else {
                statusEl.textContent = 'First select molecule with Select tool';
            }
        });

        // Разблокировка выбранной молекулы
        document.getElementById('action-unlock').addEventListener('click', () => {
            if (selectedMoleculeUI) {
                selectedMoleculeUI.unlock();
                saveState();
                statusEl.textContent = 'Molecule unlocked';
            } else {
                statusEl.textContent = 'First select molecule with Select tool';
            }
        });

        // === ПОДСКАЗКИ ===
        // Короткие подсказки в ключевые моменты: первый вход в редактор, касание пустого места
        // инструментом Select и т.п. once: true - один раз за всё время (localStorage),
        // once: false - не чаще раза за сеанс.
        const hintToast = document.getElementById('hintToast');
        const hintTextEl = document.getElementById('hintText');
        const hintsShownThisSession = new Set();
        let hintTimer = null;

        function isHintSeen(key) {
            try {
                return localStorage.getItem(`vi-hint:${key}`) === '1';
            } catch {
                return hintsShownThisSession.has(key);
            }
        }

        function markHintSeen(key) {
            try {
                localStorage.setItem(`vi-hint:${key}`, '1');
            } catch {
                // Хранилище недоступно (приватный режим) - подсказка покажется снова в следующий раз
            }
        }

        function showHint(key, text, { once = true, duration = 10000 } = {}) {
            if (hintsShownThisSession.has(key) || (once && isHintSeen(key))) return;
            hintsShownThisSession.add(key);
            if (once) markHintSeen(key);

            hintTextEl.textContent = text;
            hintToast.hidden = false;
            clearTimeout(hintTimer);
            hintTimer = setTimeout(hideHint, duration);
        }

        function hideHint() {
            clearTimeout(hintTimer);
            hintToast.hidden = true;
        }

        document.getElementById('hintClose').addEventListener('click', hideHint);

        // === ПАЛИТРА И КНОПКИ ПАНЕЛИ "EDIT" ===
        const colorPalette = document.getElementById('colorPalette');
        const closePaletteBtn = document.getElementById('closePalette');
        const actionUndoBtn = document.getElementById('action-undo');
        const actionRedoBtn = document.getElementById('action-redo');
        const actionPaletteBtn = document.getElementById('action-palette');
        const actionLockBtn = document.getElementById('action-lock');
        const actionUnlockBtn = document.getElementById('action-unlock');
        const modeOptions = document.querySelectorAll('#modeSwitch .mode-option');

        // Палитра открывается кнопкой на панели инструментов (на всех раскладках)
        function setPaletteOpen(open) {
            colorPalette.classList.toggle('active', open);
            actionPaletteBtn.classList.toggle('active', open);
            actionPaletteBtn.setAttribute('aria-pressed', String(open));
            if (open && isCompactLayout()) {
                setControlsPanelOpen(false);
            }
            updateSidePanelState();
        }

        function togglePalette() {
            setPaletteOpen(!colorPalette.classList.contains('active'));
        }

        closePaletteBtn.addEventListener('click', () => setPaletteOpen(false));
        actionPaletteBtn.addEventListener('click', togglePalette);

        actionUndoBtn.addEventListener('click', () => undo());
        actionRedoBtn.addEventListener('click', () => redo());
        // Переключатель режима "Gestures | Editor"
        modeOptions.forEach(option => {
            option.addEventListener('click', () => {
                const wantEditor = option.dataset.mode === 'editor';
                if (wantEditor !== editorMode) toggleEditorMode();
            });
        });

        function updateModeSwitch() {
            modeOptions.forEach(option => {
                const active = (option.dataset.mode === 'editor') === editorMode;
                option.classList.toggle('active', active);
                option.setAttribute('aria-pressed', String(active));
            });
        }

        // Lock/Unlock доступны только когда есть выделенная молекула и действие имеет смысл.
        // Вызывается каждый кадр из animate(): выделение меняется во многих местах (клик, тач,
        // удаление, слияние, отмена), а DOM трогаем только при реальном изменении.
        let lastSelectionButtonsState = '';
        function updateSelectionButtons() {
            const mol = selectedMoleculeUI;
            const state = mol ? (mol.isLocked ? 'locked' : 'unlocked') : 'none';
            if (state === lastSelectionButtonsState) return;
            lastSelectionButtonsState = state;
            actionLockBtn.disabled = state !== 'unlocked';
            actionUnlockBtn.disabled = state !== 'locked';
        }

        // Высота нижней панели на телефоне -> CSS-переменная --toolbar-h: по ней над панелью
        // располагаются строка статуса и выезжающие листы (панель может занимать 1 или 2 строки)
        const toolbox = document.getElementById('toolbox');
        function updateToolbarHeight() {
            if (currentLayout === 'phone') {
                document.documentElement.style.setProperty('--toolbar-h', `${toolbox.offsetHeight}px`);
            } else {
                document.documentElement.style.removeProperty('--toolbar-h');
            }
        }
        if ('ResizeObserver' in window) {
            new ResizeObserver(updateToolbarHeight).observe(toolbox);
        }

        // Состояние кнопок Undo/Redo (вызывается при каждом изменении истории)
        function updateHistoryButtons() {
            actionUndoBtn.disabled = undoHistory.length <= 1;
            actionRedoBtn.disabled = redoStack.length === 0;
        }

        // Применение раскладки. Вызывается при старте и при изменении размера/ориентации.
        function updateLayout() {
            const layout = computeLayout();
            document.documentElement.dataset.layout = layout;
            document.documentElement.dataset.orientation = window.innerWidth > window.innerHeight ? 'landscape' : 'portrait';

            if (layout === currentLayout) {
                updateToolbarHeight();
                return;
            }
            const isFirstRun = currentLayout === null;
            currentLayout = layout;
            updateToolbarHeight();

            if (layout !== 'desktop') {
                // Позиция, оставшаяся от перетаскивания палитры на десктопе, мешает выезжающей панели
                colorPalette.style.left = '';
                colorPalette.style.top = '';
                colorPalette.style.bottom = '';
                colorPalette.style.transform = '';
            }

            // На телефоне/планшете холсту нужно место: настройки при старте и смене раскладки закрыты
            if (layout !== 'desktop' || (isFirstRun && isMobile)) {
                setControlsPanelOpen(false);
            }
            if (editorMode) {
                setPaletteOpen(layout !== 'phone');
            }
        }

        // === PAINT РЕЖИМ РЕДАКТОРА - UI ===

        // Текущий цвет показывает само поле выбора цвета (раньше - отдельный квадрат и отдельное поле)
        function setPrimaryColor(color, activeSwatch = null) {
            primaryColor = color;
            document.getElementById('customPrimaryColor').value = color;
            document.querySelectorAll('.color-swatch').forEach(s => s.classList.toggle('selected', s === activeSwatch));
        }

        // Палитра показывает только то, что относится к выбранному инструменту рисования:
        // раньше были видны все настройки сразу (эффекты при карандаше, толщина при заливке)
        function updatePaletteSections() {
            document.querySelectorAll('#colorPalette .color-section[data-tools]').forEach(section => {
                const tools = section.dataset.tools.split(' ');
                section.hidden = !(tools.includes('all') || !currentTool || tools.includes(currentTool));
            });
        }

        // Инициализация палитры цветов
        function initColorPalette() {
            const colorGrid = document.getElementById('colorGrid');
            paintColors.forEach(color => {
                const swatch = document.createElement('div');
                swatch.className = 'color-swatch';
                swatch.style.background = color;
                swatch.dataset.color = color;
                swatch.title = color;
                swatch.addEventListener('click', () => setPrimaryColor(color, swatch));
                colorGrid.appendChild(swatch);
            });

            // Обработчик для выбора произвольного цвета молекулы
            document.getElementById('customPrimaryColor').addEventListener('input', (e) => {
                setPrimaryColor(e.target.value);
            });

            setPrimaryColor(primaryColor, colorGrid.firstElementChild);

            // Палитра скрыта, пока не включён режим редактора
            setPaletteOpen(false);
        }

        // Переключение режима
        function toggleEditorMode() {
            editorMode = !editorMode;

            // Незавершённый штрих или подсветка не должны "перетекать" между режимами
            isDrawing = false;
            currentStroke = null;
            hoveredMoleculeEditor = null;

            if (editorMode) {
                // Переход в режим редактора: показываем инструменты рисования и кнопку палитры
                document.getElementById('paintToolsSection').hidden = false;

                // На телефоне палитра открывается кнопкой (иначе закрывает полэкрана), на остальных - сразу
                setPaletteOpen(currentLayout !== 'phone');

                // В редакторе молекулы не обновляются жестами - снимаем "захват" ладонью
                molecules.forEach(mol => { mol.isGrabbed = false; });

                // Сразу включаем инструмент рисования (последний использованный, по умолчанию - заливку).
                // Раньше после входа в редактор оставался инструмент Select, и было неочевидно,
                // что нужно ещё отдельно выбрать заливку или карандаш.
                selectPaintTool(lastPaintTool);

                const paletteWhere = currentLayout === 'phone'
                    ? 'Open Colors (palette button on the toolbar) to pick a color'
                    : 'Pick a color in the Colors panel';
                showHint('editor-intro', `Editor mode: the Fill tool is on. ${paletteWhere}, then tap a molecule or a closed pencil shape to fill it. Pencil draws, eraser erases. "Gestures" at the top returns to gesture mode.`);
            } else {
                // Возврат в режим жестов: скрываем инструменты рисования и палитру
                document.getElementById('paintToolsSection').hidden = true;
                setPaletteOpen(false);

                // Инструменты рисования доступны только в редакторе. Раньше после выхода
                // с выбранным карандашом в режиме жестов не оставалось ни одного активного инструмента.
                if (currentTool) {
                    selectMoleculeTool('select');
                }

                statusEl.textContent = 'Gesture mode | Ready';
            }

            updateModeSwitch();
        }

        // Курсор для инструментов рисования
        function getPaintCursor(tool, overMolecule) {
            switch (tool) {
                case 'fill': return overMolecule ? 'pointer' : 'url(icons/fill.png) 12 12, crosshair';
                case 'pencil': return 'url(icons/pencil.png) 46 2, crosshair';
                case 'eraser': return overMolecule ? 'pointer' : 'url(icons/eraser.png) 12 12, crosshair';
                default: return 'default';
            }
        }

        // Выбор инструмента рисования (заливка, карандаш, ластик)
        function selectPaintTool(tool) {
            currentTool = tool;
            moleculeTool = ''; // Сбрасываем инструмент молекул
            isDraggingMolecule = false;
            setActiveToolButton(document.querySelector(`.paint-tool-btn[data-tool="${tool}"]`));

            // Обновляем подписи настроек в зависимости от инструмента.
            // Кнопки Both/Interior/Edge работают и для заливки, и для ластика,
            // а толщина карандаша задаёт и размер ластика.
            const fillModeLabel = document.getElementById('fillModeLabel');
            const pencilToolLabel = document.getElementById('pencilToolLabel');
            const smartEraserCheckbox = document.getElementById('smartEraserCheckbox');

            fillModeLabel.textContent = tool === 'eraser' ? 'Erase mode:' : 'Fill mode:';
            pencilToolLabel.textContent = tool === 'eraser' ? 'Eraser:' : 'Pencil:';
            smartEraserCheckbox.style.display = tool === 'eraser' ? 'flex' : 'none';
            updatePaletteSections();

            canvas.style.cursor = getPaintCursor(tool, false);

            lastPaintTool = tool;
            statusEl.textContent = getPaintToolHint(tool);
        }

        // Что делать выбранным инструментом рисования (для строки статуса)
        function getPaintToolHint(tool) {
            if (tool === 'fill') {
                return `Fill (${fillMode}): pick a color, then tap a molecule or a closed pencil shape`;
            }
            if (tool === 'pencil') {
                return 'Pencil: draw on the canvas (color and thickness - in the palette)';
            }
            return smartEraserMode
                ? 'Smart eraser: tap a stroke or a fill to delete it'
                : 'Eraser: drag over strokes and fills (tap a molecule to remove its color)';
        }

        // Кнопки рисования в объединённой панели инструментов
        document.querySelectorAll('.paint-tool-btn').forEach(btn => {
            btn.addEventListener('click', () => selectPaintTool(btn.dataset.tool));
        });

        // Выбор режима заливки/ластика
        document.querySelectorAll('.fill-mode-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                // Игнорируем кнопки без data-mode (например, кнопки фона)
                if (!btn.dataset.mode) return;

                document.querySelectorAll('.fill-mode-btn').forEach(b => {
                    if (b.dataset.mode) b.classList.remove('active');
                });
                btn.classList.add('active');
                fillMode = btn.dataset.mode;

                // Показываем разный текст в зависимости от инструмента
                const modeLabel = currentTool === 'eraser' ? 'Eraser mode' : 'Fill mode';
                statusEl.textContent = `${modeLabel}: ${btn.textContent}`;
            });
        });

        // === ФОН ХОЛСТА ===
        let backgroundObjectUrl = null; // URL файла фонового видео (освобождается при смене фона)

        // Освобождаем ресурсы предыдущего фона. Раньше старое фоновое видео продолжало
        // играть (и декодироваться) после замены фона, а object URL не освобождались.
        function releaseBackgroundMedia() {
            if (backgroundImage instanceof HTMLVideoElement) {
                backgroundImage.pause();
                backgroundImage.removeAttribute('src');
                backgroundImage.load();
            }
            if (backgroundObjectUrl) {
                URL.revokeObjectURL(backgroundObjectUrl);
                backgroundObjectUrl = null;
            }
        }

        // Выбор цвета фона
        document.getElementById('bgColorPicker').addEventListener('input', (e) => {
            releaseBackgroundMedia();
            backgroundColor = e.target.value;
            backgroundType = 'color';
            backgroundImage = null;
            backgroundCacheValid = false; // Инвалидируем кеш фона
            document.getElementById('bgPreview').textContent = `Color: ${backgroundColor}`;
            statusEl.textContent = `Background: color ${backgroundColor}`;
        });

        // Загрузка файла для фона
        document.getElementById('bgFilePicker').addEventListener('change', (e) => {
            const file = e.target.files[0];
            // Сбрасываем значение, чтобы повторный выбор того же файла снова вызывал change
            e.target.value = '';
            if (!file) return;

            const url = URL.createObjectURL(file);
            const fileType = file.type;

            if (fileType.startsWith('image/')) {
                // Загружаем изображение
                const img = new Image();
                img.onload = () => {
                    releaseBackgroundMedia();
                    backgroundImage = img;
                    backgroundType = 'image';
                    backgroundCacheValid = false; // Инвалидируем кеш фона
                    // Картинка уже декодирована - URL больше не нужен
                    URL.revokeObjectURL(url);
                    document.getElementById('bgPreview').textContent = `Image: ${file.name}`;
                    statusEl.textContent = `Background: ${file.name}`;
                };
                img.onerror = () => {
                    URL.revokeObjectURL(url);
                    statusEl.textContent = 'Image loading error';
                };
                img.src = url;
            } else if (fileType.startsWith('video/')) {
                // Загружаем видео
                const bgVideo = document.createElement('video');
                bgVideo.src = url;
                bgVideo.loop = true;
                bgVideo.muted = true;
                bgVideo.playsInline = true;
                bgVideo.play().then(() => {
                    releaseBackgroundMedia();
                    backgroundImage = bgVideo;
                    backgroundType = 'video';
                    backgroundObjectUrl = url; // Видео читает файл во время воспроизведения
                    document.getElementById('bgPreview').textContent = `Video: ${file.name}`;
                    statusEl.textContent = `Background: ${file.name}`;
                }).catch(err => {
                    console.error('Ошибка воспроизведения видео:', err);
                    URL.revokeObjectURL(url);
                    statusEl.textContent = 'Video loading error';
                });
            } else {
                URL.revokeObjectURL(url);
                statusEl.textContent = 'Unsupported file type (use an image or a video)';
            }
        });

        // Очистка фона
        document.getElementById('bgClearBtn').addEventListener('click', () => {
            releaseBackgroundMedia();
            backgroundColor = '#ffffff';
            backgroundImage = null;
            backgroundType = 'color';
            backgroundCacheValid = false; // Инвалидируем кеш фона
            document.getElementById('bgColorPicker').value = '#ffffff';
            document.getElementById('bgPreview').textContent = '';
            statusEl.textContent = 'Background cleared (white)';
        });

        // Показ/скрытие настроек микрополосок
        document.getElementById('microStripesEffect').addEventListener('change', (e) => {
            const settings = document.getElementById('microStripesSettings');
            settings.style.display = e.target.checked ? 'flex' : 'none';
        });

        // Обновление значения ширины полосок
        document.getElementById('stripeWidth').addEventListener('input', (e) => {
            document.getElementById('stripeWidthValue').textContent = e.target.value;
        });

        // Обновление значения расстояния между полосками
        document.getElementById('stripeSpacing').addEventListener('input', (e) => {
            document.getElementById('stripeSpacingValue').textContent = e.target.value;
        });

        // Обновление толщины карандаша
        document.getElementById('pencilWidth').addEventListener('input', (e) => {
            pencilWidth = parseInt(e.target.value, 10);
            document.getElementById('pencilWidthValue').textContent = e.target.value;
        });

        // Переключение режима умного ластика
        document.getElementById('smartEraser').addEventListener('change', (e) => {
            smartEraserMode = e.target.checked;
            statusEl.textContent = smartEraserMode ? 'Smart eraser: click deletes entire area' : 'Normal eraser: erases in parts';
        });

        // Очистка всех рисунков карандашом
        document.getElementById('clearDrawings').addEventListener('click', () => {
            if (drawnStrokes.length > 0 || filledRegions.length > 0 || backgroundFills.length > 0) {
                if (confirm('Delete all drawn strokes and filled areas?')) {
                    drawnStrokes = [];
                    filledRegions = [];
                    backgroundFills = [];
                    saveState(); // Теперь очистку можно отменить через Ctrl+Z
                    statusEl.textContent = 'All drawings deleted (Ctrl+Z to undo)';
                }
            } else {
                statusEl.textContent = 'No drawings to delete';
            }
        });

        // Перетаскивание палитры цветов
        (function() {
            const palette = document.getElementById('colorPalette');
            const handle = document.getElementById('paletteHandle');
            let isDragging = false;
            let offsetX = 0;
            let offsetY = 0;

            handle.addEventListener('mousedown', (e) => {
                // Шапка палитры - и место для перетаскивания, и место кнопки закрытия.
                // Перетаскивание - только на десктопе (на телефоне/планшете палитра - боковая панель).
                if (e.target.closest('.close-panel') || currentLayout !== 'desktop') return;
                isDragging = true;
                const rect = palette.getBoundingClientRect();
                offsetX = e.clientX - rect.left;
                offsetY = e.clientY - rect.top;
                palette.style.cursor = 'grabbing';
                e.preventDefault();
            });

            document.addEventListener('mousemove', (e) => {
                if (!isDragging) return;

                // Вычисляем новую позицию
                let newLeft = e.clientX - offsetX;
                let newTop = e.clientY - offsetY;

                // Ограничиваем перемещение в пределах окна
                const paletteRect = palette.getBoundingClientRect();
                const maxLeft = window.innerWidth - paletteRect.width;
                const maxTop = window.innerHeight - paletteRect.height;

                newLeft = Math.max(0, Math.min(newLeft, maxLeft));
                newTop = Math.max(0, Math.min(newTop, maxTop));

                // Убираем центрирование и используем абсолютные координаты
                palette.style.left = newLeft + 'px';
                palette.style.top = newTop + 'px';
                palette.style.bottom = 'auto';
                palette.style.transform = 'none';
            });

            document.addEventListener('mouseup', () => {
                if (isDragging) {
                    isDragging = false;
                    palette.style.cursor = '';
                }
            });
        })();

        // === ОБЩИЕ ОПЕРАЦИИ РЕДАКТОРА ===
        // Мышь и тач используют одни и те же функции. Раньше у них были отдельные копии логики,
        // и они разошлись: на тач-экране обычный ластик удалял штрихи целиком и был в 4 раза
        // меньше, заливка молекулы не применяла эффекты, а удаление долгим нажатием нельзя было отменить.

        function getCanvasPoint(clientX, clientY) {
            const rect = canvas.getBoundingClientRect();
            return {
                x: (clientX - rect.left) * (canvas.width / rect.width),
                y: (clientY - rect.top) * (canvas.height / rect.height)
            };
        }

        // Верхняя молекула под точкой (radiusFactor расширяет зону попадания)
        function findMoleculeAt(x, y, radiusFactor = 1) {
            for (let i = molecules.length - 1; i >= 0; i--) {
                const mol = molecules[i];
                const dx = x - mol.x;
                const dy = y - mol.y;
                if (Math.sqrt(dx * dx + dy * dy) < mol.size * radiusFactor) {
                    return mol;
                }
            }
            return null;
        }

        // Перемещение/масштаб молекулы пальцем. В режиме жестов молекула плавно догоняет цель
        // в update(), а в редакторе update() не вызывается - там меняем позицию сразу.
        function moveMoleculeTo(mol, x, y) {
            mol.targetX = x;
            mol.targetY = y;
            if (editorMode) {
                mol.x = x;
                mol.y = y;
            }
        }

        function resizeMolecule(mol, size) {
            mol.targetSize = size;
            if (editorMode) {
                mol.size = size;
                mol.baseSize = size;
            }
        }

        function fillModeText() {
            return fillMode === 'interior' ? 'interior' : fillMode === 'edge' ? 'edge' : 'interior+edge';
        }

        // Заливка молекулы цветом и эффектами из палитры
        function fillMolecule(mol) {
            if (fillMode === 'interior' || fillMode === 'both') {
                mol.fillColor = primaryColor;
            }
            if (fillMode === 'edge' || fillMode === 'both') {
                mol.edgeColor = primaryColor;
            }

            // Применяем эффекты если включены
            mol.emboss = document.getElementById('embossEffect').checked;
            mol.microStripes = document.getElementById('microStripesEffect').checked;

            // Сохраняем настройки микрополосок если эффект включен
            if (mol.microStripes) {
                mol.stripeColor1 = document.getElementById('stripeColor1').value;
                mol.stripeColor2 = document.getElementById('stripeColor2').value;
                mol.stripeWidth = parseInt(document.getElementById('stripeWidth').value, 10);
                mol.stripeSpacing = parseInt(document.getElementById('stripeSpacing').value, 10);
            }

            const effects = [];
            if (mol.emboss) effects.push('emboss');
            if (mol.microStripes) effects.push('stripes');
            const effectsSuffix = effects.length > 0 ? ' + ' + effects.join(' + ') : '';
            statusEl.textContent = `Filled ${fillModeText()} with ${primaryColor}${effectsSuffix}`;
            saveState(); // Сохраняем состояние для отмены
        }

        // Ластик по молекуле: убирает заливку в зависимости от режима
        function eraseMoleculeFill(mol) {
            const before = `${mol.fillColor}|${mol.edgeColor}|${mol.emboss}|${mol.microStripes}`;

            if (fillMode === 'interior' || fillMode === 'both') {
                mol.fillColor = null;
            }
            if (fillMode === 'edge' || fillMode === 'both') {
                mol.edgeColor = null;
            }
            mol.emboss = false; // Убираем тиснение
            mol.microStripes = false; // Убираем полоски

            if (before !== `${mol.fillColor}|${mol.edgeColor}|${mol.emboss}|${mol.microStripes}`) {
                statusEl.textContent = `Erased ${fillModeText()} of molecule`;
                saveState(); // Сохраняем состояние для отмены
            }
        }

        // Заливка замкнутой области, нарисованной карандашом
        function fillAreaAt(x, y) {
            const fillResult = floodFillStrokes(x, y, primaryColor);
            if (fillResult === 'too_large') {
                statusEl.textContent = 'Area too large! Draw a closed shape with pencil';
            } else if (fillResult) {
                // Если заливка занимает более 30% экрана - это фоновая заливка (рисуется под молекулами)
                const areaRatio = (fillResult.width * fillResult.height) / (canvas.width * canvas.height);
                if (areaRatio > 0.3) {
                    backgroundFills.push(fillResult);
                    statusEl.textContent = `Background filled with ${primaryColor}`;
                } else {
                    filledRegions.push(fillResult);
                    statusEl.textContent = `Area filled with ${primaryColor}`;
                }
                saveState(); // Сохраняем состояние для отмены
            } else {
                statusEl.textContent = 'Nothing to fill (click inside a closed area)';
            }
        }

        // Функция проверки пересечения точки с линией (для ластика)
        function distanceToLineSegment(px, py, x1, y1, x2, y2) {
            const A = px - x1;
            const B = py - y1;
            const C = x2 - x1;
            const D = y2 - y1;

            const dot = A * C + B * D;
            const lenSq = C * C + D * D;
            let param = -1;

            if (lenSq != 0) param = dot / lenSq;

            let xx, yy;

            if (param < 0) {
                xx = x1;
                yy = y1;
            } else if (param > 1) {
                xx = x2;
                yy = y2;
            } else {
                xx = x1 + param * C;
                yy = y1 + param * D;
            }

            const dx = px - xx;
            const dy = py - yy;
            return Math.sqrt(dx * dx + dy * dy);
        }

        // Попадание в видимую часть штриха (проверяются и точки, и отрезки между ними:
        // при быстром движении мыши точки идут редко, и клик по середине линии раньше "промахивался")
        function strokeHitTest(stroke, x, y, tolerance) {
            const points = stroke.points;
            for (let i = 0; i < points.length; i++) {
                const p = points[i];
                if (p.erased) continue;
                if (Math.hypot(p.x - x, p.y - y) < tolerance) return true;
                const prev = points[i - 1];
                if (prev && !prev.erased && distanceToLineSegment(x, y, prev.x, prev.y, p.x, p.y) < tolerance) {
                    return true;
                }
            }
            return false;
        }

        function strokeHasVisibleSegment(stroke) {
            const points = stroke.points;
            for (let i = 1; i < points.length; i++) {
                if (!points[i].erased && !points[i - 1].erased) return true;
            }
            return false;
        }

        // Точка попадает в непрозрачный пиксель залитой области?
        function regionHitTest(region, x, y) {
            if (x < region.x || x >= region.x + region.width || y < region.y || y >= region.y + region.height) {
                return false;
            }
            const px = Math.floor(x - region.x);
            const py = Math.floor(y - region.y);
            return region.imageData.data[(py * region.width + px) * 4 + 3] > 0;
        }

        function regionHasPixels(region) {
            const data = region.imageData.data;
            for (let i = 3; i < data.length; i += 4) {
                if (data[i] !== 0) return true;
            }
            return false;
        }

        // ✨ УМНЫЙ ЛАСТИК: удаляет штрих или заливку целиком по одному клику
        function smartEraseAt(x, y, reportNothing = true) {
            let deletedSomething = false;

            // Удаляем штрих целиком (если режим edge или both)
            if (fillMode === 'edge' || fillMode === 'both') {
                const initialLength = drawnStrokes.length;
                drawnStrokes = drawnStrokes.filter(stroke => !strokeHitTest(stroke, x, y, Math.max(stroke.width * 2, 6)));
                if (drawnStrokes.length < initialLength) {
                    deletedSomething = true;
                    statusEl.textContent = 'Contour deleted';
                }
            }

            // Удаляем залитую область целиком (если режим interior или both)
            if (fillMode === 'interior' || fillMode === 'both') {
                const initialLength = filledRegions.length + backgroundFills.length;
                filledRegions = filledRegions.filter(region => !regionHitTest(region, x, y));
                backgroundFills = backgroundFills.filter(region => !regionHitTest(region, x, y));
                if (filledRegions.length + backgroundFills.length < initialLength) {
                    deletedSomething = true;
                    statusEl.textContent = 'Fill deleted';
                }
            }

            if (deletedSomething) {
                saveState(); // Сохраняем состояние для отмены
            } else if (reportNothing) {
                statusEl.textContent = 'Nothing to delete (click on contour or fill)';
            }
        }

        // ОБЫЧНЫЙ ЛАСТИК: стирает постепенно в области курсора
        let eraserChanged = false;         // Стёр ли что-нибудь текущий проход ластика
        const erasedRegions = new Set();   // Области, изменённые текущим проходом

        function beginErasing() {
            eraserChanged = false;
            erasedRegions.clear();
        }

        // Стирает круг в пикселях области. Пиксели копируются перед изменением (copy-on-write),
        // потому что те же ImageData используются снимками истории.
        function eraseCircleInRegion(region, cx, cy, radius) {
            const lx = cx - region.x;
            const ly = cy - region.y;
            const minX = Math.max(0, Math.floor(lx - radius));
            const maxX = Math.min(region.width - 1, Math.ceil(lx + radius));
            const minY = Math.max(0, Math.floor(ly - radius));
            const maxY = Math.min(region.height - 1, Math.ceil(ly + radius));
            if (minX > maxX || minY > maxY) return; // Круг не задевает область

            const radiusSq = radius * radius;
            let data = region.imageData.data;
            let writable = false;

            for (let py = minY; py <= maxY; py++) {
                for (let px = minX; px <= maxX; px++) {
                    const dx = px - lx;
                    const dy = py - ly;
                    if (dx * dx + dy * dy > radiusSq) continue;

                    const alphaIndex = (py * region.width + px) * 4 + 3;
                    if (data[alphaIndex] === 0) continue;

                    if (!writable) {
                        makeRegionWritable(region);
                        data = region.imageData.data;
                        writable = true;
                    }
                    data[alphaIndex] = 0; // Делаем прозрачным
                }
            }

            if (writable) {
                eraserChanged = true;
                erasedRegions.add(region);
            }
        }

        function eraseAt(x, y) {
            const eraserSize = pencilWidth * 8;

            // Стираем штрихи под ластиком (если режим edge или both) - помечаем точки как стёртые
            if (fillMode === 'edge' || fillMode === 'both') {
                for (const stroke of drawnStrokes) {
                    const points = stroke.points;
                    for (let i = 0; i < points.length; i++) {
                        const point = points[i];
                        if (!point.erased && Math.hypot(point.x - x, point.y - y) < eraserSize) {
                            point.erased = true;
                            eraserChanged = true;
                        }

                        // Также проверяем линию между текущей и предыдущей точкой
                        const prevPoint = points[i - 1];
                        if (prevPoint && !prevPoint.erased && !point.erased &&
                            distanceToLineSegment(x, y, prevPoint.x, prevPoint.y, point.x, point.y) < eraserSize) {
                            point.erased = true;
                            prevPoint.erased = true;
                            eraserChanged = true;
                        }
                    }
                }
            }

            // Стираем залитые области (если режим interior или both)
            if (fillMode === 'interior' || fillMode === 'both') {
                for (const region of filledRegions) eraseCircleInRegion(region, x, y, eraserSize);
                for (const region of backgroundFills) eraseCircleInRegion(region, x, y, eraserSize);
            }
        }

        function finishErasing() {
            if (eraserChanged) {
                // Полностью стёртые штрихи и области убираем, чтобы они не рисовались впустую каждый кадр
                drawnStrokes = drawnStrokes.filter(strokeHasVisibleSegment);
                filledRegions = filledRegions.filter(r => !erasedRegions.has(r) || regionHasPixels(r));
                backgroundFills = backgroundFills.filter(r => !erasedRegions.has(r) || regionHasPixels(r));
                saveState(); // Сохраняем состояние после стирания
                statusEl.textContent = `Erased | Strokes: ${drawnStrokes.length}, Fills: ${filledRegions.length + backgroundFills.length}`;
            }
            eraserChanged = false;
            erasedRegions.clear();
        }

        // Нажатие инструментом рисования (мышь или палец)
        function paintPointerDown(x, y) {
            const mol = findMoleculeAt(x, y);

            if (currentTool === 'fill') {
                if (mol) {
                    fillMolecule(mol);
                } else {
                    fillAreaAt(x, y);
                }
            } else if (currentTool === 'pencil') {
                // Начинаем новый штрих
                isDrawing = true;
                currentStroke = {
                    points: [{ x, y }],
                    color: primaryColor,
                    width: pencilWidth
                };
            } else if (currentTool === 'eraser') {
                if (mol) {
                    eraseMoleculeFill(mol);
                }
                if (smartEraserMode) {
                    smartEraseAt(x, y, !mol);
                } else {
                    isDrawing = true;
                    beginErasing();
                    eraseAt(x, y);
                }
            }
        }

        function paintPointerMove(x, y) {
            if (!isDrawing) return;
            if (currentTool === 'pencil' && currentStroke) {
                currentStroke.points.push({ x, y });
            } else if (currentTool === 'eraser' && !smartEraserMode) {
                eraseAt(x, y);
            }
        }

        // Завершение текущего действия: перетаскивания молекулы, штриха или прохода ластика
        let dragMoved = false; // Было ли реальное изменение при перетаскивании (иначе не засоряем историю)

        function finishPointerAction() {
            if (isDraggingMolecule) {
                isDraggingMolecule = false;
                if (dragMoved) {
                    saveState();
                    statusEl.textContent = 'Operation completed';
                }
                dragMoved = false;
                return;
            }

            if (!isDrawing) return;
            isDrawing = false;

            if (currentTool === 'pencil') {
                // Сохраняем завершенный штрих
                if (currentStroke && currentStroke.points.length > 1) {
                    drawnStrokes.push(currentStroke);
                    statusEl.textContent = `Drew ${drawnStrokes.length} strokes`;
                    saveState(); // Сохраняем состояние для отмены
                }
                currentStroke = null;
            } else if (currentTool === 'eraser') {
                finishErasing();
            }
        }

        // Функция заливки области (flood fill) - работает на отдельном слое со штрихами
        const MAX_FILL_AREA = 2000000; // Максимум 2 миллиона пикселей (достаточно для больших фигур)

        function floodFillStrokes(startX, startY, fillColor) {
            const w = canvas.width;
            const h = canvas.height;
            startX = Math.floor(startX);
            startY = Math.floor(startY);

            if (startX < 0 || startX >= w || startY < 0 || startY >= h) {
                return null;
            }

            // Рисуем штрихи на временном canvas. Стёртые участки пропускаются - раньше они
            // оставались невидимыми "стенками" и заливка не проходила сквозь стёртые места.
            const tempCanvas = document.createElement('canvas');
            tempCanvas.width = w;
            tempCanvas.height = h;
            const tempCtx = tempCanvas.getContext('2d', { willReadFrequently: true });
            for (const stroke of drawnStrokes) {
                drawStroke(tempCtx, stroke);
            }
            const pixels = tempCtx.getImageData(0, 0, w, h).data;

            // Если кликнули на штрих (непрозрачный пиксель), не заливаем
            const startPos = startY * w + startX;
            if (pixels[startPos * 4 + 3] !== 0) {
                return null;
            }

            // Преобразуем цвет заливки в RGB
            const colorCanvas = document.createElement('canvas');
            colorCanvas.width = 1;
            colorCanvas.height = 1;
            const colorCtx = colorCanvas.getContext('2d', { willReadFrequently: true });
            colorCtx.fillStyle = fillColor;
            colorCtx.fillRect(0, 0, 1, 1);
            const [fillR, fillG, fillB] = colorCtx.getImageData(0, 0, 1, 1).data;

            // Маска залитых пикселей и стек индексов вместо Set строк "x,y":
            // на больших областях старый вариант создавал миллионы строк и заметно подвисал.
            // Пиксель помечается при добавлении в стек, поэтому каждый попадает в стек не более раза.
            const mask = new Uint8Array(w * h);
            const stack = [startPos];
            mask[startPos] = 1;
            let filledCount = 1;
            let minX = startX, maxX = startX, minY = startY, maxY = startY;

            const tryPush = (pos) => {
                if (mask[pos] === 0 && pixels[pos * 4 + 3] === 0) {
                    mask[pos] = 1;
                    filledCount++;
                    stack.push(pos);
                }
            };

            while (stack.length > 0) {
                // Проверяем размер области - если слишком большая, отменяем заливку
                if (filledCount > MAX_FILL_AREA) {
                    return 'too_large';
                }

                const pos = stack.pop();
                const x = pos % w;
                const y = (pos - x) / w;

                // Обновляем границы
                if (x < minX) minX = x;
                if (x > maxX) maxX = x;
                if (y < minY) minY = y;
                if (y > maxY) maxY = y;

                // Добавляем соседей
                if (x + 1 < w) tryPush(pos + 1);
                if (x > 0) tryPush(pos - 1);
                if (y + 1 < h) tryPush(pos + w);
                if (y > 0) tryPush(pos - w);
            }

            // Создаём обрезанный imageData только для залитой области
            // (пиксели штрихов внутри прямоугольника остаются прозрачными)
            const fillWidth = maxX - minX + 1;
            const fillHeight = maxY - minY + 1;
            const fillImageData = new ImageData(fillWidth, fillHeight);
            const out = fillImageData.data;

            for (let y = minY; y <= maxY; y++) {
                const rowStart = y * w;
                for (let x = minX; x <= maxX; x++) {
                    if (mask[rowStart + x] === 0) continue;
                    const dstIndex = ((y - minY) * fillWidth + (x - minX)) * 4;
                    out[dstIndex] = fillR;
                    out[dstIndex + 1] = fillG;
                    out[dstIndex + 2] = fillB;
                    out[dstIndex + 3] = 255;
                }
            }

            return {
                imageData: fillImageData,
                x: minX,
                y: minY,
                width: fillWidth,
                height: fillHeight
            };
        }

        // === МЫШЬ ===

        // Нажатие инструментом молекул (select / create / delete) - работают в ОБОИХ режимах
        function moleculeToolPointerDown(x, y) {
            if (moleculeTool === 'select') {
                // Выбираем молекулу под курсором
                selectedMoleculeUI = findMoleculeAt(x, y, 1.5);
                if (selectedMoleculeUI) {
                    const mol = selectedMoleculeUI;
                    isDraggingMolecule = true;
                    dragMoved = false;
                    // Сохраняем все начальные значения для возможного редактирования
                    dragOffsetX = x - mol.x;
                    dragOffsetY = y - mol.y;
                    editStartX = x;
                    editStartY = y;
                    editStartRadius = mol.size;
                    editStartStretchX = mol.stretchX;
                    editStartStretchY = mol.stretchY;
                    editStartAngle = mol.deformAngle;
                    statusEl.textContent = 'Molecule selected (mouse=move, Ctrl/Cmd=size, Shift=stretch, Alt=rotate)';
                } else {
                    statusEl.textContent = 'Click a molecule to select it';
                    showCreateToolHint();
                }
            } else if (moleculeTool === 'create') {
                // Создаем новую молекулу с размером из панели параметров
                const newMol = createMoleculeAt(x, y);
                if (newMol) {
                    statusEl.textContent = `Created molecule (shape: ${selectedShape}, size: ${config.moleculeSize})`;
                }
            } else if (moleculeTool === 'delete') {
                // Удаляем молекулу под курсором
                const mol = findMoleculeAt(x, y, 1.5);
                if (mol && removeMolecule(mol)) {
                    saveState();
                    statusEl.textContent = 'Molecule deleted';
                } else {
                    statusEl.textContent = 'Click molecule to delete';
                }
            }
        }

        canvas.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return; // Только левая кнопка
            const { x, y } = getCanvasPoint(e.clientX, e.clientY);

            // === ИНСТРУМЕНТЫ ДЛЯ МОЛЕКУЛ (работают в ОБОИХ режимах) ===
            if (!currentTool && moleculeTool) {
                moleculeToolPointerDown(x, y);
                return;
            }

            // === ИНСТРУМЕНТЫ РЕДАКТОРА (заливка, карандаш, ластик) ===
            if (editorMode && currentTool) {
                paintPointerDown(x, y);
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const { x, y } = getCanvasPoint(e.clientX, e.clientY);

            // Сохраняем позицию мыши для вставки
            lastMouseX = x;
            lastMouseY = y;

            // === ПЕРЕМЕЩЕНИЕ И РЕДАКТИРОВАНИЕ МОЛЕКУЛ (работают в ОБОИХ режимах) ===
            if (!currentTool && isDraggingMolecule && selectedMoleculeUI) {
                const mol = selectedMoleculeUI;
                dragMoved = true;

                // Проверяем зажатые клавиши-модификаторы для определения режима.
                // Cmd на Mac: Ctrl+клик там открывает контекстное меню и обрывает перетаскивание.
                if (e.ctrlKey || e.metaKey) {
                    // Ctrl/Cmd: вертикальное движение = размер
                    const deltaY = editStartY - y; // Вверх = увеличение, вниз = уменьшение
                    const newSize = clampMoleculeSize(editStartRadius + deltaY * 0.5);
                    mol.size = newSize;
                    mol.targetSize = newSize;
                    mol.baseSize = newSize;
                    statusEl.textContent = `Size: ${Math.round(newSize)}px (Ctrl/Cmd+mouse up/down)`;
                } else if (e.altKey) {
                    // Alt: горизонтальное движение = вращение
                    const deltaX = (x - editStartX) * 0.01;
                    mol.deformAngle = (editStartAngle + deltaX) % (Math.PI * 2);
                    const degrees = (mol.deformAngle * 180 / Math.PI).toFixed(0);
                    statusEl.textContent = `Rotation: ${degrees}° (Alt+mouse left/right)`;
                } else if (e.shiftKey) {
                    // Shift: свободное растяжение по обеим осям
                    const deltaX = (x - editStartX) * 0.01;
                    const deltaY = -(y - editStartY) * 0.01;
                    mol.stretchX = Math.max(0.2, Math.min(5.0, editStartStretchX + deltaX));
                    mol.stretchY = Math.max(0.2, Math.min(5.0, editStartStretchY + deltaY));
                    statusEl.textContent = `Stretch X: ${mol.stretchX.toFixed(2)}, Y: ${mol.stretchY.toFixed(2)} (Shift+mouse)`;
                } else {
                    // Без модификаторов: перемещение
                    mol.x = x - dragOffsetX;
                    mol.y = y - dragOffsetY;
                    mol.targetX = mol.x;
                    mol.targetY = mol.y;
                    statusEl.textContent = 'Moving (Ctrl/Cmd=size, Shift=stretch, Alt=rotate)';
                }
                return;
            }

            if (!editorMode) return;

            // Подсветка молекулы под курсором (для заливки и ластика) и курсор инструмента
            hoveredMoleculeEditor = findMoleculeAt(x, y);
            if (currentTool) {
                canvas.style.cursor = getPaintCursor(currentTool, !!hoveredMoleculeEditor);
            }

            // === КАРАНДАШ И ЛАСТИК ===
            paintPointerMove(x, y);
        });

        canvas.addEventListener('mouseleave', () => {
            hoveredMoleculeEditor = null;
        });

        // Ctrl+клик на Mac вызывает контекстное меню - не даём ему прервать редактирование молекулы
        canvas.addEventListener('contextmenu', (e) => {
            if (isDraggingMolecule) e.preventDefault();
        });

        // Один глобальный обработчик: кнопка может быть отпущена и вне canvas.
        // blur - на случай переключения окна посреди перетаскивания (mouseup тогда не придёт).
        document.addEventListener('mouseup', finishPointerAction);
        window.addEventListener('blur', finishPointerAction);

        // === ОБРАБОТЧИК КОЛЁСИКА МЫШИ ДЛЯ ИЗМЕНЕНИЯ РАЗМЕРА ===
        let wheelSaveTimer = null;
        canvas.addEventListener('wheel', (e) => {
            // Работает только если выбрана молекула и активен инструмент select
            if (!currentTool && moleculeTool === 'select' && selectedMoleculeUI) {
                e.preventDefault(); // Предотвращаем прокрутку страницы

                // Определяем направление прокрутки (вверх = увеличение, вниз = уменьшение)
                const delta = -Math.sign(e.deltaY) * 5; // Шаг изменения размера
                const newSize = clampMoleculeSize(selectedMoleculeUI.size + delta);

                selectedMoleculeUI.size = newSize;
                selectedMoleculeUI.targetSize = newSize;
                selectedMoleculeUI.baseSize = newSize;

                statusEl.textContent = `Size: ${Math.round(newSize)}px (mouse wheel)`;

                // Серия прокруток = один шаг истории
                clearTimeout(wheelSaveTimer);
                wheelSaveTimer = setTimeout(saveState, 400);
            }
        }, { passive: false }); // passive: false чтобы preventDefault работал

        // === КЛАВИАТУРА: отмена/повтор, копирование, удаление ===
        // Используем e.code, чтобы сочетания работали на любой раскладке
        document.addEventListener('keydown', (e) => {
            const mod = e.ctrlKey || e.metaKey;

            // Ctrl+Z - отмена, Ctrl+Shift+Z / Ctrl+Y - повтор
            if (mod && e.code === 'KeyZ') {
                e.preventDefault(); // Предотвращаем стандартное поведение браузера
                if (e.shiftKey) {
                    redo();
                } else {
                    undo();
                }
                return;
            }
            if (mod && e.code === 'KeyY') {
                e.preventDefault();
                redo();
                return;
            }

            // Ctrl+C - копирование выбранной молекулы
            if (mod && e.code === 'KeyC') {
                if (selectedMoleculeUI) {
                    e.preventDefault();
                    // Копируем все свойства молекулы (новая молекула не должна быть заблокирована)
                    copiedMolecule = { ...selectedMoleculeUI.toSnapshot(), isLocked: false, isShapeLocked: false };
                    statusEl.textContent = 'Molecule copied (Ctrl+V to paste)';
                } else {
                    statusEl.textContent = 'Select molecule to copy';
                }
                return;
            }

            // Ctrl+V - вставка молекулы
            if (mod && e.code === 'KeyV') {
                if (!copiedMolecule) {
                    statusEl.textContent = 'First copy a molecule (Ctrl+C)';
                    return;
                }
                e.preventDefault();
                if (molecules.length >= maxMolecules) {
                    statusEl.textContent = `Molecule limit reached (${maxMolecules})`;
                    return;
                }

                // Вставляем под курсором мыши (или в центр, если мышь ещё не двигалась)
                const pasteX = lastMouseX || width / 2;
                const pasteY = lastMouseY || height / 2;
                const newMol = Molecule.fromSnapshot({ ...copiedMolecule, x: pasteX, y: pasteY });

                molecules.push(newMol);
                saveState();

                // Выбираем вставленную молекулу
                selectedMoleculeUI = newMol;
                statusEl.textContent = `Molecule pasted (x: ${Math.round(pasteX)}, y: ${Math.round(pasteY)})`;
                return;
            }

            // Delete / Backspace (клавиша "delete" на Mac) - удаление выбранной молекулы
            if (e.code === 'Delete' || e.code === 'Backspace') {
                if (selectedMoleculeUI) {
                    e.preventDefault();
                    if (removeMolecule(selectedMoleculeUI)) {
                        saveState();
                        statusEl.textContent = 'Molecule deleted';
                    }
                } else {
                    statusEl.textContent = 'Select molecule to delete';
                }
                return;
            }

            // Escape - снять выделение
            if (e.code === 'Escape' && selectedMoleculeUI) {
                selectedMoleculeUI = null;
                isDraggingMolecule = false;
                statusEl.textContent = 'Selection cleared';
            }
        });

        // === СТИЛУС (Apple Pencil, перо Wacom/Surface) ===
        // Перо обрабатывается через Pointer Events. В режиме редактора перо рисует линии с толщиной
        // по силе нажатия. С выбранной заливкой: тап пером заливает, ведение пером - рисует.
        // С ластиком перо стирает. Пока перо касается экрана и полсекунды после - касания
        // пальцем/ладонью по холсту игнорируются.
        const PALM_REJECTION_MS = 500;
        const PEN_TAP_TOLERANCE = 4; // px: меньше - это тап (заливка), больше - штрих
        let penActive = false;
        let penStroke = false;     // Перо рисует карандашом
        let penTapPending = null;  // Заливка: точка касания, пока не ясно - тап это или штрих
        let penLastUpTime = -Infinity;

        function penWidth(pressure) {
            // Некоторые устройства отдают 0, если сила нажатия неизвестна - считаем среднее нажатие
            const p = pressure > 0 ? pressure : 0.5;
            return Math.max(1, pencilWidth * (0.3 + p * 1.4));
        }

        function isPenBlockingTouch() {
            return penActive || performance.now() - penLastUpTime < PALM_REJECTION_MS;
        }

        function startPenStroke(x, y, pressure) {
            penStroke = true;
            isDrawing = true;
            currentStroke = {
                points: [{ x, y, w: penWidth(pressure) }],
                color: primaryColor,
                width: pencilWidth,
                pressure: true
            };
        }

        canvas.addEventListener('pointerdown', (e) => {
            if (e.pointerType !== 'pen' || !editorMode) return;
            // Отменяет "совместимые" mousedown/mouseup для пера - иначе штрих обработался бы дважды
            e.preventDefault();
            penActive = true;
            penStroke = false;
            penTapPending = null;
            canvas.setPointerCapture(e.pointerId);

            const { x, y } = getCanvasPoint(e.clientX, e.clientY);
            if (currentTool === 'eraser') {
                paintPointerDown(x, y);
            } else if (currentTool === 'fill') {
                penTapPending = { x, y, pressure: e.pressure };
            } else {
                startPenStroke(x, y, e.pressure);
            }
        });

        canvas.addEventListener('pointermove', (e) => {
            if (e.pointerType !== 'pen' || !penActive) return;
            e.preventDefault();
            // Промежуточные точки между кадрами: без них быстрые линии пером получаются "ломаными"
            const events = e.getCoalescedEvents ? e.getCoalescedEvents() : [e];
            for (const ev of (events.length > 0 ? events : [e])) {
                const { x, y } = getCanvasPoint(ev.clientX, ev.clientY);
                if (penTapPending) {
                    if (Math.hypot(x - penTapPending.x, y - penTapPending.y) <= PEN_TAP_TOLERANCE) continue;
                    // Перо повели - это не тап, а линия
                    startPenStroke(penTapPending.x, penTapPending.y, penTapPending.pressure);
                    penTapPending = null;
                }
                if (penStroke && currentStroke) {
                    currentStroke.points.push({ x, y, w: penWidth(ev.pressure) });
                } else {
                    paintPointerMove(x, y);
                }
            }
        });

        function finishPen(e) {
            if (e.pointerType !== 'pen' || !penActive) return;
            penActive = false;
            penLastUpTime = performance.now();

            if (penTapPending) {
                // Тап пером при выбранной заливке
                const { x, y } = penTapPending;
                penTapPending = null;
                paintPointerDown(x, y);
            } else if (penStroke) {
                penStroke = false;
                isDrawing = false;
                if (currentStroke && currentStroke.points.length > 1) {
                    drawnStrokes.push(currentStroke);
                    statusEl.textContent = `Drew ${drawnStrokes.length} strokes (pen)`;
                    saveState();
                }
                currentStroke = null;
            } else {
                finishPointerAction();
            }
        }

        canvas.addEventListener('pointerup', finishPen);
        canvas.addEventListener('pointercancel', finishPen);

        // === TOUCH СОБЫТИЯ ДЛЯ МОБИЛЬНЫХ УСТРОЙСТВ ===
        if (isTouchDevice) {
            let longPressTimer = null;
            const LONG_PRESS_DURATION = 500; // мс
            const LONG_PRESS_MOVE_TOLERANCE = 10; // px: мелкое дрожание пальца не отменяет долгое нажатие
            let touchStartPoint = null;
            let touchChanged = false; // Перемещали/масштабировали молекулу (для истории)

            const cancelLongPress = () => {
                clearTimeout(longPressTimer);
                longPressTimer = null;
            };

            // В редакторе касания стилуса обрабатывает Pointer Events, а касания ладонью рядом
            // с пером - игнорируются (Safari присылает для Apple Pencil ещё и touch-события)
            const isPenTouch = (e) => editorMode &&
                (isPenBlockingTouch() || [...e.changedTouches].some(t => t.touchType === 'stylus'));

            canvas.addEventListener('touchstart', (e) => {
                e.preventDefault(); // Предотвращаем скролл и zoom на мобильных
                if (isPenTouch(e)) return;

                const touches = e.touches;

                if (touches.length === 1) {
                    // Одиночное касание
                    const { x, y } = getCanvasPoint(touches[0].clientX, touches[0].clientY);
                    touchStartPoint = { x, y };
                    touchChanged = false;

                    // РЕЖИМ РЕДАКТОРА - карандаш, ластик и заливка
                    if (editorMode && currentTool) {
                        paintPointerDown(x, y);
                        return;
                    }

                    touchedMolecule = findMoleculeAt(x, y);

                    // Инструмент "Delete" удаляет молекулу касанием
                    if (moleculeTool === 'delete') {
                        if (touchedMolecule && removeMolecule(touchedMolecule)) {
                            saveState();
                            statusEl.textContent = `Molecule deleted | ${molecules.length}/${maxMolecules}`;
                        }
                        touchedMolecule = null;
                        return;
                    }

                    if (touchedMolecule) {
                        // Касание молекулы: выделяем (для кнопок Lock/Unlock и смены формы) и перемещаем
                        if (moleculeTool === 'select') {
                            selectedMoleculeUI = touchedMolecule;
                        }

                        // Начинаем длинное нажатие для удаления
                        cancelLongPress();
                        longPressTimer = setTimeout(() => {
                            longPressTimer = null;
                            if (touchedMolecule && removeMolecule(touchedMolecule)) {
                                saveState();
                                statusEl.textContent = 'Molecule deleted (long press)';
                            }
                            touchedMolecule = null;
                            touchChanged = false;
                        }, LONG_PRESS_DURATION);

                        // Начинаем перемещение
                        touchedMolecule.isGrabbed = true;
                        moveMoleculeTo(touchedMolecule, x, y);
                    } else if (moleculeTool === 'create') {
                        // Касание пустого места создаёт молекулу - только инструментом Create
